# IAM の設定ファイルの例（開発用）。`iam serve -config iam.yaml` で使う。
# 起動時に決まるもの（アダプタ、フィーチャー、realm・Org が設定できる範囲）をここに書く（design.md 2.8）。

dev: true # 開発モード。本番では false（notifier の dev が使えなくなる）

server:
  public_addr: ":8080"
  admin_addr: "127.0.0.1:8081" # 管理 API は公開 API とポートを分ける
  multi_instance: false
  clock_skew_warn: 1s
  # リバースプロキシ・ロードバランサーの後ろに置くなら、その IP か CIDR を書く（X-Forwarded-For から接続元を求める。ADR 0088）
  # trusted_proxies: ["10.0.0.0/8"]
  # クライアント証明書の受け取り（X.509 の認証方式。フィーチャー x509。ADR 0103）
  # client_certificates:
  #   mtls_addr: ":8443"              # 証明書を求める TLS の専用の待ち受け（方式のログインと登録のパスだけ）
  #   cert_file: /etc/iam/tls.crt
  #   key_file: /etc/iam/tls.key
  #   header: X-SSL-Client-Cert       # TLS を終えるプロキシが証明書を渡すヘッダー
  #   header_format: pem              # pem（URL エンコードした PEM）か der_base64
  #   proxies: ["10.0.0.5"]           # ヘッダーを信じる直接の接続元（trusted_proxies とは別に書く）

storage:
  driver: sqlite
  path: iam.db
  auto_migrate: "true" # false なら `iam migrate` を明示的に実行する
  # PostgreSQL（複数のインスタンスから使う）は、上の storage を丸ごと次に置き換える（path は残さない）:
  # storage:
  #   driver: postgres
  #   dsn: postgres://iam:secret@db.example.com:5432/iam?sslmode=verify-full
  #   auto_migrate: "true"
  #   max_open_conns: "20" # 接続の上限（省略時は 10、0 なら上限なし）

ephemeral:
  driver: memory
  # Redis（複数のインスタンスで共有する）は、上の ephemeral を丸ごと次に置き換える:
  # ephemeral:
  #   driver: redis
  #   url: rediss://:secret@cache.example.com:6379/0
  #   prefix: "iam:"

keystore:
  driver: file
  path: keys.json # `iam keys generate -out keys.json` で作る。失うとデータを復号できない

event_sink:
  driver: stdout  # 監査ログの外部出力：stdout / syslog / otlp / webhook（ADR 0071）
  # options:
  #   format: iam                          # iam（独自の JSON）か ocsf
  #   pii: pseudonymize                    # IP と UA：raw / pseudonymize / omit（省けば、鍵があれば pseudonymize、無ければ omit）
  #   pseudonym_key_env: IAM_PSEUDONYM_KEY # 仮名化の鍵（32 バイト以上、16進か base64）を持つ環境変数
  #   # syslog: address: siem.example:6514, network: tls（既定。tcp / udp は平文）, facility: "13"
  #   # otlp:   endpoint: https://collector:4318/v1/logs, headers_env: IAM_OTLP_HEADERS（"Name=value,..."）
  #   # webhook: url: https://siem.example/iam, secret_env: IAM_WEBHOOK_SECRET（X-IAM-Signature で署名）

notifier:
  driver: dev

# features: [org, warnings]  # 省略すると各フィーチャーの既定に従う

# realm は既定の realm（root で動く）。フィーチャー multi_realm を有効にすると、他の realm を管理 API（/v1/admin/realms）で
# 実行中に作れる（ADR 0083）。timezone・verified_via・org_creation・*_deletion_grace・quota_count・email_storage は
# realm ごとに変えられ、ここの値が新しい realm の既定値になる。
realm:
  slug: default
  timezone: UTC
  org_creation: anyone  # 共有 Org を作れる人：anyone / operators_only / invite_only（運営者はいつでも作れる）
  org_deletion_grace: 30d  # Org の削除の猶予期間（その間は取り消せる。0 で猶予なし）
  user_deletion_grace: 30d  # アカウントの削除の猶予期間（その間はログインしても取り消しだけができる）
  client_data_retention: 30d  # 監査ログの IP と User-Agent の全文を読める期間（後は IP /24・/48 と UA の大分類だけが残る）
  quota_count:                 # Quota（フィーチャー quota）で数えるもの。active な Membership は必ず数える
    invited: true              # 受け入れ待ちの招待
    future: true               # 有効期間がまだ始まっていない Membership
    suspended: true            # 停止中の Membership
  audit_retention: 90d  # 監査ログの保持期間。過ぎたら先頭から切り詰め、チェックポイントを残して SIEM にも送る（0 で切り詰めない）
  ended_retention: 7d   # 失効・期限切れのセッション、配送済みの outbox、発火済みの予約イベントを残す期間（0 で消さない）
  email_storage: encrypted  # encrypted（暗号文 + インデックス）/ index_only（インデックスのみ。操作起点でない通知の宛先は外部が user_id から解決する）

# passkey の attestation（フィーチャー passkey_attestation。ADR 0096）。フィーチャーがオフなら無視する。
# passkey:
#   attestation:
#     conveyance: direct            # none（既定）/ indirect / direct / enterprise
#     metadata_root_file: ""        # MDS の BLOB の署名のルート（PEM）。空なら FIDO Alliance の本番のルート
#     metadata_refresh: 24h         # BLOB を読み直す間隔
#     trusted_authenticators:       # MDS に無い認証器の信頼の起点
#       - aaguid: 00000000-0000-0000-0000-000000000000
#         name: Corp Key
#         root_files: [/etc/iam/corp-key-root.pem]
# fido_mds:                         # MDS3 の BLOB の取得。driver: file（options.path）/ http（options.url、options.timeout）
#   driver: http
# realm.passkey_policy に realm の段の認証器のポリシーを置ける（allowed_aaguids・denied_aaguids・min_certification_level・require_attestation）

# SMS・音声の OTP とプッシュの承認（フィーチャー sms_otp・push_auth。ADR 0104）。フィーチャーがオンなら送信のアダプタが要る。
# SMS の事業者には宛先の番号とコードを入れた本文を、プッシュの中継には端末の宛先を渡す（0031 の例外）。
# sms_sender:                       # driver: dev（開発モードのみ）/ twilio
#   driver: twilio
#   options:
#     account_sid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#     auth_token_env: IAM_TWILIO_AUTH_TOKEN   # 読んだ後に消す。api_key_sid を置けば API Key の Secret
#     from: "+15005550006"                    # か messaging_service_sid（音声は from が要る）
#     sms_body: "Your verification code is {code}"
# push_sender:                      # driver: dev（開発モードのみ）/ webhook（運用者のプッシュの中継へ署名付きで POST）
#   driver: webhook
#   options: { url: https://push-relay.internal.example/iam, secret_env: IAM_PUSH_WEBHOOK_SECRET }
# methods:
#   sms:  { code_ttl: 5m, digits: "6", channels: "sms,voice", allowed_country_codes: "81,1", per_user: "5", per_number: "5", per_ip: "20", resend_interval: 30s }
#   push: { challenge_ttl: 2m, per_user: "5", per_ip: "20", deny_limit: "3", deny_window: 30m }
# realm.disabled_methods: [sms] で、realm ごとに方式を止められる

security:
  session:
    absolute_lifetime: { default: 30d, min: 1h, max: 90d }
    idle_timeout: { default: 7d, min: 5m, max: 30d }
    max_auth_age: { default: 15m, min: 1m, max: 1d }
    validity_max_delay: 30s  # 失効などが検証に反映されるまでの遅れの上限
    rotation_interval: 1h    # Cookie のセッションの ID を入れ替える間隔（0 で入れ替えない）
    rotation_grace: 1m       # 入れ替え前の ID を使える猶予

outbox:
  interval: 1s
  batch: 100

# 証明済みのドメインの確かめ直し（フィーチャー org_managed_users。ADR 0087）。
org_domains:
  recheck: 1d  # 1つのドメインの TXT を確かめ直す間隔（0 で確かめ直さない）
  grace: 7d    # TXT が見つからなくなってから証明を外すまでの猶予

# 採番の方式（ADR 0045）。内部 ID は DB の外に出さない。外部 ID に uuidv7 は使えない。
ids:
  internal: uuidv7
  external: random

oidc:
  code_ttl: 1m  # 認可コードの寿命（10分以下）
  id_token_ttl: 1h  # ID トークンの寿命
  access_token_ttl: 10m  # 不透明なアクセストークンの寿命（失効はイントロスペクションに validity_max_delay の内に効く）
  refresh_token_ttl: 30d  # リフレッシュトークンの寿命（ローテーションし、再利用を検知したらファミリーごと失効）
  retired_key_ttl: 7d  # ローテーションした古い署名鍵を JWKS に残す期間
  device_code_ttl: 10m  # Device Authorization Grant の device_code と user_code の寿命（30分以下。フィーチャー device_flow）
  device_poll_interval: 5s  # 端末のポーリングの最短の間隔（1秒から1分）
  impersonation:  # 運営者のなりすまし（フィーチャー impersonation。ADR 0099）
    token_ttl: 10m  # なりすましのアクセストークンの寿命（1時間以下）
    max_auth_age: 5m  # 運営者が直近に認証していなければならない時間（step-up）
    min_factors: 2  # 運営者のセッションに要る認証要素の数（0〜3）

service_accounts:  # 汎用サービスアカウント（フィーチャー service_accounts。ADR 0074）
  token_ttl: 10m  # client credentials で発行するアクセストークンの寿命（1時間以下）

personal_access_tokens:  # 本人の Personal Access Token（フィーチャー personal_access_tokens。ADR 0109）
  max_per_user: 50  # ユーザーごとの有効なトークンの上限
  max_lifetime: 0s  # 寿命の上限（0 なら上限なし。realm のポリシーはこれより長くできない）

# hooks:  # フロー フック（フィーチャー flow_hooks。ADR 0081）。url の無いフックは Go の実装（app.Deps.Hooks）で渡す
#   pre_registration:
#     url: https://hooks.example.com/iam  # 署名は X-IAM-Signature（通知の Webhook と同じ形）
#     secret_env: IAM_HOOK_SECRET          # 32 バイト以上。読んだ後に消す
#     timeout: 2s                          # 5 秒以下
#     fail_open: false                     # 失敗のときに通すか（既定は止める）

# methods:  # 認証方式のプラグインの設定（ADR 0103、0104。上の sms・push と同じ methods: の下に書く）
#   x509:
#     realms:
#       default:                                   # realm の slug。書いていない realm では方式を動かさない
#         trust_anchors: [/etc/iam/x509/root.pem]  # PEM のファイルか PEM そのもの
#         intermediates: []
#         extended_key_usages: [client_auth]       # client_auth・smartcard_logon・OID
#         mapping: san_upn                         # fingerprint（既定）・san_upn・san_email・subject_dn
#         hardware_issuers:                        # ハードウェアの鍵にだけ発行する CA。AAL3 に届く
#           - {certificate: /etc/iam/x509/piv-issuing.pem, pin_activation: true}
#         revocation: {mode: ocsp_crl, fail_open: false, cache_max: 1h, timeout: 5s}
#         max_credentials: 5
#   kerberos:                                      # Kerberos / SPNEGO（ADR 0107。フィーチャー kerberos）
#     realms:
#       default:                                   # realm の slug。書いていない realm では方式を動かさない
#         keytab: /etc/iam/http.keytab             # サービスの鍵（起動時に読む）
#         service_principal: HTTP/id.example.com@CORP.EXAMPLE.COM
#         accepted_realms: [CORP.EXAMPLE.COM]      # 受け付ける本人の realm（既定はサービスの realm）
#         max_clock_skew: 5m
#         case_insensitive_names: true             # Active Directory では true
#         allow_rc4: false                         # RC4-HMAC のチケットを受けるか（既定は AES だけ）
#         mapping:
#           rule: ldap                             # enrollment（既定。本人の登録）・email・ldap
#           ldap: {connection: corp-ad, attribute: userPrincipalName, value: principal}
#           # email_domains: {CORP.EXAMPLE.COM: example.com}   # rule: email のとき
#         max_credentials: 5                       # rule: enrollment で 1 人が登録できる数
