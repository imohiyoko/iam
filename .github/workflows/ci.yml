name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iam
          POSTGRES_PASSWORD: iam
          POSTGRES_DB: iam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iam" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # PostgreSQL のアダプタの契約テスト（未設定ならスキップする）。
      IAM_TEST_POSTGRES: postgres://iam:iam@127.0.0.1:5432/iam?sslmode=disable
      IAM_TEST_REDIS: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: go vet
        run: scripts/modules.sh go vet ./...
      - name: go test
        run: scripts/modules.sh go test -race -count=1 ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  generated:
    # 生成コード（sqlc、oapi-codegen）が定義と一致しているか。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: sqlc
        working-directory: adapters/storage/sqlite
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - name: pgport + sqlc (postgres)
        working-directory: adapters/storage/postgres
        run: |
          GOWORK=off go run ./cmd/pgport
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - name: oapi-codegen
        working-directory: api
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.1 -config oapi-public.yaml public.yaml
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.1 -config oapi-admin.yaml admin.yaml
      - name: diff
        run: |
          git add -N .
          git diff --exit-code

  build:
    # iam build が最小構成をビルドでき、選んだものだけが含まれる（design.md 11.11、ADR 0073）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: iam build (minimal)
        working-directory: cmd/iam
        run: |
          go run . build -f ../../build/minimal.yaml -o /tmp/iam-minimal -version ci
          /tmp/iam-minimal version -manifest | tee /tmp/manifest.json
          test "$(jq -c '[.features[].name]' /tmp/manifest.json)" = '["org","warnings"]'
          test "$(jq -c '.adapters.storage' /tmp/manifest.json)" = '["postgres"]'
          test "$(jq -c '.adapters.keystore' /tmp/manifest.json)" = '["env"]'
      - name: docker build (minimal)
        run: |
          docker build --build-arg BUILD_SPEC=build/minimal.yaml --build-arg VERSION=ci -t iam:minimal .
          docker run --rm iam:minimal version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: install tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: staticcheck
        run: scripts/modules.sh staticcheck ./...
      - name: gosec
        run: scripts/modules.sh gosec -quiet -exclude-generated ./...
      - name: govulncheck
        run: scripts/modules.sh govulncheck ./...

  bench:
    # 主要操作のレイテンシを計測し、bench/baseline.txt の上限と比べる（ADR 0044）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: benchmarks
        run: |
          set -o pipefail
          {
            (cd . && GOWORK=off go test -run '^$' -bench . -count 5 ./...)
            (cd adapters/storage/sqlite && GOWORK=off go test -run '^$' -bench . -count 5 ./...)
          } | tee bench.txt | scripts/benchcheck.sh bench/baseline.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench
          path: bench.txt
