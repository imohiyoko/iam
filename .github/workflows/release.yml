name: Release

# タグ（v*）で公式イメージ（全部入り・最小構成）とバイナリを作り、署名・SBOM・provenance を付ける（design.md 13.8、ADR 0073）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign のキーレス署名
      attestations: write
    strategy:
      matrix:
        include:
          - variant: all
            spec: ""
            suffix: ""
          - variant: minimal
            spec: build/minimal.yaml
            suffix: "-minimal"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_SPEC=${{ matrix.spec }}
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          # iam build の CLI はホスト向けに作り、実行時の GOOS/GOARCH を中の go build に引き継がせる。
          (cd cmd/iam && go build -o /tmp/iam-host .)
          for arch in amd64 arm64; do
            (cd cmd/iam && GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o ../../dist/iam-linux-$arch .)
            (cd cmd/iam && GOOS=linux GOARCH=$arch /tmp/iam-host build -f ../../build/minimal.yaml -o ../../dist/iam-minimal-linux-$arch -version "${GITHUB_REF_NAME}")
          done
          (cd dist && sha256sum iam-* > SHA256SUMS)
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/iam.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: sign
        run: |
          for f in dist/iam-* dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/iam-*
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes dist/*
