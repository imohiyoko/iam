openapi: 3.0.3
info:
  title: IAM public API
  version: v1
  description: |
    公開 API（ヘッドレス）。`/v1` でバージョニングする（design.md 2.5）。

    認証：ブラウザは Cookie（`__Host-iam_session`）、別ドメインのアプリは `Authorization: Bearer <token>`（5.2）。
    本人確認の前の失敗は理由を問わず `authentication_failed` を返す（4.9）。
    ログインの要求（`/v1/login/...`）は応答時間に下限を設け、本人確認の前の応答時間から理由を読めないようにする。
    回数の上限を超えると `429 rate_limited` を返す（接続元ごと。メールのフローの開始はアドレスごとにも数える）。

    パスの `{id}:revoke` のような動詞は、資源に対する操作を表す（design.md 4.13）。
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: ヘルスチェック
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: 依存先（Storage など）に問題がある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /.well-known/webauthn:
    get:
      operationId: getWebAuthnRelatedOrigins
      summary: passkey を使う origin の一覧（Related Origin Requests）
      description: |
        `passkey.rp_id` のドメインで返す内容。rp_id のドメインの外の origin で passkey を使うときに必要（design.md 2.5）。
      responses:
        "200":
          description: origin の一覧
          content:
            application/json:
              schema:
                type: object
                required: [origins]
                properties:
                  origins:
                    type: array
                    items: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/login/email:start:
    post:
      operationId: startEmailLogin
      summary: メールのコード・マジックリンクによる登録・ログインを始める
      description: |
        登録済みのアドレスならログイン、未登録なら登録のコードとリンクを通知する。どちらも同じ応答を返す（4.9）。
        `flow_id` は要求した側だけが持つ秘密で、検証のときに必要になる。ブラウザには `__Host-iam_flow` Cookie でも渡す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: 開始した（送信したかどうかは返さない）
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, expires_at]
                properties:
                  flow_id: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/email:verify:
    post:
      operationId: verifyEmailLogin
      summary: コードかマジックリンクのトークンでフローを完了する
      description: |
        `flow_id` は本文か `__Host-iam_flow` Cookie で渡す。`code` と `token` のどちらか1つを渡す。
        成功するとセッションを発行する。ブラウザには Cookie で、`return_token: true` なら本文でトークンを返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow_id: { type: string }
                code: { type: string }
                token: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/link:redeem:
    post:
      operationId: redeemLoginLink
      summary: 運営者が発行したログイン用リンクでログインする
      description: |
        トークンは1回限りで、期限がある（管理 API の `issueLoginLink` と `iam operator create` が発行する）。
        成功するとセッションを発行する。ブラウザには Cookie で、`return_token: true` なら本文でトークンを返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 1024 }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/oauth/{connection}:start:
    post:
      operationId: startOAuthLogin
      summary: 外部プロバイダ（OAuth / OIDC）による登録・ログインを始める
      description: |
        プロバイダの認可 URL を返す。ブラウザをそこへ移し、戻り先で受け取った `state` と `code` を
        `/v1/login/oauth:complete` に渡す。`flow_id` は要求した側だけが持つ秘密で、ブラウザには
        `__Host-iam_oauth` Cookie でも渡す。`redirect_uri` は connection の許可リストにあるものに限る（2.5）。
      parameters:
        - { name: connection, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri: { type: string }
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, authorization_url, expires_at]
                properties:
                  flow_id: { type: string }
                  authorization_url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/oauth:complete:
    post:
      operationId: completeOAuthLogin
      summary: プロバイダからの戻り（state と code）でフローを完了する
      description: |
        `flow_id` は本文か `__Host-iam_oauth` Cookie で渡す。外部 ID が紐付いていればログイン、未登録で
        プロバイダが確認済みのメールなら登録する。メールが別のユーザーで登録済みなら自動リンクせず
        `409 account_exists` を返す（4.2。ログインしてから連携する）。プロバイダがメールを確認済みとしていなければ
        `400 email_unverified`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                flow_id: { type: string }
                state: { type: string }
                code: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "409":
          description: メールが別のユーザーで登録済み（自動リンクしない）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/passkey:start:
    post:
      operationId: startPasskeyLogin
      summary: passkey でのログインを始める
      description: |
        `options` を `navigator.credentials.get()` に渡す（`PublicKeyCredential.parseRequestOptionsFromJSON(options.publicKey)`）。
        どのユーザーかは認証器が選ぶ（discoverable credential）。本人確認（UV）を求める。
        フロー ID は `__Host-iam_passkey` Cookie と本文で返す。
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/passkey:finish:
    post:
      operationId: finishPasskeyLogin
      summary: passkey でのログインを完了する
      description: |
        `credential` は `navigator.credentials.get()` の結果の JSON（`PublicKeyCredential.toJSON()`）。
        `flow_id` は本文か `__Host-iam_passkey` Cookie で渡す。成功するとセッションを発行する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                flow_id: { type: string }
                credential: { type: object, additionalProperties: true }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/second-factor/passkey:start:
    post:
      operationId: startSecondFactorPasskey
      summary: 2要素目の passkey の確認を始める
      description: |
        2要素目の確認待ち（`next: second_factor`）か登録だけ（`next: enroll`）のセッションで使う。本人の passkey に限り、
        本人確認（UV）は求めない。フロー ID は `__Host-iam_passkey` Cookie と本文で返す。passkey が無ければ 404。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/login/second-factor:verify:
    post:
      operationId: verifySecondFactor
      summary: 2要素目を確かめ、通常のセッションに替える
      description: |
        `totp_code`（認証器アプリの6桁）か、`credential`（`navigator.credentials.get()` の結果）のどちらかを送る。
        成功すると制限つきのセッションを失効させ、通常のセッションを発行する（amr に `mfa` を加える）。
        失敗の理由は返さない（4.9）。同じ時間窓の TOTP のコードは2度使えない。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                totp_code: { type: string }
                flow_id: { type: string }
                credential: { type: object, additionalProperties: true }
                return_token: { type: boolean }
      responses:
        "200":
          description: 確かめた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/logout:
    post:
      operationId: logout
      summary: 今のセッションを失効させる
      description: セッションが無い・無効でも 204 を返し、Cookie を消す。
      responses:
        "204":
          description: 失効した
          headers:
            Set-Cookie: { schema: { type: string } }

  /v1/me/sessions:
    get:
      operationId: listMySessions
      summary: 本人の有効なセッションの一覧
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 新しい順
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/sessions/{id}:revoke:
    post:
      operationId: revokeMySession
      summary: 本人のセッションを失効させる
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 失効した（既に失効していても 204） }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/methods:
    get:
      operationId: listMyMethods
      summary: 本人の認証手段（メール、連携した外部 ID、passkey、TOTP）の一覧
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 作成時刻の順
          content:
            application/json:
              schema:
                type: object
                required: [emails, identities, passkeys, totp]
                properties:
                  emails:
                    type: array
                    items: { $ref: "#/components/schemas/MyEmail" }
                  identities:
                    type: array
                    items: { $ref: "#/components/schemas/MyIdentity" }
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/MyPasskey" }
                  totp:
                    type: array
                    items: { $ref: "#/components/schemas/MyTOTP" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/emails:start:
    post:
      operationId: startAddEmail
      summary: メールの追加を始める（所有確認のコードとリンクを通知する）
      description: |
        ログイン済みの本人だけが足せる（4.2）。アドレスが別のユーザーで使われていても、所有を確かめるまでは
        同じ応答を返す。本人のメールなら `409 email_exists`。realm で `code` の経路が無効なら
        `400 verification_method_disabled`。`flow_id` はブラウザには `__Host-iam_flow` Cookie でも渡す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, expires_at]
                properties:
                  flow_id: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/emails:verify:
    post:
      operationId: verifyAddEmail
      summary: コードかリンクのトークンでメールの追加を完了する
      description: |
        `flow_id` は本文か `__Host-iam_flow` Cookie で渡す。照合の失敗は `401 authentication_failed`。
        所有を確かめた後、アドレスが使われていれば `409 email_exists`（自動リンクしない）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow_id: { type: string }
                code: { type: string }
                token: { type: string }
      responses:
        "200":
          description: 足した（primary にはしない）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyEmail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/emails/{id}:make-primary:
    post:
      operationId: makeMyEmailPrimary
      summary: 確認済みのメールを primary にする
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: primary にした }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/emails/{id}:remove:
    post:
      operationId: removeMyEmail
      summary: メールを消す
      description: |
        primary は消せない（`409 primary_email`。先に別のメールを primary にする）。最後の確認済みメールは
        `409 last_email`、消すとログインの手段が無くなるなら `409 last_method`（4.3）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 消した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/identities/{connection}:start:
    post:
      operationId: startLinkIdentity
      summary: 外部プロバイダ（OAuth / OIDC）の連携を始める
      description: |
        ログイン済みの本人だけが連携できる（4.2）。戻り先で受け取った `state` と `code` を
        `/v1/me/identities:complete` に渡す。`flow_id` はブラウザには `__Host-iam_oauth` Cookie でも渡す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: connection, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri: { type: string }
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, authorization_url, expires_at]
                properties:
                  flow_id: { type: string }
                  authorization_url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/identities:complete:
    post:
      operationId: completeLinkIdentity
      summary: プロバイダからの戻りで連携を完了する
      description: |
        フローを始めた本人のセッションでだけ完了できる。失敗は `401 authentication_failed`。
        外部 ID が既にどれかのユーザーに紐付いていれば `409 identity_exists`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                flow_id: { type: string }
                state: { type: string }
                code: { type: string }
      responses:
        "200":
          description: 連携した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyIdentity" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/identities/{id}:unlink:
    post:
      operationId: unlinkMyIdentity
      summary: 外部 ID の連携を解除する
      description: |
        削除ではなく無効化する（4.6）。その外部 ID で作ったセッションも使えなくなる。
        最後のログインの手段なら `409 last_method`。同じ外部 ID は後でまた連携できる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 解除した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/passkeys:start:
    post:
      operationId: startRegisterPasskey
      summary: passkey の登録を始める
      description: |
        `options` を `navigator.credentials.create()` に渡す（`PublicKeyCredential.parseCreationOptionsFromJSON(options.publicKey)`）。
        登録済みの passkey は除外を求める。フロー ID は `__Host-iam_passkey` Cookie と本文で返す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/passkeys:finish:
    post:
      operationId: finishRegisterPasskey
      summary: passkey の登録を完了する
      description: |
        `credential` は `navigator.credentials.create()` の結果の JSON（`PublicKeyCredential.toJSON()`）。
        登録済みなら `409 passkey_exists`、無効化した passkey は再登録できない（`409 passkey_revoked`。4.6）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                flow_id: { type: string }
                credential: { type: object, additionalProperties: true }
                name: { type: string, maxLength: 64, description: 表示用の名前。省略すると `Passkey` }
      responses:
        "200":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPasskey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/passkeys/{id}:rename:
    post:
      operationId: renameMyPasskey
      summary: passkey の名前を変える
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        "200":
          description: 変えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPasskey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/passkeys/{id}:revoke:
    post:
      operationId: revokeMyPasskey
      summary: passkey を無効化する
      description: |
        削除せず無効化し、同じ passkey は再登録できない（4.6）。最後のログインの手段なら `409 last_method`。
        その passkey で作ったセッションは、遅くとも `validity_max_delay` の後に使えなくなる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 無効化した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/totp:start:
    post:
      operationId: startRegisterTOTP
      summary: TOTP（認証器アプリ）の登録を始める
      description: |
        秘密（Base32）と `otpauth://` の URI を本人にだけ返す。QR コードは画面で作る。
        登録はコードの確認（`/v1/me/totp:confirm`）で完了する。登録済みなら `409 totp_exists`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPEnrollment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/totp:confirm:
    post:
      operationId: confirmRegisterTOTP
      summary: TOTP の登録をコードで完了する
      description: |
        コードが違えば 401（回数の上限まではフローを使える）。登録だけのセッション（`next: enroll`）で完了すると、
        通常のセッションに替え、`login` で返す（Cookie も差し替える）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow_id, code]
              properties:
                flow_id: { type: string }
                code: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: 登録した
          content:
            application/json:
              schema:
                type: object
                required: [totp]
                properties:
                  totp: { $ref: "#/components/schemas/MyTOTP" }
                  login: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/totp/{id}:revoke:
    post:
      operationId: revokeMyTOTP
      summary: TOTP を無効化する
      description: その TOTP を2要素目に使ったセッションは、遅くとも `validity_max_delay` の後に使えなくなる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 無効化した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-iam_session
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: 要求の形式の誤り
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: 本人確認の失敗（理由は返さない）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 見つからない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 状態が合わず受け付けられない。`error` に理由のコード（`email_exists`、`last_method` など）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Denied:
      description: 本人確認の後の拒否。`reasons` に拒否理由のコード（`warning_denied.<code>` など。4.9）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: 回数の上限を超えた（`rate_limited`）
      headers:
        Retry-After:
          description: 次に試せるまでの秒数
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 公開の契約のコード（design.md 4.9、11.10）
        reasons:
          type: array
          items: { type: string }
          description: 拒否理由のコードの一覧（複数該当すればすべて。4.9）
    LoginResult:
      type: object
      required: [session_id, expires_at, user_id, created, warnings]
      properties:
        session_id: { type: string }
        expires_at: { type: string, format: date-time }
        user_id: { type: string, description: 公開のユーザー ID（内部 ID は返さない。ADR 0045） }
        created: { type: boolean, description: 新規登録だったか }
        token: { type: string, description: "`return_token: true` のときだけ。Bearer で使う" }
        next:
          type: string
          enum: [second_factor, enroll]
          description: |
            セッションが制限つきのときの次の手順（4.1、2.8）。`second_factor` は2要素目の確認待ち、`enroll` は2要素目の
            登録だけができる。制限つきのセッションは短い期限で失効し、決まった API にしか使えない（他は未ログインの扱い）。
        second_factor_methods:
          type: array
          description: "`next: second_factor` のとき使える2要素目（`passkey`、`totp`）"
          items: { type: string }
        warnings:
          type: array
          description: 認証の警告（design.md 10章）。コードで返し、表示の文言はクライアントで決める
          items: { $ref: "#/components/schemas/Warning" }
    Warning:
      type: object
      required: [code, severity, action]
      properties:
        code: { type: string, description: "`single_factor`、`oauth_email_unverified` など（公開の契約）" }
        severity: { type: string, enum: [low, medium, high] }
        action: { type: string, enum: [warn, deny] }
        params: { type: object, additionalProperties: true }
    Session:
      type: object
      required: [id, authenticated_at, last_seen_at, expires_at, auth_methods, current]
      properties:
        id: { type: string, description: 公開のセッション ID（ses_…） }
        authenticated_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        auth_methods:
          type: array
          items: { type: string }
        current: { type: boolean, description: このリクエストのセッションか }
    MyEmail:
      type: object
      required: [id, email, primary, verified, created_at]
      properties:
        id: { type: string, description: 公開のメール ID（eml_…） }
        email: { type: string, description: アドレス。最小化モード（9.6）では空 }
        primary: { type: boolean }
        verified: { type: boolean }
        verified_via: { type: string, description: "`code`、`oauth_provider`、`admin` など" }
        created_at: { type: string, format: date-time }
    MyIdentity:
      type: object
      required: [id, connection, created_at]
      properties:
        id: { type: string, description: 公開の外部 ID の紐付けの ID（idn_…） }
        connection: { type: string, description: connection の slug（google など） }
        created_at: { type: string, format: date-time }
    MyPasskey:
      type: object
      required: [id, name, created_at, backup_eligible]
      properties:
        id: { type: string, description: 公開の passkey の ID（psk_…） }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        backup_eligible: { type: boolean, description: 同期される passkey か（認証器の BE フラグ） }
    MyTOTP:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string, description: 公開の TOTP の ID（otp_…） }
        created_at: { type: string, format: date-time }
    TOTPEnrollment:
      type: object
      required: [flow_id, secret, uri, expires_at]
      properties:
        flow_id: { type: string }
        secret: { type: string, description: Base32 の秘密（手で入力する人向け） }
        uri: { type: string, description: "`otpauth://totp/…`（QR コードにする）" }
        expires_at: { type: string, format: date-time }
    PasskeyCeremony:
      type: object
      required: [flow_id, options, expires_at]
      properties:
        flow_id: { type: string }
        options:
          type: object
          additionalProperties: true
          description: "`{\"publicKey\": …}`。WebAuthn の options の JSON の形"
        expires_at: { type: string, format: date-time }
