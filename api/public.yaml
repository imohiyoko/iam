openapi: 3.0.3
info:
  title: IAM public API
  version: v1
  description: |
    公開 API（ヘッドレス）。`/v1` でバージョニングする（design.md 2.5）。

    認証：ブラウザは Cookie（`__Host-iam_session`）、別ドメインのアプリは `Authorization: Bearer <token>`（5.2）。
    本人確認の前の失敗は理由を問わず `authentication_failed` を返す（4.9）。
    ログインの要求（`/v1/login/...`）は応答時間に下限を設け、本人確認の前の応答時間から理由を読めないようにする。
    回数の上限を超えると `429 rate_limited` を返す（接続元ごと。メールのフローの開始はアドレスごとにも数える）。

    パスの `{id}:revoke` のような動詞は、資源に対する操作を表す（design.md 4.13）。
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: ヘルスチェック
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: 依存先（Storage など）に問題がある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /.well-known/webauthn:
    get:
      operationId: getWebAuthnRelatedOrigins
      summary: passkey を使う origin の一覧（Related Origin Requests）
      description: |
        `passkey.rp_id` のドメインで返す内容。rp_id のドメインの外の origin で passkey を使うときに必要（design.md 2.5）。
      responses:
        "200":
          description: origin の一覧
          content:
            application/json:
              schema:
                type: object
                required: [origins]
                properties:
                  origins:
                    type: array
                    items: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/login/email:start:
    post:
      operationId: startEmailLogin
      summary: メールのコード・マジックリンクによる登録・ログインを始める
      description: |
        登録済みのアドレスならログイン、未登録なら登録のコードとリンクを通知する。どちらも同じ応答を返す（4.9）。
        `flow_id` は要求した側だけが持つ秘密で、検証のときに必要になる。ブラウザには `__Host-iam_flow` Cookie でも渡す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: 開始した（送信したかどうかは返さない）
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, expires_at]
                properties:
                  flow_id: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/email:verify:
    post:
      operationId: verifyEmailLogin
      summary: コードかマジックリンクのトークンでフローを完了する
      description: |
        `flow_id` は本文か `__Host-iam_flow` Cookie で渡す。`code` と `token` のどちらか1つを渡す。
        成功するとセッションを発行する。ブラウザには Cookie で、`return_token: true` なら本文でトークンを返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow_id: { type: string }
                code: { type: string }
                token: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/link:redeem:
    post:
      operationId: redeemLoginLink
      summary: 運営者が発行したログイン用リンクでログインする
      description: |
        トークンは1回限りで、期限がある（管理 API の `issueLoginLink` と `iam operator create` が発行する）。
        成功するとセッションを発行する。ブラウザには Cookie で、`return_token: true` なら本文でトークンを返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 1024 }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/oauth/{connection}:start:
    post:
      operationId: startOAuthLogin
      summary: 外部プロバイダ（OAuth / OIDC）による登録・ログインを始める
      description: |
        プロバイダの認可 URL を返す。ブラウザをそこへ移し、戻り先で受け取った `state` と `code` を
        `/v1/login/oauth:complete` に渡す。`flow_id` は要求した側だけが持つ秘密で、ブラウザには
        `__Host-iam_oauth` Cookie でも渡す。`redirect_uri` は connection の許可リストにあるものに限る（2.5）。
      parameters:
        - { name: connection, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri: { type: string }
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, authorization_url, expires_at]
                properties:
                  flow_id: { type: string }
                  authorization_url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/oauth:complete:
    post:
      operationId: completeOAuthLogin
      summary: プロバイダからの戻り（state と code）でフローを完了する
      description: |
        `flow_id` は本文か `__Host-iam_oauth` Cookie で渡す。外部 ID が紐付いていればログイン、未登録で
        プロバイダが確認済みのメールなら登録する。メールが別のユーザーで登録済みなら自動リンクせず
        `409 account_exists` を返す（4.2。ログインしてから連携する）。プロバイダがメールを確認済みとしていなければ
        `400 email_unverified`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                flow_id: { type: string }
                state: { type: string }
                code: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "409":
          description: メールが別のユーザーで登録済み（自動リンクしない）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/passkey:start:
    post:
      operationId: startPasskeyLogin
      summary: passkey でのログインを始める
      description: |
        `options` を `navigator.credentials.get()` に渡す（`PublicKeyCredential.parseRequestOptionsFromJSON(options.publicKey)`）。
        どのユーザーかは認証器が選ぶ（discoverable credential）。本人確認（UV）を求める。
        フロー ID は `__Host-iam_passkey` Cookie と本文で返す。
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/passkey:finish:
    post:
      operationId: finishPasskeyLogin
      summary: passkey でのログインを完了する
      description: |
        `credential` は `navigator.credentials.get()` の結果の JSON（`PublicKeyCredential.toJSON()`）。
        `flow_id` は本文か `__Host-iam_passkey` Cookie で渡す。成功するとセッションを発行する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                flow_id: { type: string }
                credential: { type: object, additionalProperties: true }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/password:
    post:
      operationId: passwordLogin
      summary: メールとパスワードでログインする（フィーチャー password）
      description: |
        失敗の理由（アカウントの有無、メールの未確認、パスワードの違い）は返さない（4.9）。アドレスと接続元ごとに
        回数を制限する。漏洩済みのパスワードなら警告 `password_breached` を返す。フィーチャーが動いていなければ 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした（`next` があれば2要素目へ）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/second-factor/passkey:start:
    post:
      operationId: startSecondFactorPasskey
      summary: 2要素目の passkey の確認を始める
      description: |
        2要素目の確認待ち（`next: second_factor`）か登録だけ（`next: enroll`）のセッションで使う。本人の passkey に限り、
        本人確認（UV）は求めない。フロー ID は `__Host-iam_passkey` Cookie と本文で返す。passkey が無ければ 404。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/login/second-factor:verify:
    post:
      operationId: verifySecondFactor
      summary: 2要素目を確かめ、通常のセッションに替える
      description: |
        `totp_code`（認証器アプリの6桁）か、`credential`（`navigator.credentials.get()` の結果）のどちらかを送る。
        成功すると制限つきのセッションを失効させ、通常のセッションを発行する（amr に `mfa` を加える）。
        失敗の理由は返さない（4.9）。同じ時間窓の TOTP のコードは2度使えない。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                totp_code: { type: string }
                flow_id: { type: string }
                credential: { type: object, additionalProperties: true }
                return_token: { type: boolean }
      responses:
        "200":
          description: 確かめた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/recovery/code:redeem:
    post:
      operationId: redeemRecoveryCode
      summary: 確認済みのメールアドレスとリカバリーコードで復旧を始める（4.12）
      description: |
        成功すると復旧専用のセッション（`next: recovery`）を発行する。そのセッションでは新しい認証手段の登録と
        `/v1/recovery:complete` しかできない。コードは1回限り。失敗の理由は返さない（4.9）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, maxLength: 254 }
                code: { type: string, maxLength: 64 }
                return_token: { type: boolean }
      responses:
        "200":
          description: 復旧専用のセッションを発行した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/recovery/email:start:
    post:
      operationId: startEmailRecovery
      summary: 確認済みのメールによる復旧を始める（4.12）
      description: |
        確認済みのアドレスにだけコードとリンクを通知する。応答はアカウントの有無で変えない（4.9）。
        `flow_id` は要求した側だけが持つ秘密で、ブラウザには `__Host-iam_flow` Cookie でも渡す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: 開始した（送信したかどうかは返さない）
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, expires_at]
                properties:
                  flow_id: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/recovery/email:verify:
    post:
      operationId: verifyEmailRecovery
      summary: メールのコードかリンクのトークンで復旧専用のセッションを得る
      description: |
        `code` と `token` のどちらか1つを渡す。警告 `recovered_via_email` を評価する（deny ならメールでは復旧できない）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow_id: { type: string }
                code: { type: string }
                token: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: 復旧専用のセッションを発行した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/recovery/link:redeem:
    post:
      operationId: redeemRecoveryLink
      summary: 運営者が発行した復旧用リンクで復旧専用のセッションを得る
      description: トークンは1回限りで、期限がある（管理 API の `issueRecoveryLink` が発行する）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 1024 }
                return_token: { type: boolean }
      responses:
        "200":
          description: 復旧専用のセッションを発行した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/recovery:complete:
    post:
      operationId: completeRecovery
      summary: 復旧を終える
      description: |
        復旧専用のセッションで、新しい認証手段を登録した後に呼ぶ（未登録なら `409 new_method_required`）。全セッション
        （このセッションも）を失効させ、新しいリカバリーコードを1回だけ返し、確認済みの全メールに通知する。古い認証手段は
        残るので、心当たりの無いものを無効化するよう本人に勧める。以後は新しい認証手段でログインする。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 復旧した
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes, sessions_revoked]
                properties:
                  recovery_codes:
                    type: array
                    description: 新しいリカバリーコード（表示は1回だけ）
                    items: { type: string }
                  sessions_revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/recovery-codes:regenerate:
    post:
      operationId: regenerateMyRecoveryCodes
      summary: リカバリーコードを作り直す
      description: |
        古いコードは使えなくなる。新しいコードは1回だけ返す。直近の認証（`max_auth_age`）を求め、過ぎていれば
        `401 reauthentication_required`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 作り直した
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/logout:
    post:
      operationId: logout
      summary: 今のセッションを失効させる
      description: セッションが無い・無効でも 204 を返し、Cookie を消す。
      responses:
        "204":
          description: 失効した
          headers:
            Set-Cookie: { schema: { type: string } }

  /v1/me/account:delete:
    post:
      operationId: deleteMyAccount
      summary: アカウントを削除する（4.10）
      description: |
        直近の本人確認が要る（`max_auth_age` を過ぎていれば `401 reauthentication_required`）。realm の
        `user_deletion_grace`（既定30日）の後に消し、その間はログインしても取り消し（`next: cancel_deletion`）だけができる。
        既存のセッションはすべて失効する。共有 Org の最後のオーナーの間はできない（`409 last_owner`）。
        消去では、所属を終えて個人 Org を削除し、認証情報・セッション・メールのインデックスを消し、データ鍵を消す
        （個人情報は復号できなくなる）。ID は墓標として残る。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 削除を予約した（猶予が無ければ削除した）
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deletes_at: { type: string, format: date-time, description: 予約したとき }
                  deleted: { type: boolean, description: もう削除したか }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/account:cancel-deletion:
    post:
      operationId: cancelMyAccountDeletion
      summary: アカウントの削除の予定を取り消す
      description: |
        猶予期間の間のログインで得た取り消し専用のセッション（`next: cancel_deletion`）で呼ぶ。取り消しの後、
        セッションは制限なしに入れ替わる（新しいセッションを返す）。予定が無ければ `409 deletion_not_scheduled`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                return_token: { type: boolean, default: false }
      responses:
        "200":
          description: 取り消した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/sessions:
    get:
      operationId: listMySessions
      summary: 本人の有効なセッションの一覧
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 新しい順
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/sessions/{id}:revoke:
    post:
      operationId: revokeMySession
      summary: 本人のセッションを失効させる
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 失効した（既に失効していても 204） }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/methods:
    get:
      operationId: listMyMethods
      summary: 本人の認証手段（メール、連携した外部 ID、passkey、TOTP、パスワード）の一覧
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 作成時刻の順
          content:
            application/json:
              schema:
                type: object
                required: [emails, identities, passkeys, totp, recovery_codes_remaining]
                properties:
                  recovery_codes_remaining: { type: integer, description: 未使用のリカバリーコードの数 }
                  emails:
                    type: array
                    items: { $ref: "#/components/schemas/MyEmail" }
                  identities:
                    type: array
                    items: { $ref: "#/components/schemas/MyIdentity" }
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/MyPasskey" }
                  totp:
                    type: array
                    items: { $ref: "#/components/schemas/MyTOTP" }
                  password:
                    type: object
                    description: 設定したパスワード（無ければ省略）
                    required: [created_at]
                    properties:
                      created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/emails:start:
    post:
      operationId: startAddEmail
      summary: メールの追加を始める（所有確認のコードとリンクを通知する）
      description: |
        ログイン済みの本人だけが足せる（4.2）。アドレスが別のユーザーで使われていても、所有を確かめるまでは
        同じ応答を返す。本人のメールなら `409 email_exists`。realm で `code` の経路が無効なら
        `400 verification_method_disabled`。`flow_id` はブラウザには `__Host-iam_flow` Cookie でも渡す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, expires_at]
                properties:
                  flow_id: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/emails:verify:
    post:
      operationId: verifyAddEmail
      summary: コードかリンクのトークンでメールの追加を完了する
      description: |
        `flow_id` は本文か `__Host-iam_flow` Cookie で渡す。照合の失敗は `401 authentication_failed`。
        所有を確かめた後、アドレスが使われていれば `409 email_exists`（自動リンクしない）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow_id: { type: string }
                code: { type: string }
                token: { type: string }
      responses:
        "200":
          description: 足した（primary にはしない）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyEmail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/emails/{id}:make-primary:
    post:
      operationId: makeMyEmailPrimary
      summary: 確認済みのメールを primary にする
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: primary にした }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/emails/{id}:remove:
    post:
      operationId: removeMyEmail
      summary: メールを消す
      description: |
        primary は消せない（`409 primary_email`。先に別のメールを primary にする）。最後の確認済みメールは
        `409 last_email`、消すとログインの手段が無くなるなら `409 last_method`（4.3）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 消した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/identities/{connection}:start:
    post:
      operationId: startLinkIdentity
      summary: 外部プロバイダ（OAuth / OIDC）の連携を始める
      description: |
        ログイン済みの本人だけが連携できる（4.2）。戻り先で受け取った `state` と `code` を
        `/v1/me/identities:complete` に渡す。`flow_id` はブラウザには `__Host-iam_oauth` Cookie でも渡す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: connection, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri: { type: string }
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, authorization_url, expires_at]
                properties:
                  flow_id: { type: string }
                  authorization_url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/identities:complete:
    post:
      operationId: completeLinkIdentity
      summary: プロバイダからの戻りで連携を完了する
      description: |
        フローを始めた本人のセッションでだけ完了できる。失敗は `401 authentication_failed`。
        外部 ID が既にどれかのユーザーに紐付いていれば `409 identity_exists`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                flow_id: { type: string }
                state: { type: string }
                code: { type: string }
      responses:
        "200":
          description: 連携した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyIdentity" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/identities/{id}:unlink:
    post:
      operationId: unlinkMyIdentity
      summary: 外部 ID の連携を解除する
      description: |
        削除ではなく無効化する（4.6）。その外部 ID で作ったセッションも使えなくなる。
        最後のログインの手段なら `409 last_method`。同じ外部 ID は後でまた連携できる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 解除した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/passkeys:start:
    post:
      operationId: startRegisterPasskey
      summary: passkey の登録を始める
      description: |
        `options` を `navigator.credentials.create()` に渡す（`PublicKeyCredential.parseCreationOptionsFromJSON(options.publicKey)`）。
        登録済みの passkey は除外を求める。フロー ID は `__Host-iam_passkey` Cookie と本文で返す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/passkeys:finish:
    post:
      operationId: finishRegisterPasskey
      summary: passkey の登録を完了する
      description: |
        `credential` は `navigator.credentials.create()` の結果の JSON（`PublicKeyCredential.toJSON()`）。
        登録済みなら `409 passkey_exists`、無効化した passkey は再登録できない（`409 passkey_revoked`。4.6）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                flow_id: { type: string }
                credential: { type: object, additionalProperties: true }
                name: { type: string, maxLength: 64, description: 表示用の名前。省略すると `Passkey` }
      responses:
        "200":
          description: 登録した。最初の強い認証手段なら `recovery_codes` を1回だけ返す（4.12）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisteredPasskey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/passkeys/{id}:rename:
    post:
      operationId: renameMyPasskey
      summary: passkey の名前を変える
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        "200":
          description: 変えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPasskey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/passkeys/{id}:revoke:
    post:
      operationId: revokeMyPasskey
      summary: passkey を無効化する
      description: |
        削除せず無効化し、同じ passkey は再登録できない（4.6）。最後のログインの手段なら `409 last_method`。
        その passkey で作ったセッションは、遅くとも `validity_max_delay` の後に使えなくなる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 無効化した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/password:set:
    post:
      operationId: setMyPassword
      summary: パスワードを設定・変更する（フィーチャー password）
      description: |
        変更には今のパスワード（`current_password`）が要る。初めての設定には直近の認証（`max_auth_age` の内）が要る
        （`401 reauthentication_required`）。最低長は 15 文字（2段階認証が必須なら 8 文字）、文字種は問わない。
        漏洩済みなら `400 password_breached`。成功すると、このセッションの他のセッションを失効させる（5.2）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 1024 }
                current_password: { type: string, maxLength: 1024 }
      responses:
        "204": { description: 設定した }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/password:remove:
    post:
      operationId: removeMyPassword
      summary: パスワードを外す（フィーチャー password）
      description: |
        今のパスワードが要る。最後のログインの手段なら `409 last_method`。成功すると、このセッションの他のセッションを
        失効させる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string, maxLength: 1024 }
      responses:
        "204": { description: 外した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/totp:start:
    post:
      operationId: startRegisterTOTP
      summary: TOTP（認証器アプリ）の登録を始める
      description: |
        秘密（Base32）と `otpauth://` の URI を本人にだけ返す。QR コードは画面で作る。
        登録はコードの確認（`/v1/me/totp:confirm`）で完了する。登録済みなら `409 totp_exists`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPEnrollment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/totp:confirm:
    post:
      operationId: confirmRegisterTOTP
      summary: TOTP の登録をコードで完了する
      description: |
        コードが違えば 401（回数の上限まではフローを使える）。登録だけのセッション（`next: enroll`）で完了すると、
        通常のセッションに替え、`login` で返す（Cookie も差し替える）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow_id, code]
              properties:
                flow_id: { type: string }
                code: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: 登録した
          content:
            application/json:
              schema:
                type: object
                required: [totp]
                properties:
                  totp: { $ref: "#/components/schemas/MyTOTP" }
                  login: { $ref: "#/components/schemas/LoginResult" }
                  recovery_codes:
                    type: array
                    description: 最初の強い認証手段なら、リカバリーコード（表示は1回だけ。4.12）
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/totp/{id}:revoke:
    post:
      operationId: revokeMyTOTP
      summary: TOTP を無効化する
      description: その TOTP を2要素目に使ったセッションは、遅くとも `validity_max_delay` の後に使えなくなる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 無効化した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs:
    get:
      operationId: listMyOrgs
      summary: 本人の Org の一覧（終了した Membership は含めない。11.13）
      description: フィーチャー org が動いていなければ `404`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Membership の作成の順
          content:
            application/json:
              schema:
                type: object
                required: [orgs]
                properties:
                  orgs:
                    type: array
                    items: { $ref: "#/components/schemas/MyOrg" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createMyOrg
      summary: 共有 Org を作り、本人を owner にする（4.11）
      description: |
        realm の `org_creation` が許さなければ `403 org_creation_not_allowed`。名前が不正なら `400 invalid_org_name`。
        フィーチャー org が動いていなければ `404`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 400 }
      responses:
        "201":
          description: 作った
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyOrg" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/members:
    get:
      operationId: listOrgMembers
      summary: Org のメンバーの一覧（Org の owner と admin。4.4）
      description: |
        メールは Membership に結び付けたもの（未設定なら primary）だけを返す。ほかのメールは見せない。
        権限が無ければ `403 permission_denied`、Org が無いか所属していなければ `404`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: after, in: query, schema: { type: string } }
      responses:
        "200":
          description: Membership の公開 ID の順（終了したものは含めない）。続きは `next_cursor` を `after` に渡す
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/OrgMember" }
                  next_cursor: { type: string, description: 続きがあるときだけ }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}:delete:
    post:
      operationId: deleteMyOrg
      summary: 共有 Org を削除する（Org の owner。4.10）
      description: |
        realm の `org_deletion_grace`（既定30日）の後に削除する。その間はメンバーが入れず（`deletion_scheduled`）、
        `:cancel-deletion` で取り消せる。削除では全 Membership を `org_deleted` で終え、pending の招待を取り消す。
        個人 Org は `409 personal_org`、既に予定があれば `409 deletion_scheduled`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 削除を予約した（猶予が無ければ削除した）
          content:
            application/json:
              schema:
                type: object
                required: [deletes_at, deleted]
                properties:
                  deletes_at: { type: string, format: date-time }
                  deleted: { type: boolean, description: もう削除したか }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:cancel-deletion:
    post:
      operationId: cancelMyOrgDeletion
      summary: Org の削除の予定を取り消す（Org の owner。猶予期間の間だけ）
      description: 予定が無ければ `409 deletion_not_scheduled`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 取り消した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:leave:
    post:
      operationId: leaveMyOrg
      summary: 共有 Org から退会する（4.10）
      description: |
        個人ユーザーには常に許す（停止中・有効期間の外でも）。最後のオーナーは、譲るか Org を削除するまで抜けられない
        （`409 last_owner`）。個人 Org は `409 personal_org`。その Org を active にしているセッションは個人 Org に移る。
        再参加は新しい招待で。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 退会した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:transfer:
    post:
      operationId: transferMyOrg
      summary: オーナーを譲る（Org の owner。4.10）
      description: 譲り先は active なメンバーで、owner になる。譲った本人は admin になる。譲り先がメンバーでなければ `409 not_member`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id]
              properties:
                membership_id: { type: string }
      responses:
        "204": { description: 譲った }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/members/{membership_id}:remove:
    post:
      operationId: removeOrgMember
      summary: メンバーを除名する（Org の owner と admin。4.10）
      description: |
        退会と同じ処理で、`ended_reason = removed`。自分は対象にできず（`403 self_target`。退会を使う）、owner を
        対象にできるのは owner だけ。最後のオーナーは `409 last_owner`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 除名した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/members/{membership_id}:
    patch:
      operationId: updateOrgMember
      summary: メンバーの有効期間を変更する（Org の owner と admin。4.8）
      description: |
        `valid_from`・`valid_until` の両方を置き換える（省略か null は制限なし）。期間の外のメンバーはこの Org にだけ入れない。
        自分は対象にできず（`403 self_target`）、owner を対象にできるのは owner だけ。個人 Org は `409 personal_org`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                valid_from: { type: string, format: date-time, nullable: true }
                valid_until: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: 変更した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/members/{membership_id}/suspensions:
    post:
      operationId: suspendOrgMember
      summary: メンバーを停止する（Org の owner と admin。種別は customer_request。4.7）
      description: |
        `starts_at` を省略か過去なら今から、未来なら予約。`ends_at` を省略で無期限。停止中のメンバーはこの Org にだけ入れない。
        本人には `suspended.customer_request` だけを返し、`reason` は見せない。自分は対象にできず（`403 self_target`）、
        owner を対象にできるのは owner だけ。個人 Org は `409 personal_org`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
      responses:
        "201":
          description: 停止した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSuspension" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listOrgMemberSuspensions
      summary: メンバーの停止の一覧（Org の owner と admin。customer_request だけ）
      description: 運営者による停止（規約違反など）は含めない。開始の時刻の順。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema:
                type: object
                required: [suspensions]
                properties:
                  suspensions:
                    type: array
                    items: { $ref: "#/components/schemas/OrgSuspension" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/suspensions/{suspension_id}:lift:
    post:
      operationId: liftOrgSuspension
      summary: メンバーの停止を解除する（Org の owner と admin。customer_request だけ）
      description: 既に解除・終了していれば何もせず 200。自分の停止は解除できない（`403 self_target`）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: suspension_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: 解除した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSuspension" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/invitations:
    get:
      operationId: listOrgInvitations
      summary: Org の招待の一覧（Org の owner と admin）
      description: アドレスは pending の招待だけに返す（終わった招待はアドレスの鍵を消している）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 作成の順
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/OrgInvitation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: inviteToOrg
      summary: Org にアドレスを招待する（Org の owner と admin。owner として招待できるのは owner だけ。4.4）
      description: |
        トークンは通知（`org_invitation`）で招待したアドレスに届く。個人 Org には招待できない（`409 personal_org`）。
        既に active なメンバーなら `409 already_member`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, maxLength: 254 }
                role: { type: string, enum: [owner, admin, member] }
                valid_from: { type: string, format: date-time }
                valid_until: { type: string, format: date-time }
      responses:
        "201":
          description: 招待した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgInvitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/invitations/{invitation_id}:revoke:
    post:
      operationId: revokeOrgInvitation
      summary: pending の招待を取り消す（Org の owner と admin）
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: invitation_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 取り消した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}:bind-email:
    post:
      operationId: bindMyOrgEmail
      summary: この Org で使うメールを結び付ける（4.4）
      description: "`email_id` を省くと primary に戻す。確認済みの本人のメールだけ。"
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_id: { type: string }
      responses:
        "200":
          description: 結び付けた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyOrg" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/invitations:accept:
    post:
      operationId: acceptInvitation
      summary: 招待を受け入れる（4.4）
      description: |
        トークンは招待したアドレスに届いたもの。招待したアドレスが Membership に結び付く。
        - ログインしている：アドレスが本人のものならそれを結び付ける。誰のものでもなければ、realm が経路 `invitation` を受け入れるなら
          本人に足して結び付ける（受け入れないなら `409 email_verification_required`。先に `/v1/me/emails:start` で確かめる）。
          ほかのユーザーのものなら `409 email_exists`
        - ログインしていない：アドレスが誰のものでもなく、realm が経路 `invitation` を受け入れるなら、そのアドレスで登録して
          招待された Org に入ったセッションを返す（`login`）。既存のユーザーのものなら `409 login_required`
        無い・期限切れ・使用済みのトークンは `404 invalid_invitation`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: 受け入れた
          content:
            application/json:
              schema:
                type: object
                required: [org]
                properties:
                  org: { $ref: "#/components/schemas/MyOrg" }
                  login: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:switch:
    post:
      operationId: switchMyOrg
      summary: セッションの Org を切り替える（4.4）
      description: |
        active な Membership のある Org に切り替え、セッションの ID を入れ替える（古い ID はすぐ失効する）。
        Cookie のセッションは Cookie を差し替える。入れない Org なら `403 no_available_org`、Org が無いか所属していなければ `404`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                return_token: { type: boolean }
      responses:
        "200":
          description: 切り替えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/passkeys/{id}:set-org:
    post:
      operationId: setMyPasskeyOrg
      summary: この passkey でログインしたときに入る Org を決める（4.4）
      description: "`org_id` を省くと指定を外す。active な Membership のある Org だけ。"
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                org_id: { type: string }
      responses:
        "200":
          description: 決めた
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-iam_session
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: 要求の形式の誤り
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: 本人確認の失敗（理由は返さない）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 見つからない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 状態が合わず受け付けられない。`error` に理由のコード（`email_exists`、`last_method` など）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Denied:
      description: 本人確認の後の拒否。`reasons` に拒否理由のコード（`warning_denied.<code>`、`suspended.<category>`、`outside_validity` など。4.9）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: 回数の上限を超えた（`rate_limited`）
      headers:
        Retry-After:
          description: 次に試せるまでの秒数
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 公開の契約のコード（design.md 4.9、11.10）
        reasons:
          type: array
          items: { type: string }
          description: 拒否理由のコードの一覧（複数該当すればすべて。4.9）
    LoginResult:
      type: object
      required: [session_id, expires_at, user_id, created, warnings]
      properties:
        session_id: { type: string }
        expires_at: { type: string, format: date-time }
        user_id: { type: string, description: 公開のユーザー ID（内部 ID は返さない。ADR 0045） }
        created: { type: boolean, description: 新規登録だったか }
        token: { type: string, description: "`return_token: true` のときだけ。Bearer で使う" }
        next:
          type: string
          enum: [second_factor, enroll, recovery, cancel_deletion]
          description: |
            セッションが制限つきのときの次の手順（4.1、2.8、4.12）。`second_factor` は2要素目の確認待ち、`enroll` は2要素目の
            登録だけ、`recovery` は新しい認証手段の登録と復旧の完了だけができる。制限つきのセッションは短い期限で失効し、
            決まった API にしか使えない（他は未ログインの扱い）。
        second_factor_methods:
          type: array
          description: "`next: second_factor` のとき使える2要素目（`passkey`、`totp`）"
          items: { type: string }
        warnings:
          type: array
          description: 認証の警告（design.md 10章）。コードで返し、表示の文言はクライアントで決める
          items: { $ref: "#/components/schemas/Warning" }
        org_id: { type: string, description: セッションが入った Org（公開 ID。Org がオフなら無し。4.4） }
        org_choices:
          type: array
          description: |
            ログインの手がかりに結び付いた Org が複数あり、前回の Org がその中に無いときの候補（公開 ID）。
            このときセッションは個人 Org に入っている。選んだ Org へは `/v1/me/orgs/{id}:switch` で切り替える
          items: { type: string }
    Warning:
      type: object
      required: [code, severity, action]
      properties:
        code: { type: string, description: "`single_factor`、`oauth_email_unverified` など（公開の契約）" }
        severity: { type: string, enum: [low, medium, high] }
        action: { type: string, enum: [warn, deny] }
        params: { type: object, additionalProperties: true }
    Session:
      type: object
      required: [id, authenticated_at, last_seen_at, expires_at, auth_methods, current]
      properties:
        id: { type: string, description: 公開のセッション ID（ses_…） }
        authenticated_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        auth_methods:
          type: array
          items: { type: string }
        current: { type: boolean, description: このリクエストのセッションか }
    MyOrg:
      type: object
      required: [id, kind, role, membership_id, active]
      properties:
        id: { type: string, description: 公開の Org ID }
        kind: { type: string, enum: [personal, shared] }
        name: { type: string, description: 共有 Org の名前（個人 Org には無い） }
        role: { type: string, enum: [owner, admin, member] }
        membership_id: { type: string }
        status: { type: string, enum: [invited, active] }
        active: { type: boolean, description: このセッションが入っている Org か }
        email_id: { type: string, description: この Org に結び付けたメール。未設定（primary を使う）なら無し }
        unavailable:
          type: array
          items: { type: string }
          description: 今この Org に入れない理由のコード（`suspended.<category>`、`outside_validity`。4.9）。入れるなら無し
    OrgMember:
      type: object
      required: [membership_id, user_id, role, status]
      properties:
        membership_id: { type: string }
        user_id: { type: string, description: 公開のユーザー ID }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [invited, active] }
        email: { type: string, description: この Org に結び付けたメール（未設定なら primary） }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
    OrgSuspension:
      type: object
      required: [id, membership_id, category, reason, starts_at, active, created_at]
      properties:
        id: { type: string }
        membership_id: { type: string }
        category: { type: string }
        reason: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        active: { type: boolean, description: 今停止中か }
        created_at: { type: string, format: date-time }
        lifted_at: { type: string, format: date-time }
    OrgInvitation:
      type: object
      required: [id, role, status, expires_at, created_at]
      properties:
        id: { type: string }
        email: { type: string, description: pending の招待だけ }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    MyEmail:
      type: object
      required: [id, email, primary, verified, created_at]
      properties:
        id: { type: string, description: 公開のメール ID（eml_…） }
        email: { type: string, description: アドレス。最小化モード（9.6）では空 }
        primary: { type: boolean }
        verified: { type: boolean }
        verified_via: { type: string, description: "`code`、`oauth_provider`、`admin` など" }
        created_at: { type: string, format: date-time }
    MyIdentity:
      type: object
      required: [id, connection, created_at]
      properties:
        id: { type: string, description: 公開の外部 ID の紐付けの ID（idn_…） }
        connection: { type: string, description: connection の slug（google など） }
        created_at: { type: string, format: date-time }
    MyPasskey:
      type: object
      required: [id, name, created_at, backup_eligible]
      properties:
        id: { type: string, description: 公開の passkey の ID（psk_…） }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        backup_eligible: { type: boolean, description: 同期される passkey か（認証器の BE フラグ） }
    RegisteredPasskey:
      allOf:
        - $ref: "#/components/schemas/MyPasskey"
        - type: object
          properties:
            recovery_codes:
              type: array
              description: 最初の強い認証手段なら、リカバリーコード（表示は1回だけ。4.12）
              items: { type: string }
    MyTOTP:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string, description: 公開の TOTP の ID（otp_…） }
        created_at: { type: string, format: date-time }
    TOTPEnrollment:
      type: object
      required: [flow_id, secret, uri, expires_at]
      properties:
        flow_id: { type: string }
        secret: { type: string, description: Base32 の秘密（手で入力する人向け） }
        uri: { type: string, description: "`otpauth://totp/…`（QR コードにする）" }
        expires_at: { type: string, format: date-time }
    PasskeyCeremony:
      type: object
      required: [flow_id, options, expires_at]
      properties:
        flow_id: { type: string }
        options:
          type: object
          additionalProperties: true
          description: "`{\"publicKey\": …}`。WebAuthn の options の JSON の形"
