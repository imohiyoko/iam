openapi: 3.0.3
info:
  title: IAM public API
  version: v1
  description: |
    公開 API（ヘッドレス）。`/v1` でバージョニングする（design.md 2.5）。

    認証：ブラウザは Cookie（`__Host-iam_session`）、別ドメインのアプリは `Authorization: Bearer <token>`（5.2）。
    本人確認の前の失敗は理由を問わず `authentication_failed` を返す（4.9）。
    ログインの要求（`/v1/login/...`）は応答時間に下限を設け、本人確認の前の応答時間から理由を読めないようにする。
    回数の上限を超えると `429 rate_limited` を返す（接続元ごと。メールのフローの開始はアドレスごとにも数える）。

    パスの `{id}:revoke` のような動詞は、資源に対する操作を表す（design.md 4.13）。
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: ヘルスチェック
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: 依存先（Storage など）に問題がある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /.well-known/webauthn:
    get:
      operationId: getWebAuthnRelatedOrigins
      summary: passkey を使う origin の一覧（Related Origin Requests）
      description: |
        `passkey.rp_id` のドメインで返す内容。rp_id のドメインの外の origin で passkey を使うときに必要（design.md 2.5）。
      responses:
        "200":
          description: origin の一覧
          content:
            application/json:
              schema:
                type: object
                required: [origins]
                properties:
                  origins:
                    type: array
                    items: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/login/email:start:
    post:
      operationId: startEmailLogin
      summary: メールのコード・マジックリンクによる登録・ログインを始める
      description: |
        登録済みのアドレスならログイン、未登録なら登録のコードとリンクを通知する。どちらも同じ応答を返す（4.9）。
        `flow_id` は要求した側だけが持つ秘密で、検証のときに必要になる。ブラウザには `__Host-iam_flow` Cookie でも渡す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: 開始した（送信したかどうかは返さない）
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, expires_at]
                properties:
                  flow_id: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/email:verify:
    post:
      operationId: verifyEmailLogin
      summary: コードかマジックリンクのトークンでフローを完了する
      description: |
        `flow_id` は本文か `__Host-iam_flow` Cookie で渡す。`code` と `token` のどちらか1つを渡す。
        成功するとセッションを発行する。ブラウザには Cookie で、`return_token: true` なら本文でトークンを返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow_id: { type: string }
                code: { type: string }
                token: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/link:redeem:
    post:
      operationId: redeemLoginLink
      summary: 運営者が発行したログイン用リンクでログインする
      description: |
        トークンは1回限りで、期限がある（管理 API の `issueLoginLink` と `iam operator create` が発行する）。
        成功するとセッションを発行する。ブラウザには Cookie で、`return_token: true` なら本文でトークンを返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 1024 }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/oauth/{connection}:start:
    post:
      operationId: startOAuthLogin
      summary: 外部プロバイダ（OAuth / OIDC）による登録・ログインを始める
      description: |
        プロバイダの認可 URL を返す。ブラウザをそこへ移し、戻り先で受け取った `state` と `code` を
        `/v1/login/oauth:complete` に渡す。`flow_id` は要求した側だけが持つ秘密で、ブラウザには
        `__Host-iam_oauth` Cookie でも渡す。`redirect_uri` は connection の許可リストにあるものに限る（2.5）。
      parameters:
        - { name: connection, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri: { type: string }
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, authorization_url, expires_at]
                properties:
                  flow_id: { type: string }
                  authorization_url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/oauth:complete:
    post:
      operationId: completeOAuthLogin
      summary: プロバイダからの戻り（state と code）でフローを完了する
      description: |
        `flow_id` は本文か `__Host-iam_oauth` Cookie で渡す。外部 ID が紐付いていればログイン、未登録で
        プロバイダが確認済みのメールなら登録する。メールが別のユーザーで登録済みなら自動リンクせず
        `409 account_exists` を返す（4.2。ログインしてから連携する）。プロバイダがメールを確認済みとしていなければ
        `400 email_unverified`。

        Org 専用 SSO（ADR 0077）の connection では、その Org の管理ユーザーだけがログインでき、その Org に入る
        （入れなければ `403`）。登録はその Org が証明したドメインのアドレスに限り（`400 email_domain_not_verified`）、
        その Org の管理ユーザーとメンバーとして作る。Org の Quota が足りなければ `409 quota_exceeded`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                flow_id: { type: string }
                state: { type: string }
                code: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "409":
          description: メールが別のユーザーで登録済み（自動リンクしない）、Org 専用 SSO で Org の Quota が足りない
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/sso:discover:
    post:
      operationId: discoverSSO
      summary: メールのドメインから Org 専用 SSO の connection を探す（ADR 0077）
      description: |
        アドレスのドメインを証明済みの Org があれば、その Org の connection（`/v1/login/oauth/{connection}:start` に渡す）を返す。
        無ければ空。ドメインが SSO を使うことは公開の情報とみなす（アドレスの登録の有無は返さない）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 320 }
      responses:
        "200":
          description: 見つかった connection（無ければ空）
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { type: string, description: connection（公開の ID） }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/passkey:start:
    post:
      operationId: startPasskeyLogin
      summary: passkey でのログインを始める
      description: |
        `options` を `navigator.credentials.get()` に渡す（`PublicKeyCredential.parseRequestOptionsFromJSON(options.publicKey)`）。
        どのユーザーかは認証器が選ぶ（discoverable credential）。本人確認（UV）を求める。
        フロー ID は `__Host-iam_passkey` Cookie と本文で返す。
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/passkey:finish:
    post:
      operationId: finishPasskeyLogin
      summary: passkey でのログインを完了する
      description: |
        `credential` は `navigator.credentials.get()` の結果の JSON（`PublicKeyCredential.toJSON()`）。
        `flow_id` は本文か `__Host-iam_passkey` Cookie で渡す。成功するとセッションを発行する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                flow_id: { type: string }
                credential: { type: object, additionalProperties: true }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/password:
    post:
      operationId: passwordLogin
      summary: メールとパスワードでログインする（フィーチャー password）
      description: |
        失敗の理由（アカウントの有無、メールの未確認、パスワードの違い）は返さない（4.9）。アドレスと接続元ごとに
        回数を制限する。漏洩済みのパスワードなら警告 `password_breached` を返す。フィーチャーが動いていなければ 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
                return_token: { type: boolean }
      responses:
        "200":
          description: ログインした（`next` があれば2要素目へ）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/login/second-factor/passkey:start:
    post:
      operationId: startSecondFactorPasskey
      summary: 2要素目の passkey の確認を始める
      description: |
        2要素目の確認待ち（`next: second_factor`）か登録だけ（`next: enroll`）のセッションで使う。本人の passkey に限り、
        本人確認（UV）は求めない。フロー ID は `__Host-iam_passkey` Cookie と本文で返す。passkey が無ければ 404。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/login/second-factor:verify:
    post:
      operationId: verifySecondFactor
      summary: 2要素目を確かめ、通常のセッションに替える
      description: |
        `totp_code`（認証器アプリの6桁）か、`credential`（`navigator.credentials.get()` の結果）のどちらかを送る。
        成功すると制限つきのセッションを失効させ、通常のセッションを発行する（amr に `mfa` を加える）。
        失敗の理由は返さない（4.9）。同じ時間窓の TOTP のコードは2度使えない。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                totp_code: { type: string }
                flow_id: { type: string }
                credential: { type: object, additionalProperties: true }
                return_token: { type: boolean }
      responses:
        "200":
          description: 確かめた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/recovery/code:redeem:
    post:
      operationId: redeemRecoveryCode
      summary: 確認済みのメールアドレスとリカバリーコードで復旧を始める（4.12）
      description: |
        成功すると復旧専用のセッション（`next: recovery`）を発行する。そのセッションでは新しい認証手段の登録と
        `/v1/recovery:complete` しかできない。コードは1回限り。失敗の理由は返さない（4.9）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, maxLength: 254 }
                code: { type: string, maxLength: 64 }
                return_token: { type: boolean }
      responses:
        "200":
          description: 復旧専用のセッションを発行した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/recovery/email:start:
    post:
      operationId: startEmailRecovery
      summary: 確認済みのメールによる復旧を始める（4.12）
      description: |
        確認済みのアドレスにだけコードとリンクを通知する。応答はアカウントの有無で変えない（4.9）。
        `flow_id` は要求した側だけが持つ秘密で、ブラウザには `__Host-iam_flow` Cookie でも渡す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: 開始した（送信したかどうかは返さない）
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, expires_at]
                properties:
                  flow_id: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/recovery/email:verify:
    post:
      operationId: verifyEmailRecovery
      summary: メールのコードかリンクのトークンで復旧専用のセッションを得る
      description: |
        `code` と `token` のどちらか1つを渡す。警告 `recovered_via_email` を評価する（deny ならメールでは復旧できない）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow_id: { type: string }
                code: { type: string }
                token: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: 復旧専用のセッションを発行した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/recovery/link:redeem:
    post:
      operationId: redeemRecoveryLink
      summary: 運営者が発行した復旧用リンクで復旧専用のセッションを得る
      description: トークンは1回限りで、期限がある（管理 API の `issueRecoveryLink` が発行する）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 1024 }
                return_token: { type: boolean }
      responses:
        "200":
          description: 復旧専用のセッションを発行した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/recovery:complete:
    post:
      operationId: completeRecovery
      summary: 復旧を終える
      description: |
        復旧専用のセッションで、新しい認証手段を登録した後に呼ぶ（未登録なら `409 new_method_required`）。全セッション
        （このセッションも）を失効させ、新しいリカバリーコードを1回だけ返し、確認済みの全メールに通知する。古い認証手段は
        残るので、心当たりの無いものを無効化するよう本人に勧める。以後は新しい認証手段でログインする。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 復旧した
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes, sessions_revoked]
                properties:
                  recovery_codes:
                    type: array
                    description: 新しいリカバリーコード（表示は1回だけ）
                    items: { type: string }
                  sessions_revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/recovery-codes:regenerate:
    post:
      operationId: regenerateMyRecoveryCodes
      summary: リカバリーコードを作り直す
      description: |
        古いコードは使えなくなる。新しいコードは1回だけ返す。直近の認証（`max_auth_age`）を求め、過ぎていれば
        `401 reauthentication_required`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 作り直した
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/logout:
    post:
      operationId: logout
      summary: 今のセッションを失効させる
      description: セッションが無い・無効でも 204 を返し、Cookie を消す。
      responses:
        "204":
          description: 失効した
          headers:
            Set-Cookie: { schema: { type: string } }

  /v1/me/account:delete:
    post:
      operationId: deleteMyAccount
      summary: アカウントを削除する（4.10）
      description: |
        直近の本人確認が要る（`max_auth_age` を過ぎていれば `401 reauthentication_required`）。realm の
        `user_deletion_grace`（既定30日）の後に消し、その間はログインしても取り消し（`next: cancel_deletion`）だけができる。
        既存のセッションはすべて失効する。共有 Org の最後のオーナーと、realm の最後の `realm:owner` の間はできない（`409 last_owner`）。
        消去では、所属を終えて個人 Org を削除し、認証情報・セッション・メールのインデックスを消し、データ鍵を消す
        （個人情報は復号できなくなる）。ID は墓標として残る。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 削除を予約した（猶予が無ければ削除した）
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deletes_at: { type: string, format: date-time, description: 予約したとき }
                  deleted: { type: boolean, description: もう削除したか }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/account:cancel-deletion:
    post:
      operationId: cancelMyAccountDeletion
      summary: アカウントの削除の予定を取り消す
      description: |
        猶予期間の間のログインで得た取り消し専用のセッション（`next: cancel_deletion`）で呼ぶ。取り消しの後、
        セッションは制限なしに入れ替わる（新しいセッションを返す）。予定が無ければ `409 deletion_not_scheduled`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                return_token: { type: boolean, default: false }
      responses:
        "200":
          description: 取り消した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/sessions:
    get:
      operationId: listMySessions
      summary: 本人の有効なセッションの一覧
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 新しい順
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/sessions/{id}:revoke:
    post:
      operationId: revokeMySession
      summary: 本人のセッションを失効させる
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 失効した（既に失効していても 204） }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/methods:
    get:
      operationId: listMyMethods
      summary: 本人の認証手段（メール、連携した外部 ID、passkey、TOTP、パスワード）の一覧
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 作成時刻の順
          content:
            application/json:
              schema:
                type: object
                required: [emails, identities, passkeys, totp, recovery_codes_remaining]
                properties:
                  recovery_codes_remaining: { type: integer, description: 未使用のリカバリーコードの数 }
                  emails:
                    type: array
                    items: { $ref: "#/components/schemas/MyEmail" }
                  identities:
                    type: array
                    items: { $ref: "#/components/schemas/MyIdentity" }
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/MyPasskey" }
                  totp:
                    type: array
                    items: { $ref: "#/components/schemas/MyTOTP" }
                  password:
                    type: object
                    description: 設定したパスワード（無ければ省略）
                    required: [created_at]
                    properties:
                      created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/emails:start:
    post:
      operationId: startAddEmail
      summary: メールの追加を始める（所有確認のコードとリンクを通知する）
      description: |
        ログイン済みの本人だけが足せる（4.2）。アドレスが別のユーザーで使われていても、所有を確かめるまでは
        同じ応答を返す。本人のメールなら `409 email_exists`。realm で `code` の経路が無効なら
        `400 verification_method_disabled`。`flow_id` はブラウザには `__Host-iam_flow` Cookie でも渡す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, expires_at]
                properties:
                  flow_id: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/emails:verify:
    post:
      operationId: verifyAddEmail
      summary: コードかリンクのトークンでメールの追加を完了する
      description: |
        `flow_id` は本文か `__Host-iam_flow` Cookie で渡す。照合の失敗は `401 authentication_failed`。
        所有を確かめた後、アドレスが使われていれば `409 email_exists`（自動リンクしない）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow_id: { type: string }
                code: { type: string }
                token: { type: string }
      responses:
        "200":
          description: 足した（primary にはしない）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyEmail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/emails/{id}:make-primary:
    post:
      operationId: makeMyEmailPrimary
      summary: 確認済みのメールを primary にする
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: primary にした }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/emails/{id}:remove:
    post:
      operationId: removeMyEmail
      summary: メールを消す
      description: |
        primary は消せない（`409 primary_email`。先に別のメールを primary にする）。最後の確認済みメールは
        `409 last_email`、消すとログインの手段が無くなるなら `409 last_method`（4.3）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 消した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/identities/{connection}:start:
    post:
      operationId: startLinkIdentity
      summary: 外部プロバイダ（OAuth / OIDC）の連携を始める
      description: |
        ログイン済みの本人だけが連携できる（4.2）。戻り先で受け取った `state` と `code` を
        `/v1/me/identities:complete` に渡す。`flow_id` はブラウザには `__Host-iam_oauth` Cookie でも渡す。
        Org 専用 SSO の connection は、その Org の管理ユーザーだけが連携できる（`409 not_managed_by_org`。ADR 0077）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: connection, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri: { type: string }
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema:
                type: object
                required: [flow_id, authorization_url, expires_at]
                properties:
                  flow_id: { type: string }
                  authorization_url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/identities:complete:
    post:
      operationId: completeLinkIdentity
      summary: プロバイダからの戻りで連携を完了する
      description: |
        フローを始めた本人のセッションでだけ完了できる。失敗は `401 authentication_failed`。
        外部 ID が既にどれかのユーザーに紐付いていれば `409 identity_exists`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                flow_id: { type: string }
                state: { type: string }
                code: { type: string }
      responses:
        "200":
          description: 連携した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyIdentity" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/identities/{id}:unlink:
    post:
      operationId: unlinkMyIdentity
      summary: 外部 ID の連携を解除する
      description: |
        削除ではなく無効化する（4.6）。その外部 ID で作ったセッションも使えなくなる。
        最後のログインの手段なら `409 last_method`。同じ外部 ID は後でまた連携できる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 解除した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/passkeys:start:
    post:
      operationId: startRegisterPasskey
      summary: passkey の登録を始める
      description: |
        `options` を `navigator.credentials.create()` に渡す（`PublicKeyCredential.parseCreationOptionsFromJSON(options.publicKey)`）。
        登録済みの passkey は除外を求める。フロー ID は `__Host-iam_passkey` Cookie と本文で返す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/passkeys:finish:
    post:
      operationId: finishRegisterPasskey
      summary: passkey の登録を完了する
      description: |
        `credential` は `navigator.credentials.create()` の結果の JSON（`PublicKeyCredential.toJSON()`）。
        登録済みなら `409 passkey_exists`、無効化した passkey は再登録できない（`409 passkey_revoked`。4.6）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                flow_id: { type: string }
                credential: { type: object, additionalProperties: true }
                name: { type: string, maxLength: 64, description: 表示用の名前。省略すると `Passkey` }
      responses:
        "200":
          description: 登録した。最初の強い認証手段なら `recovery_codes` を1回だけ返す（4.12）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisteredPasskey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/passkeys/{id}:rename:
    post:
      operationId: renameMyPasskey
      summary: passkey の名前を変える
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        "200":
          description: 変えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyPasskey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/passkeys/{id}:revoke:
    post:
      operationId: revokeMyPasskey
      summary: passkey を無効化する
      description: |
        削除せず無効化し、同じ passkey は再登録できない（4.6）。最後のログインの手段なら `409 last_method`。
        その passkey で作ったセッションは、遅くとも `validity_max_delay` の後に使えなくなる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 無効化した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/attributes:
    get:
      operationId: getMyAttributes
      summary: 自分のカスタム属性の値（design.md 11.7、ADR 0080）
      description: |
        値の無い属性は含まない。`editable` は本人が書ける属性の key。フィーチャー custom_attributes が動いていなければ `404`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 値
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyAttributes" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateMyAttributes
      summary: 自分のカスタム属性の値を書く
      description: |
        本人が編集できる属性（`user_editable`）だけ。`attributes` の key の値を置き換え、`null` なら消す。編集できない属性は
        `403 attribute_not_editable`、知らない key は `400 unknown_attribute`、型・制約に合わない値は `400 invalid_attribute_value`
        （どれかが誤りなら何も書かない）。`user.attributes_updated` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attributes]
              properties:
                attributes:
                  type: object
                  additionalProperties: {}
      responses:
        "200":
          description: 書いた後の値
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyAttributes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/merge-tokens:
    post:
      operationId: createMyMergeToken
      summary: 統合トークンを発行する（統合元。design.md 11.6、ADR 0082）
      description: |
        このアカウント（統合元）を別のアカウント（統合先）に統合するための、1回限り・10 分のトークンを返す。統合先でログインした
        本人が `POST /v1/me/merges` で使う（両方の所有の証明）。直近の本人確認が要る（`401 reauthentication_required`）。
        Org 管理ユーザーは `409 managed_user`、削除の予定があれば `409 deletion_scheduled`。フィーチャー account_merge が
        動いていなければ `404`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "201":
          description: 発行した
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/merges:
    post:
      operationId: mergeIntoMe
      summary: 別のアカウントをこのアカウントに統合する（取り消し不可）
      description: |
        統合元が発行した統合トークンを使い、統合元のメール・外部 ID・passkey・TOTP とパスワード（このアカウントに無ければ）・
        ロールの付与・Group の所属・カスタム属性の値（このアカウントに無ければ）・Membership をこのアカウントに移す。
        統合元の個人 Org は残し、このアカウントを owner にした新しい共有 Org を作って、個人 Org の中身（Group・独自のロール・
        サービスアカウント・Quota の付与）を移す。ロールの付与は移さない（owner が付け直す）。ホスト先は `user.merged` の
        `personal_org_id`・`shared_org_id` を見て、個人 Org の ID で持つデータを付け替える。両方が所属する Org では、
        役割の高い方を残す。統合元は `merged` になり、セッションと連携先の認可を失効する。監査ログと EventSink に
        `user.merged`（`user_id`・`merged_user_id`）を出す（連携先には統合元の `sub` が無くなることを伝える）。
        直近の本人確認が要る（`401 reauthentication_required`）。トークンが誤り・使用済み・期限切れなら `400 invalid_merge_token`、
        同じアカウントなら `400 same_user`。どちらかが Org 管理ユーザーなら `409 managed_user`、削除の予定があれば
        `409 deletion_scheduled`、統合元に消去の保留があれば `409 legal_hold`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: 統合した
          content:
            application/json:
              schema:
                type: object
                required: [merged_user_id]
                properties:
                  merged_user_id: { type: string, description: 統合元のユーザー }
                  shared_org_id: { type: string, description: 統合元の個人 Org の中身を移した、新しい共有 Org }
                  personal_org_id: { type: string, description: 統合元の個人 Org（残したまま） }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/password:set:
    post:
      operationId: setMyPassword
      summary: パスワードを設定・変更する（フィーチャー password）
      description: |
        変更には今のパスワード（`current_password`）が要る。初めての設定には直近の認証（`max_auth_age` の内）が要る
        （`401 reauthentication_required`）。最低長は 15 文字（2段階認証が必須なら 8 文字）、文字種は問わない。
        漏洩済みなら `400 password_breached`。成功すると、このセッションの他のセッションを失効させる（5.2）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 1024 }
                current_password: { type: string, maxLength: 1024 }
      responses:
        "204": { description: 設定した }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/password:remove:
    post:
      operationId: removeMyPassword
      summary: パスワードを外す（フィーチャー password）
      description: |
        今のパスワードが要る。最後のログインの手段なら `409 last_method`。成功すると、このセッションの他のセッションを
        失効させる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string, maxLength: 1024 }
      responses:
        "204": { description: 外した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/totp:start:
    post:
      operationId: startRegisterTOTP
      summary: TOTP（認証器アプリ）の登録を始める
      description: |
        秘密（Base32）と `otpauth://` の URI を本人にだけ返す。QR コードは画面で作る。
        登録はコードの確認（`/v1/me/totp:confirm`）で完了する。登録済みなら `409 totp_exists`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: 開始した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPEnrollment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/totp:confirm:
    post:
      operationId: confirmRegisterTOTP
      summary: TOTP の登録をコードで完了する
      description: |
        コードが違えば 401（回数の上限まではフローを使える）。登録だけのセッション（`next: enroll`）で完了すると、
        通常のセッションに替え、`login` で返す（Cookie も差し替える）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow_id, code]
              properties:
                flow_id: { type: string }
                code: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: 登録した
          content:
            application/json:
              schema:
                type: object
                required: [totp]
                properties:
                  totp: { $ref: "#/components/schemas/MyTOTP" }
                  login: { $ref: "#/components/schemas/LoginResult" }
                  recovery_codes:
                    type: array
                    description: 最初の強い認証手段なら、リカバリーコード（表示は1回だけ。4.12）
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/totp/{id}:revoke:
    post:
      operationId: revokeMyTOTP
      summary: TOTP を無効化する
      description: その TOTP を2要素目に使ったセッションは、遅くとも `validity_max_delay` の後に使えなくなる。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 無効化した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs:
    get:
      operationId: listMyOrgs
      summary: 本人の Org の一覧（終了した Membership は含めない。11.13）
      description: フィーチャー org が動いていなければ `404`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Membership の作成の順
          content:
            application/json:
              schema:
                type: object
                required: [orgs]
                properties:
                  orgs:
                    type: array
                    items: { $ref: "#/components/schemas/MyOrg" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createMyOrg
      summary: 共有 Org を作り、本人を owner にする（4.11）
      description: |
        realm の `org_creation` が許さなければ `403 org_creation_not_allowed`。名前が不正なら `400 invalid_org_name`。
        フィーチャー org が動いていなければ `404`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 400 }
      responses:
        "201":
          description: 作った
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyOrg" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/members:
    get:
      operationId: listOrgMembers
      summary: Org のメンバーの一覧（Org の owner と admin。4.4）
      description: |
        メールは Membership に結び付けたもの（未設定なら primary）だけを返す。ほかのメールは見せない。
        権限が無ければ `403 permission_denied`、Org が無いか所属していなければ `404`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: after, in: query, schema: { type: string } }
      responses:
        "200":
          description: Membership の公開 ID の順（終了したものは含めない）。続きは `next_cursor` を `after` に渡す
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/OrgMember" }
                  next_cursor: { type: string, description: 続きがあるときだけ }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/settings:
    get:
      operationId: getMyOrgSettings
      summary: Org の段のセキュリティ設定を返す（2.8）
      description: 権限 `org:settings`。`settings` は Org が設定した値（省いた項目は realm に従う）、`effective` は効く値。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettingsView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putMyOrgSettings
      summary: Org の段のセキュリティ設定を置き換える（2.8、5.4、10章）
      description: |
        権限 `org:settings`。省いた項目は realm に従う。寿命はホスト先が決める範囲の内で、realm より厳しくする向きにだけ変えられる
        （ホスト先が `org_may_relax` を許した項目は緩められる）。警告のアクションは realm より厳しくする向きのみ。外れれば `400 setting_invalid`。
        寿命は認証の時刻から数え、超えたセッションは使えなくなる（既存のセッションにも `validity_max_delay` の内に効く）。
        寿命を超えたセッションでこの Org に切り替えると `401 reauthentication_required`。
        deny にした警告に当たるセッションはこの Org に入れない（`warning_denied.<code>`。ログインは個人 Org などで成功する）。
        変更は `org.settings_changed` として監査ログに残す。個人 Org は `409 personal_org`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSettings" }
      responses:
        "200":
          description: 置き換えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettingsView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:delete:
    post:
      operationId: deleteMyOrg
      summary: 共有 Org を削除する（Org の owner。4.10）
      description: |
        realm の `org_deletion_grace`（既定30日）の後に削除する。その間はメンバーが入れず（`deletion_scheduled`）、
        `:cancel-deletion` で取り消せる。削除では全 Membership を `org_deleted` で終え、pending の招待を取り消す。
        個人 Org は `409 personal_org`、既に予定があれば `409 deletion_scheduled`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 削除を予約した（猶予が無ければ削除した）
          content:
            application/json:
              schema:
                type: object
                required: [deletes_at, deleted]
                properties:
                  deletes_at: { type: string, format: date-time }
                  deleted: { type: boolean, description: もう削除したか }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:cancel-deletion:
    post:
      operationId: cancelMyOrgDeletion
      summary: Org の削除の予定を取り消す（Org の owner。猶予期間の間だけ）
      description: 予定が無ければ `409 deletion_not_scheduled`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 取り消した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:leave:
    post:
      operationId: leaveMyOrg
      summary: 共有 Org から退会する（4.10）
      description: |
        個人ユーザーには常に許す（停止中・有効期間の外でも）。最後のオーナーは、譲るか Org を削除するまで抜けられない
        （`409 last_owner`）。個人 Org は `409 personal_org`。その Org を active にしているセッションは個人 Org に移る。
        再参加は新しい招待で。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 退会した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:transfer:
    post:
      operationId: transferMyOrg
      summary: オーナーを譲る（Org の owner。4.10）
      description: 譲り先は active なメンバーで、owner になる。譲った本人は admin になる。譲り先がメンバーでなければ `409 not_member`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id]
              properties:
                membership_id: { type: string }
      responses:
        "204": { description: 譲った }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/members/{membership_id}:remove:
    post:
      operationId: removeOrgMember
      summary: メンバーを除名する（Org の owner と admin。4.10）
      description: |
        退会と同じ処理で、`ended_reason = removed`。自分は対象にできず（`403 self_target`。退会を使う）、owner を
        対象にできるのは owner だけ。最後のオーナーは `409 last_owner`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 除名した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/members/{membership_id}:
    patch:
      operationId: updateOrgMember
      summary: メンバーの有効期間を変更する（Org の owner と admin。4.8）
      description: |
        `valid_from`・`valid_until` の両方を置き換える（省略か null は制限なし）。期間の外のメンバーはこの Org にだけ入れない。
        自分は対象にできず（`403 self_target`）、owner を対象にできるのは owner だけ。個人 Org は `409 personal_org`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                valid_from: { type: string, format: date-time, nullable: true }
                valid_until: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: 変更した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/members/{membership_id}/suspensions:
    post:
      operationId: suspendOrgMember
      summary: メンバーを停止する（Org の owner と admin。種別は customer_request。4.7）
      description: |
        `starts_at` を省略か過去なら今から、未来なら予約。`ends_at` を省略で無期限。停止中のメンバーはこの Org にだけ入れない。
        本人には `suspended.customer_request` だけを返し、`reason` は見せない。自分は対象にできず（`403 self_target`）、
        owner を対象にできるのは owner だけ。個人 Org は `409 personal_org`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
      responses:
        "201":
          description: 停止した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSuspension" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listOrgMemberSuspensions
      summary: メンバーの停止の一覧（Org の owner と admin。customer_request だけ）
      description: 運営者による停止（規約違反など）は含めない。開始の時刻の順。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema:
                type: object
                required: [suspensions]
                properties:
                  suspensions:
                    type: array
                    items: { $ref: "#/components/schemas/OrgSuspension" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/suspensions/{suspension_id}:lift:
    post:
      operationId: liftOrgSuspension
      summary: メンバーの停止を解除する（Org の owner と admin。customer_request だけ）
      description: 既に解除・終了していれば何もせず 200。自分の停止は解除できない（`403 self_target`）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: suspension_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: 解除した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSuspension" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/invitations:
    get:
      operationId: listOrgInvitations
      summary: Org の招待の一覧（Org の owner と admin）
      description: アドレスは pending の招待だけに返す（終わった招待はアドレスの鍵を消している）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 作成の順
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/OrgInvitation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: inviteToOrg
      summary: Org にアドレスを招待する（Org の owner と admin。owner として招待できるのは owner だけ。4.4）
      description: |
        トークンは通知（`org_invitation`）で招待したアドレスに届く。個人 Org には招待できない（`409 personal_org`）。
        既に active なメンバーなら `409 already_member`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, maxLength: 254 }
                role: { type: string, enum: [owner, admin, member] }
                valid_from: { type: string, format: date-time }
                valid_until: { type: string, format: date-time }
                managed:
                  type: boolean
                  description: |
                    管理ユーザーとして招く（ADR 0076）。アドレスのドメインを Org が証明済みであること（`409 email_domain_not_verified`）。
                    受け入れで新しく登録した人は管理ユーザーになり、既存のユーザーには管理を求める（本人の同意を待つ）
      responses:
        "201":
          description: 招待した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgInvitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/invitations/{invitation_id}:revoke:
    post:
      operationId: revokeOrgInvitation
      summary: pending の招待を取り消す（Org の owner と admin）
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: invitation_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 取り消した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/domains:
    get:
      operationId: listOrgDomains
      summary: Org のドメインの一覧（Org の owner。11.3）
      description: |
        Org の権限 `org:settings`（組み込みのロールでは owner だけが持つ。ドメインの4つの操作で同じ）。
        フィーチャー `org_managed_users` が動いていなければ 404。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 登録の順
          content:
            application/json:
              schema:
                type: object
                required: [domains]
                properties:
                  domains:
                    type: array
                    items: { $ref: "#/components/schemas/OrgDomain" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addOrgDomain
      summary: Org にドメインを登録する（Org の owner。11.3、ADR 0075）
      description: |
        未証明で登録し、TXT に置く名前と値を返す。ASCII だけ（IDN は A ラベル）。個人 Org には登録できない（`409 personal_org`）。
        同じドメインを登録済みなら `409 domain_exists`、realm の別の Org が証明済みなら `409 domain_taken`、
        Org のドメインが上限（20）に達していれば `409 domain_limit`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, maxLength: 254 }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDomain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/domains/{domain_id}:verify:
    post:
      operationId: verifyOrgDomain
      summary: ドメインの TXT を確かめ、証明済みにする（Org の owner）
      description: |
        `txt_name` に `txt_value` の TXT が無ければ `409 domain_not_verified`（確かめた時刻は残る）。
        realm の別の Org が先に証明していれば `409 domain_taken`。証明済みなら何もしない。DNS の障害は 503。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: domain_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 証明済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDomain" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: DNS に問い合わせられなかった
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/orgs/{id}/domains/{domain_id}:delete:
    post:
      operationId: deleteOrgDomain
      summary: ドメインを消す（Org の owner）
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: domain_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 消した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/connections:
    get:
      operationId: listOrgConnections
      summary: Org 専用 SSO の connection の一覧（Org の owner。11.3、ADR 0077）
      description: フィーチャー `org_managed_users` が動いていなければ 404。クライアントシークレットは返さない。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 登録の順
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/OrgConnection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addOrgConnection
      summary: Org 専用 SSO の connection（OIDC）を登録する（Org の owner。ADR 0077）
      description: |
        Org の IdP（OIDC）を登録する。IdP には応答の `redirect_uri`（ホスト型ログイン画面の戻り先。Org は選べない）を登録する。
        URL は https に限り、トークンエンドポイントは公開のアドレスに限る。その Org の管理ユーザーだけがログインでき、
        登録は Org が証明したドメインのアドレスに限る。個人 Org には登録できない（`409 personal_org`）。
        Org の connection が上限（5）に達していれば `409 connection_limit`。設定の誤りは `400 invalid_connection`（サーバーの server.public_url が無ければ `400 public_url_required`）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer, authorization_endpoint, token_endpoint, client_id, client_secret]
              properties:
                issuer: { type: string, maxLength: 2048, description: ID トークンの iss }
                authorization_endpoint: { type: string, maxLength: 2048 }
                token_endpoint: { type: string, maxLength: 2048 }
                client_id: { type: string, maxLength: 2048 }
                client_secret: { type: string, maxLength: 2048 }
                scopes:
                  type: array
                  maxItems: 20
                  description: 既定は openid と email。openid を含むこと
                  items: { type: string }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/connections/{connection_id}:delete:
    post:
      operationId: deleteOrgConnection
      summary: Org 専用 SSO の connection を消す（Org の owner）
      description: 紐付けた外部 ID は無効化する（その connection ではログインできなくなる）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: connection_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 消した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/members/{membership_id}:request-management:
    post:
      operationId: requestOrgManagement
      summary: メンバーに、Org による管理を求める（Org の owner。11.3、ADR 0076）
      description: |
        本人が `:accept-management` で受け入れると管理ユーザーになる。対象は、この Org で使うメールが確認済みで、
        そのドメインを Org が証明済みのメンバー（`409 email_domain_not_verified`）。既に管理ユーザーなら `409 already_managed`、
        別の Org の管理ユーザーなら `409 managed_by_another_org`。求め済みなら何もしない。フィーチャー `org_managed_users` が要る。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 求めた }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/members/{membership_id}:release-management:
    post:
      operationId: releaseOrgManagement
      summary: 管理ユーザーを手放す（個人ユーザーに戻す）か、管理の求めを取り消す（Org の owner）
      description: どちらでもなければ `409 not_managed`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 手放した }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/members/{membership_id}:delete-account:
    post:
      operationId: deleteManagedAccount
      summary: 管理ユーザーのアカウントを削除する（Org の owner。11.3、ADR 0076）
      description: |
        本人の削除（`/v1/me/account:delete`）と同じく、realm の `user_deletion_grace` の後に消す。既存のセッションはすべて失効する。
        管理ユーザーは削除の予約を取り消せない。対象がこの Org の管理ユーザーでなければ `409 not_managed`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: membership_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 削除を予約した（猶予が無ければ削除した）
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deletes_at: { type: string, format: date-time, description: 予約したとき }
                  deleted: { type: boolean, description: もう削除したか }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:accept-management:
    post:
      operationId: acceptOrgManagement
      summary: Org による管理を受け入れる（本人。11.3）
      description: |
        以後は Org がアカウントを所有し、本人はその Org を抜けられず、自分でアカウントを消せない（`409 managed_user`）。
        求めが無ければ `409 no_management_request`。受け入れの時点でメールとドメインを確かめ直す。
        直近の本人確認が要る（`max_auth_age` を過ぎていれば `401 reauthentication_required`）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 管理ユーザーになった }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:decline-management:
    post:
      operationId: declineOrgManagement
      summary: Org による管理の求めを断る（本人）
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 断った }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:bind-email:
    post:
      operationId: bindMyOrgEmail
      summary: この Org で使うメールを結び付ける（4.4）
      description: "`email_id` を省くと primary に戻す。確認済みの本人のメールだけ。"
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_id: { type: string }
      responses:
        "200":
          description: 結び付けた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyOrg" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/invitations:accept:
    post:
      operationId: acceptInvitation
      summary: 招待を受け入れる（4.4）
      description: |
        トークンは招待したアドレスに届いたもの。招待したアドレスが Membership に結び付く。
        - ログインしている：アドレスが本人のものならそれを結び付ける。誰のものでもなければ、realm が経路 `invitation` を受け入れるなら
          本人に足して結び付ける（受け入れないなら `409 email_verification_required`。先に `/v1/me/emails:start` で確かめる）。
          ほかのユーザーのものなら `409 email_exists`
        - ログインしていない：アドレスが誰のものでもなく、realm が経路 `invitation` を受け入れるなら、そのアドレスで登録して
          招待された Org に入ったセッションを返す（`login`）。既存のユーザーのものなら `409 login_required`
        無い・期限切れ・使用済みのトークンは `404 invalid_invitation`。Org の削除が予定されているなら `409 deletion_scheduled`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                return_token: { type: boolean }
      responses:
        "200":
          description: 受け入れた
          content:
            application/json:
              schema:
                type: object
                required: [org]
                properties:
                  org: { $ref: "#/components/schemas/MyOrg" }
                  login: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}:switch:
    post:
      operationId: switchMyOrg
      summary: セッションの Org を切り替える（4.4）
      description: |
        active な Membership のある Org に切り替え、セッションの ID を入れ替える（古い ID はすぐ失効する）。
        Cookie のセッションは Cookie を差し替える。Org が無いか所属していなければ `404`（存在を明かさない）。所属しているが入れない（停止・有効期間の外）なら `403 no_available_org`。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                return_token: { type: boolean }
      responses:
        "200":
          description: 切り替えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/passkeys/{id}:set-org:
    post:
      operationId: setMyPasskeyOrg
      summary: この passkey でログインしたときに入る Org を決める（4.4）
      description: "`org_id` を省くと指定を外す。active な Membership のある Org だけ。"
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                org_id: { type: string }
      responses:
        "200":
          description: 決めた
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/roles:
    get:
      operationId: listMyOrgRoles
      summary: この Org の範囲で使えるロールの一覧（4.11）
      description: |
        権限 `org:roles`。付与できる組み込みのロールと、独自のロールを返す。
        組み込みの Org のロール（`org:owner` など）は Membership の `org_role` から効くもので、付与はできないが一覧には含める。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roles" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createMyOrgRole
      summary: 独自のロールを作る（4.11）
      description: |
        権限 `org:roles`。渡す IAM 自身の権限（`org:`・`users:` など）はすべて自分がこの Org の範囲で持っていなければならない（`403 permission_denied`）。連携先の権限（`doc:read` など）は自由に入れられる。
        名前に組み込みの名前空間（`realm:`・`org:`・`system:`）は使えない（`400 invalid_name`）。権限の形は `<リソース>:<操作>`（`400 invalid_permission`）。
        IAM 自身の realm の管理の権限（`users:`・`orgs:` など）は Org のロールに入れられない。名前の重複は `409 role_exists`。`role.created` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/roles/{role_id}:
    put:
      operationId: updateMyOrgRole
      summary: 独自のロールの名前と権限を置き換える
      description: |
        権限 `org:roles`。今と新しい IAM 自身の権限をすべて自分が持っていなければならない。`role.updated` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: role_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/roles/{role_id}:delete:
    post:
      operationId: deleteMyOrgRole
      summary: 独自のロールと、その付与を消す
      description: |
        権限 `org:roles`。ロールの IAM 自身の権限をすべて自分が持っていなければならない。`role.deleted` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: role_id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 成功
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/role-bindings:
    get:
      operationId: listMyOrgRoleBindings
      summary: この Org の範囲のロールの付与の一覧
      description: |
        権限 `org:roles`。作成の順。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleBindings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createMyOrgRoleBinding
      summary: ロールを付与する（4.11）
      description: |
        権限 `org:roles`。ロールの IAM 自身の権限をすべて自分が持っていなければならない。`role` は組み込みのロールの名前か、独自のロールの ID。
        主体はこの Org の使える所属を持つユーザーか、この Org の Group（`409 not_member`・`400 invalid_principal`）。運営者ロールは付与できない（`400 unknown_role`）。
        `resource_type`・`resource_id` を渡せば、そのリソースだけに効く。同じ付与は `409 binding_exists`。`role.granted` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleBindingInput" }
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleBinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/role-bindings/{binding_id}:delete:
    post:
      operationId: deleteMyOrgRoleBinding
      summary: ロールの付与を消す
