        権限 `org:roles`。ロールの IAM 自身の権限をすべて自分が持っていなければならない。`role.revoked` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: binding_id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 成功
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/groups:
    get:
      operationId: listMyOrgGroups
      summary: この Org の範囲の Group の一覧（3.2）
      description: |
        権限 `org:groups`。名前の順。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Groups" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createMyOrgGroup
      summary: Group を作る
      description: |
        権限 `org:groups`。名前の重複は `409 group_exists`。`group.created` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/groups/{group_id}:
    patch:
      operationId: renameMyOrgGroup
      summary: Group の名前を変える
      description: |
        権限 `org:groups`。`group.renamed` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: group_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/groups/{group_id}:delete:
    post:
      operationId: deleteMyOrgGroup
      summary: Group と、その所属と付与を消す
      description: |
        権限 `org:groups`。Group に付与されたロールの IAM 自身の権限をすべて自分が持っていなければならない。`group.deleted` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: group_id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 成功
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/orgs/{id}/groups/{group_id}/members:
    get:
      operationId: listMyOrgGroupMembers
      summary: Group の所属の一覧
      description: |
        権限 `org:groups`。作成の順。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: group_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMembers" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addMyOrgGroupMember
      summary: Group に主体を入れる
      description: |
        権限 `org:groups`。Group に付与されたロールの IAM 自身の権限をすべて自分が持っていなければならない。主体はユーザー（この Org の使える所属が要る。`409 not_member`）。
        フィーチャー `nested_groups` が有効なら、同じ範囲の Group も入れられる（入れた Group の所属に、この Group の付与が効く。
        循環は `409 group_cycle`、入れ子が 5 段を超えるなら `409 group_too_deep`。ADR 0079）。
        既に所属していれば `409 member_exists`。`group.member_added` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: group_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMemberInput" }
      responses:
        "204":
          description: 成功
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/orgs/{id}/groups/{group_id}/members:remove:
    post:
      operationId: removeMyOrgGroupMember
      summary: Group から主体を外す
      description: |
        権限 `org:groups`。`group.member_removed` を監査ログに残す。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: group_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMemberInput" }
      responses:
        "204":
          description: 成功
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me:check:
    post:
      operationId: checkMyAuthz
      summary: 本人が操作をできるかを判定する（4.5）
      description: |
        画面の出し分けなどに使う。`org_id` を省けば、セッションの active な Org の範囲で判定する（Org がオフなら realm の範囲）。
        所属していない Org や無い Org は `allowed: false`。`resource_type`・`resource_id` を渡せば、そのリソースを限った付与も効く。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MyCheckRequest" }
      responses:
        "200":
          description: 判定の結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-iam_session
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: 要求の形式の誤り
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: 本人確認の失敗（理由は返さない）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 見つからない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 状態が合わず受け付けられない。`error` に理由のコード（`email_exists`、`last_method` など）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Denied:
      description: 本人確認の後の拒否。`reasons` に拒否理由のコード（`warning_denied.<code>`、`suspended.<category>`、`outside_validity` など。4.9）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: 回数の上限を超えた（`rate_limited`）
      headers:
        Retry-After:
          description: 次に試せるまでの秒数
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    MyAttributes:
      type: object
      required: [attributes, editable]
      properties:
        attributes:
          type: object
          additionalProperties: {}
        editable: { type: array, items: { type: string } }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 公開の契約のコード（design.md 4.9、11.10）
        reasons:
          type: array
          items: { type: string }
          description: 拒否理由のコードの一覧（複数該当すればすべて。4.9）
        quota: { $ref: "#/components/schemas/QuotaShortage" }
    QuotaShortage:
      type: object
      description: Quota の不足（`quota_exceeded`。11.14）。`from` から `until`（無ければ無期限）の間、上限 `limit` に `count` 人がいる
      required: [from, limit, count, shortage]
      properties:
        from: { type: string, format: date-time }
        until: { type: string, format: date-time }
        limit: { type: integer, format: int64 }
        count: { type: integer, format: int64 }
        shortage: { type: integer, format: int64, description: 足りない人数 }
    LoginResult:
      type: object
      required: [session_id, expires_at, user_id, created, warnings]
      properties:
        session_id: { type: string }
        expires_at: { type: string, format: date-time }
        user_id: { type: string, description: 公開のユーザー ID（内部 ID は返さない。ADR 0045） }
        created: { type: boolean, description: 新規登録だったか }
        token: { type: string, description: "`return_token: true` のときだけ。Bearer で使う" }
        next:
          type: string
          enum: [second_factor, enroll, recovery, cancel_deletion]
          description: |
            セッションが制限つきのときの次の手順（4.1、2.8、4.12）。`second_factor` は2要素目の確認待ち、`enroll` は2要素目の
            登録だけ、`recovery` は新しい認証手段の登録と復旧の完了だけができる。`cancel_deletion` はアカウントの削除の
            猶予期間の間で、`/v1/me/account:cancel-deletion` とログアウトだけができる（4.10）。制限つきのセッションは短い期限で失効し、
            決まった API にしか使えない（他は未ログインの扱い）。
        second_factor_methods:
          type: array
          description: "`next: second_factor` のとき使える2要素目（`passkey`、`totp`）"
          items: { type: string }
        warnings:
          type: array
          description: 認証の警告（design.md 10章）。コードで返し、表示の文言はクライアントで決める
          items: { $ref: "#/components/schemas/Warning" }
        org_id: { type: string, description: セッションが入った Org（公開 ID。Org がオフなら無し。4.4） }
        org_choices:
          type: array
          description: |
            ログインの手がかりに結び付いた Org が複数あり、前回の Org がその中に無いときの候補（公開 ID）。
            このときセッションは個人 Org に入っている。選んだ Org へは `/v1/me/orgs/{id}:switch` で切り替える
          items: { type: string }
    Warning:
      type: object
      required: [code, severity, action]
      properties:
        code: { type: string, description: "`single_factor`、`oauth_email_unverified` など（公開の契約）" }
        severity: { type: string, enum: [low, medium, high] }
        action: { type: string, enum: [warn, deny] }
        params: { type: object, additionalProperties: true }
    Session:
      type: object
      required: [id, authenticated_at, last_seen_at, expires_at, auth_methods, current]
      properties:
        id: { type: string, description: 公開のセッション ID（ses_…） }
        authenticated_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        auth_methods:
          type: array
          items: { type: string }
        current: { type: boolean, description: このリクエストのセッションか }
    MyOrg:
      type: object
      required: [id, kind, role, membership_id, active]
      properties:
        id: { type: string, description: 公開の Org ID }
        kind: { type: string, enum: [personal, shared] }
        name: { type: string, description: 共有 Org の名前（個人 Org には無い） }
        role: { type: string, enum: [owner, admin, member] }
        membership_id: { type: string }
        status: { type: string, enum: [invited, active] }
        active: { type: boolean, description: このセッションが入っている Org か }
        email_id: { type: string, description: この Org に結び付けたメール。未設定（primary を使う）なら無し }
        managed: { type: boolean, description: この Org が本人のアカウントを管理している（ADR 0076） }
        management_requested: { type: boolean, description: この Org が管理を求めている（本人の同意を待つ） }
        unavailable:
          type: array
          items: { type: string }
          description: 今この Org に入れない理由のコード（`suspended.<category>`、`outside_validity`。4.9）。入れるなら無し
    OrgMember:
      type: object
      required: [membership_id, user_id, role, status]
      properties:
        membership_id: { type: string }
        user_id: { type: string, description: 公開のユーザー ID }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [invited, active] }
        email: { type: string, description: この Org に結び付けたメール（未設定なら primary） }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        managed: { type: boolean, description: この Org の管理ユーザー（ADR 0076） }
        management_requested: { type: boolean, description: 管理を求めて本人の同意を待っている }
    OrgSettings:
      type: object
      description: Org の段の設定。省いた項目は realm に従う
      properties:
        absolute_lifetime_seconds: { type: integer, format: int64, minimum: 1, description: 認証の時刻からのセッションの寿命 }
        idle_timeout_seconds: { type: integer, format: int64, minimum: 1 }
        max_auth_age_seconds: { type: integer, format: int64, minimum: 1, description: 重要な操作に求める直近の認証の期限 }
        warnings:
          type: object
          description: 警告のコードごとのアクション
          additionalProperties: { type: string, enum: [ignore, warn, deny] }
        login_policy: { $ref: "#/components/schemas/OrgLoginPolicy" }
    OrgLoginPolicy:
      type: object
      description: >-
        Org のログインポリシー（フィーチャー org_login_policy）。ログインと Org の切り替えで判定し、満たさなければその Org に入れない
        （理由は policy.<種類>）。空の項目は判定しない
      properties:
        require_passkey: { type: boolean, description: passkey で本人確認したセッションだけを入れる }
        membership_email_domains:
          type: array
          maxItems: 50
          description: Membership に結び付けたメール（無ければ primary、確認済み）のドメインがこのどれかであること
          items: { type: string }
        ip_allowlist:
          type: array
          maxItems: 100
          description: 要求の IP がこのどれか（CIDR）に入ること
          items: { type: string }
        require_sso:
          type: boolean
          description: この Org の connection（Org 専用 SSO。ADR 0077）で認証したセッションだけを入れる。フィーチャー org_managed_users も要る
    OrgSettingsView:
      type: object
      required: [settings, effective]
      properties:
        settings: { $ref: "#/components/schemas/OrgSettings" }
        effective:
          type: object
          required: [absolute_lifetime_seconds, idle_timeout_seconds, max_auth_age_seconds, warnings]
          properties:
            absolute_lifetime_seconds: { type: integer, format: int64 }
            idle_timeout_seconds: { type: integer, format: int64 }
            max_auth_age_seconds: { type: integer, format: int64 }
            warnings:
              type: object
              description: すべての警告のコードのアクション（フィーチャー warnings が動いていなければ空）
              additionalProperties: { type: string, enum: [ignore, warn, deny] }
    OrgSuspension:
      type: object
      required: [id, membership_id, category, reason, starts_at, active, created_at]
      properties:
        id: { type: string }
        membership_id: { type: string }
        category: { type: string }
        reason: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        active: { type: boolean, description: 今停止中か }
        created_at: { type: string, format: date-time }
        lifted_at: { type: string, format: date-time }
    OrgInvitation:
      type: object
      required: [id, role, status, expires_at, created_at]
      properties:
        id: { type: string }
        email: { type: string, description: pending の招待だけ }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        managed: { type: boolean, description: 管理ユーザーとして招いた }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    OrgDomain:
      type: object
      required: [id, domain, status, txt_name, txt_value, created_at]
      properties:
        id: { type: string, description: 公開のドメイン ID（dom_…） }
        domain: { type: string }
        status: { type: string, enum: [pending, verified] }
        txt_name: { type: string, description: TXT を置く名前（`_iam-challenge.<domain>`） }
        txt_value: { type: string, description: TXT の値（`iam-domain-verification=<token>`） }
        verified_at: { type: string, format: date-time }
        checked_at: { type: string, format: date-time, description: 最後に TXT を確かめた時刻 }
        created_at: { type: string, format: date-time }
    OrgConnection:
      type: object
      required: [id, issuer, authorization_endpoint, token_endpoint, client_id, scopes, redirect_uri, created_at]
      properties:
        id: { type: string, description: "公開の connection ID（con_…）。`/v1/login/oauth/{connection}:start` に渡す" }
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        client_id: { type: string }
        scopes:
          type: array
          items: { type: string }
        redirect_uri: { type: string, description: IdP に登録する戻り先 }
        created_at: { type: string, format: date-time }
    MyEmail:
      type: object
      required: [id, email, primary, verified, created_at]
      properties:
        id: { type: string, description: 公開のメール ID（eml_…） }
        email: { type: string, description: アドレス。最小化モード（9.6）では空 }
        primary: { type: boolean }
        verified: { type: boolean }
        verified_via: { type: string, description: "`code`、`oauth_provider`、`admin` など" }
        created_at: { type: string, format: date-time }
    MyIdentity:
      type: object
      required: [id, connection, created_at]
      properties:
        id: { type: string, description: 公開の外部 ID の紐付けの ID（idn_…） }
        connection: { type: string, description: connection の slug（google など） }
        created_at: { type: string, format: date-time }
    MyPasskey:
      type: object
      required: [id, name, created_at, backup_eligible]
      properties:
        id: { type: string, description: 公開の passkey の ID（psk_…） }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        backup_eligible: { type: boolean, description: 同期される passkey か（認証器の BE フラグ） }
    RegisteredPasskey:
      allOf:
        - $ref: "#/components/schemas/MyPasskey"
        - type: object
          properties:
            recovery_codes:
              type: array
              description: 最初の強い認証手段なら、リカバリーコード（表示は1回だけ。4.12）
              items: { type: string }
    MyTOTP:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string, description: 公開の TOTP の ID（otp_…） }
        created_at: { type: string, format: date-time }
    TOTPEnrollment:
      type: object
      required: [flow_id, secret, uri, expires_at]
      properties:
        flow_id: { type: string }
        secret: { type: string, description: Base32 の秘密（手で入力する人向け） }
        uri: { type: string, description: "`otpauth://totp/…`（QR コードにする）" }
        expires_at: { type: string, format: date-time }
    PasskeyCeremony:
      type: object
      required: [flow_id, options, expires_at]
      properties:
        flow_id: { type: string }
        options:
          type: object
          additionalProperties: true
          description: "`{\"publicKey\": …}`。WebAuthn の options の JSON の形"
        expires_at: { type: string, format: date-time }
    Role:
      type: object
      required: [id, name, permissions, builtin, assignable]
      properties:
        id: { type: string, description: 組み込みのロールは名前、独自のロールは公開 ID }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
        builtin: { type: boolean }
        assignable: { type: boolean, description: 付与の API で付与できるか（組み込みの Org のロールは org_role から効くので false） }
    Roles:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions:
          type: array
          maxItems: 100
          items: { type: string }
    RoleBinding:
      type: object
      required: [id, role, principal_type, principal_id, created_at]
      properties:
        id: { type: string }
        role: { type: string, description: 組み込みのロールの名前か、独自のロールの ID }
        principal_type: { type: string, description: user / group }
        principal_id: { type: string, description: 主体の公開 ID }
        resource_type: { type: string }
        resource_id: { type: string }
        created_at: { type: string, format: date-time }
    RoleBindings:
      type: object
      required: [bindings]
      properties:
        bindings:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }
    RoleBindingInput:
      type: object
      required: [role, principal_type, principal_id]
      properties:
        role: { type: string }
        principal_type: { type: string, description: user / group }
        principal_id: { type: string }
        resource_type: { type: string, maxLength: 64 }
        resource_id: { type: string, maxLength: 256 }
    Group:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Groups:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/Group" }
    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    GroupMember:
      type: object
      required: [principal_type, principal_id, created_at]
      properties:
        principal_type: { type: string, description: "user・service_account・group（nested_groups が有効なとき）" }
        principal_id: { type: string, description: 主体の公開 ID }
        created_at: { type: string, format: date-time }
    GroupMembers:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
    GroupMemberInput:
      type: object
      required: [principal_type, principal_id]
      properties:
        principal_type: { type: string, description: "user・service_account・group（nested_groups が有効なとき）" }
        principal_id: { type: string }
    MyCheckRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, minLength: 1, maxLength: 130, description: "`<リソース>:<操作>`" }
        org_id: { type: string, description: 判定の文脈の Org の公開 ID。省けば active な Org }
        resource_type: { type: string, maxLength: 64, description: "`org` なら `resource_id`（Org の公開 ID）が判定の文脈の Org になる。`org_id` と食い違えば `400`" }
        resource_id: { type: string, maxLength: 256 }
    CheckResult:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
