      summary: 自前の API（リソースサーバー）の一覧（RFC 8707。ADR 0112）
      description: 権限 `clients:manage`。作成の順。フィーチャー `resource_indicators` が動いていなければ `404 resource_indicators_disabled`。
      responses:
        "200":
          description: リソース
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthResources" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createOAuthResource
      summary: 自前の API（リソースサーバー）を登録する（RFC 8707。ADR 0112）
      description: |
        権限 `clients:manage`。`uri` は `resource` の値で、発行するアクセストークンの aud になる（https の絶対 URI か URN。
        フラグメント・クエリ・userinfo なし。realm の中で一意。完全一致で比べる）。`scopes` はこのリソースで使えるスコープ
        （OIDC のスコープの名前は使えない）。`clients` は認可コードフローで `resource` に指定してよい連携先の client_id、
        `service_accounts` は client credentials（`POST /v1/admin/token`）で指定してよいサービスアカウントの ID。
        内容が正しくなければ `400 invalid_resource`、`uri` が重複すれば `409 resource_exists`。
        `oauth_resource.created` を監査ログに残す。フィーチャー `resource_indicators` が動いていなければ `404 resource_indicators_disabled`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthResourceInput" }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthResource" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

