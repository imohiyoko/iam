      description: |
        権限 `service_accounts:manage`。ID の順に、`limit` 件ずつ返す。続きは `next_cursor` を `after` に渡す。
        フィーチャー service_accounts が動いていなければ `404 service_accounts_disabled`。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: after, in: query, schema: { type: string } }
      responses:
        "200":
