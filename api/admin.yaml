        権限 `clients:manage`。古い秘密はすぐに使えなくなる。`client_secret` を使わない連携先は `409 no_client_secret`。
        `client.secret_rotated` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 新しい秘密（1度だけ返す）
          content:
            application/json:
              schema:
                type: object
                required: [client_secret]
                properties:
                  client_secret: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/clients/{id}:delete:
    post:
      operationId: deleteClient
      summary: 連携先を消す
      description: 権限 `clients:manage`。`client.deleted` を監査ログに残す。
