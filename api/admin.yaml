    post:
      operationId: createRoleBinding
      summary: ロールを付与する（4.11）
      description: |
        権限 `roles:manage`。ロールの IAM 自身の権限をすべて自分が持っていなければならない。`role` は組み込みのロールの名前か、独自のロールの ID。
        運営者ロールの付与は `realm:owner` だけ（`roles:manage`）。主体はユーザー、realm 全体の Group、サービスアカウント（`service_account`。ID はサービスアカウントの ID）。
        `resource_type`・`resource_id` を渡せば、そのリソースだけに効く。同じ付与は `409 binding_exists`。`role.granted` を監査ログに残す。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleBindingInput" }
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleBinding" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

