      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAttributes" }
      responses:
        "200":
          description: 書いた後の値
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttributes" }
