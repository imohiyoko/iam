        "200":
          description: カタログ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionCatalog" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updatePermissionCatalog
      summary: 連携先の権限のカタログを置き換える
      description: |
        権限 `permission_catalogs:manage`。独自のロール（realm 共通と Org のもの）が使っている権限を外すことはできない
        （`409 catalog_in_use`。使っているロールを返す）。`permission_catalog.updated` を監査ログに残す。
      parameters:
