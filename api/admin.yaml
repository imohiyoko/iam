      summary: サービスアカウントを作る（design.md 11.2、ADR 0074）
      description: |
        権限 `service_accounts:manage`。`org_id`（共有 Org の公開 ID）を渡せば、その Org に属する（Org が削除・停止・有効期間の外なら使えない。
        フィーチャー org が要る）。認証情報は `…/credentials` で足し、権限は `/v1/admin/role-bindings`（`principal_type: service_account`）で付ける。
        `service_account.created` を監査ログに残す。フィーチャー service_accounts が動いていなければ `404 service_accounts_disabled`。
      requestBody:
        required: true
