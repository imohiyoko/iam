      description: 権限 `suspensions:read`。開始の時刻の順。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspensions" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/token:
    post:
      operationId: issueServiceAccountToken
      summary: client credentials でアクセストークンを発行する（RFC 6749 4.4、ADR 0074）
      description: |
        認証はこの要求の中で行う（Bearer は要らない）。`client_secret` は `Authorization: Basic`（client_id と client_secret）か form の
        `client_id`・`client_secret` で、`private_key_jwt` は `client_assertion_type`（`urn:ietf:params:oauth:client-assertion-type:jwt-bearer`）と
        `client_assertion`（RFC 7523。`iss`・`sub` は client_id、`aud` は issuer、`exp` は 5 分以内、`jti` は1回だけ）で渡す。
        発行するのは不透明なトークンで、`Authorization: Bearer` で管理 API に使う。寿命は `service_accounts.token_ttl`。
        認証の失敗は理由を区別せず `401 invalid_client`。`service_account.token_issued` を監査ログに残す。
        フィーチャー service_accounts が動いていなければ `404 service_accounts_disabled`。
      security: []
      parameters:
        - { name: Authorization, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
                client_assertion_type: { type: string }
                client_assertion: { type: string }
                scope: { type: string, description: 使わない（権限はロールの付与で決まる） }
      responses:
        "200":
          description: 発行した
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: サービスアカウントの API キーか、運営者のセッションのトークン。
  responses:
    Error:
      description: エラー
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ServiceAccount:
      type: object
      required: [id, name, created_at, deleted]
      properties:
        id: { type: string, description: client credentials の client_id にもなる }
        name: { type: string }
        org_id: { type: string, description: 所属する Org の公開 ID }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        deleted: { type: boolean }
        deleted_at: { type: string, format: date-time }
    ServiceAccountInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 400 }
        org_id: { type: string, description: 共有 Org の公開 ID }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
    ServiceAccountCredential:
      type: object
      required: [id, type, created_at, active]
      properties:
        id: { type: string }
        type: { type: string, enum: [api_key, client_secret, private_key_jwt] }
        alg: { type: string }
        public_key: { type: object, additionalProperties: true, description: private_key_jwt の公開鍵（JWK） }
        secret: { type: string, description: api_key と client_secret を作ったときだけ、1度だけ返す }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        active: { type: boolean, description: 今使えるか }
    ServiceAccountCredentialInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [api_key, client_secret, private_key_jwt] }
        public_key: { type: object, additionalProperties: true, description: private_key_jwt の公開鍵（JWK） }
        alg: { type: string, enum: [ES256, EdDSA, ML-DSA-65] }
        expires_at: { type: string, format: date-time }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    OrgSettings:
      type: object
      description: Org の段の設定。省いた項目は realm に従う
      properties:
        absolute_lifetime_seconds: { type: integer, format: int64, minimum: 1, description: 認証の時刻からのセッションの寿命 }
        idle_timeout_seconds: { type: integer, format: int64, minimum: 1 }
        max_auth_age_seconds: { type: integer, format: int64, minimum: 1, description: 重要な操作に求める直近の認証の期限 }
        warnings:
          type: object
          description: 警告のコードごとのアクション
          additionalProperties: { type: string, enum: [ignore, warn, deny] }
        login_policy: { $ref: "#/components/schemas/OrgLoginPolicy" }
    OrgLoginPolicy:
      type: object
      description: >-
        Org のログインポリシー（フィーチャー org_login_policy）。ログインと Org の切り替えで判定し、満たさなければその Org に入れない
        （理由は policy.<種類>）。空の項目は判定しない
      properties:
        require_passkey: { type: boolean, description: passkey で本人確認したセッションだけを入れる }
        membership_email_domains:
          type: array
          maxItems: 50
          description: Membership に結び付けたメール（無ければ primary、確認済み）のドメインがこのどれかであること
          items: { type: string }
        ip_allowlist:
          type: array
          maxItems: 100
          description: 要求の IP がこのどれか（CIDR）に入ること
          items: { type: string }
        require_sso:
          type: boolean
          description: この Org の connection（Org 専用 SSO。ADR 0077）で認証したセッションだけを入れる。フィーチャー org_managed_users も要る
    OrgDomain:
      type: object
      required: [id, domain, status, txt_name, txt_value, created_at]
      properties:
        id: { type: string, description: 公開のドメイン ID（dom_…） }
        domain: { type: string }
        status: { type: string, enum: [pending, verified] }
        txt_name: { type: string, description: TXT を置く名前（`_iam-challenge.<domain>`） }
        txt_value: { type: string, description: TXT の値（`iam-domain-verification=<token>`） }
        verified_at: { type: string, format: date-time }
        checked_at: { type: string, format: date-time, description: 最後に TXT を確かめた時刻 }
        created_at: { type: string, format: date-time }
    OrgSettingsView:
      type: object
      required: [settings, effective]
      properties:
        settings: { $ref: "#/components/schemas/OrgSettings" }
        effective:
          type: object
          required: [absolute_lifetime_seconds, idle_timeout_seconds, max_auth_age_seconds, warnings]
          properties:
            absolute_lifetime_seconds: { type: integer, format: int64 }
            idle_timeout_seconds: { type: integer, format: int64 }
            max_auth_age_seconds: { type: integer, format: int64 }
            warnings:
              type: object
              description: すべての警告のコードのアクション（フィーチャー warnings が動いていなければ空）
              additionalProperties: { type: string, enum: [ignore, warn, deny] }
    Org:
      type: object
      required: [id, kind, created_at]
      properties:
        id: { type: string, description: 公開の Org ID }
        kind: { type: string, enum: [personal, shared] }
        name: { type: string }
        personal_owner_id: { type: string, description: 個人 Org の持ち主（公開のユーザー ID） }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        deletion_scheduled_at: { type: string, format: date-time, description: 削除の予定（猶予期間の終わり） }
        deleted_at: { type: string, format: date-time, description: 削除した時刻 }
        created_at: { type: string, format: date-time }
    Membership:
      type: object
      required: [id, user_id, org_id, status, role, created_at]
      properties:
        id: { type: string }
        user_id: { type: string, description: 公開のユーザー ID }
        org_id: { type: string }
        status: { type: string, enum: [invited, active, ended] }
        role: { type: string, enum: [owner, admin, member] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        ended_reason: { type: string }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string, description: 運営者向けの説明（秘密や個人情報は含めない） }
        quota: { $ref: "#/components/schemas/QuotaShortage" }
    QuotaShortage:
      type: object
      description: Quota の不足（`quota_exceeded`）。`from` から `until`（無ければ無期限）の間、上限 `limit` に `count` 人がいる
      required: [from, limit, count, shortage]
      properties:
        from: { type: string, format: date-time }
        until: { type: string, format: date-time }
        limit: { type: integer, format: int64 }
        count: { type: integer, format: int64 }
        shortage: { type: integer, format: int64, description: 足りない人数 }
    OrgQuota:
      type: object
      required: [quota_key, count, grants]
      properties:
        quota_key: { type: string, enum: [members] }
        limit: { type: integer, format: int64, description: 今の上限（無ければ無制限） }
        count: { type: integer, format: int64, description: 今数えている人数 }
        grants:
          type: array
          items: { $ref: "#/components/schemas/QuotaGrant" }
    QuotaGrantInput:
      type: object
      required: [kind, quantity]
      properties:
        kind: { type: string, enum: [base, addon, override] }
        quantity: { type: integer, format: int64, minimum: 0 }
        starts_at: { type: string, format: date-time, description: 省けば今（変更では今の値） }
        ends_at: { type: string, format: date-time, description: 省けば無期限 }
        external_ref: { type: string, maxLength: 200, description: 外部（課金など）の付与の参照。同じものがあれば上書きする }
    QuotaGrant:
      type: object
      required: [id, quota_key, kind, quantity, starts_at, source, created_at, updated_at]
      properties:
        id: { type: string }
        quota_key: { type: string, enum: [members] }
        kind: { type: string, enum: [base, addon, override] }
        quantity: { type: integer, format: int64 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        source: { type: string, enum: [manual, external] }
        external_ref: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClaimedNotification:
      type: object
      required: [to, expires_at]
      properties:
        to: { type: string, description: 宛先のメールアドレス }
        code: { type: string, description: 確認コード }
        token: { type: string, description: マジックリンクのトークン（リンク先のアプリが verify に渡す） }
        expires_at: { type: string, format: date-time }
    LoginLink:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string, description: 1回限り。本人以外に渡さない }
        expires_at: { type: string, format: date-time }
    UserCredentials:
      type: object
      required: [passkeys, identities, totp]
      properties:
        passkeys:
          type: array
          items: { $ref: "#/components/schemas/UserPasskey" }
        identities:
          type: array
          items: { $ref: "#/components/schemas/UserIdentity" }
        totp:
          type: array
          items: { $ref: "#/components/schemas/UserTOTP" }
        password: { $ref: "#/components/schemas/UserPassword" }
    UserPasskey:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    UserIdentity:
      type: object
      required: [id, connection, created_at]
      properties:
        id: { type: string }
        connection: { type: string, description: connection の slug }
        created_at: { type: string, format: date-time }
    UserTOTP:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
    UserPassword:
      type: object
      description: 設定したパスワード（無ければ省略）
      required: [created_at]
      properties:
        created_at: { type: string, format: date-time }
    RevokedCredentials:
      type: object
      required: [passkeys, identities, totp, password, recovery_codes, sessions]
      properties:
        passkeys: { type: integer }
        identities: { type: integer }
        totp: { type: integer }
        password: { type: boolean }
        recovery_codes: { type: integer, description: 消した未使用のリカバリーコードの数 }
        sessions: { type: integer, description: 失効させたセッションの数 }
    Validity:
      type: object
      properties:
        valid_from: { type: string, format: date-time, nullable: true }
        valid_until: { type: string, format: date-time, nullable: true }
    UpdateUser:
      type: object
      properties:
        valid_from: { type: string, format: date-time, nullable: true }
        valid_until: { type: string, format: date-time, nullable: true }
    AdminUser:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [active, deleted, merged] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        deletion_scheduled_at: { type: string, format: date-time, description: 削除の予定（猶予期間の終わり） }
        legal_hold: { type: boolean }
    SuspendRequest:
      type: object
      required: [category, reason]
      properties:
        category: { type: string, description: "tos_violation / customer_request / security_risk / billing / realm で足したもの" }
        reason: { type: string, minLength: 1, maxLength: 1000, description: 内部向けの理由（監査ログに出し、本人には見せない） }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        external_ref: { type: string, maxLength: 200, description: 外部のシステム（課金など）の参照。冪等にする }
    LiftRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    Suspension:
      type: object
      required: [id, target_type, target_id, category, reason, starts_at, active, created_at]
      properties:
        id: { type: string }
        target_type: { type: string, enum: [user, org, membership, service_account] }
        target_id: { type: string, description: 対象の公開 ID }
        user_id: { type: string, description: ユーザーと Membership の停止で、本人の公開 ID }
        category: { type: string }
        reason: { type: string }
        external_ref: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        active: { type: boolean, description: 今停止中か }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        lifted_at: { type: string, format: date-time }
        lifted_by: { type: string }
    Suspensions:
      type: object
      required: [suspensions]
      properties:
        suspensions:
          type: array
          items: { $ref: "#/components/schemas/Suspension" }
    Role:
      type: object
      required: [id, name, permissions, builtin, assignable]
      properties:
        id: { type: string, description: 組み込みのロールは名前、独自のロールは公開 ID }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
        builtin: { type: boolean }
        assignable: { type: boolean, description: 付与の API で付与できるか（組み込みの Org のロールは org_role から効くので false） }
    Roles:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions:
          type: array
          maxItems: 100
          items: { type: string }
    RoleBinding:
      type: object
      required: [id, role, principal_type, principal_id, created_at]
      properties:
        id: { type: string }
        role: { type: string, description: 組み込みのロールの名前か、独自のロールの ID }
        principal_type: { type: string, description: user / group / service_account }
        principal_id: { type: string, description: 主体の公開 ID }
        resource_type: { type: string }
        resource_id: { type: string }
        created_at: { type: string, format: date-time }
    RoleBindings:
      type: object
      required: [bindings]
      properties:
        bindings:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }
    RoleBindingInput:
      type: object
      required: [role, principal_type, principal_id]
      properties:
        role: { type: string }
        principal_type: { type: string, description: user / group / service_account }
        principal_id: { type: string }
        resource_type: { type: string, maxLength: 64 }
        resource_id: { type: string, maxLength: 256 }
    Group:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Groups:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/Group" }
    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    GroupMember:
      type: object
      required: [principal_type, principal_id, created_at]
      properties:
        principal_type: { type: string, description: user }
        principal_id: { type: string, description: 主体の公開 ID }
        created_at: { type: string, format: date-time }
    GroupMembers:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
    GroupMemberInput:
      type: object
      required: [principal_type, principal_id]
      properties:
        principal_type: { type: string, description: user }
        principal_id: { type: string }
    CheckRequest:
      type: object
      required: [principal_id, action]
      properties:
        principal_type: { type: string, enum: [user], default: user }
        principal_id: { type: string, description: 主体の公開 ID }
        action: { type: string, minLength: 1, maxLength: 130, description: "`<リソース>:<操作>`" }
        org_id: { type: string, description: 判定の文脈の Org の公開 ID }
        resource_type: { type: string, maxLength: 64, description: "`org` なら `resource_id`（Org の公開 ID）が判定の文脈の Org になる。`org_id` と食い違えば `400`" }
        resource_id: { type: string, maxLength: 256 }
    CheckResult:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reasons:
          type: array
          items: { type: string }
          description: 主体が使えないときの理由のコード（4.9）
    ClientInput:
      type: object
      required: [name, redirect_uris, token_endpoint_auth_method]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string }
        post_logout_redirect_uris:
          type: array
          maxItems: 20
          items: { type: string }
        token_endpoint_auth_method: { type: string, enum: [client_secret, private_key_jwt, none] }
        jwks:
          type: object
          additionalProperties: true
          description: "`private_key_jwt` の公開鍵（JWKS）"
        id_token_signed_response_alg: { type: string, enum: [ES256, ML-DSA-65] }
        backchannel_logout_uri: { type: string }
    Client:
      type: object
      required: [client_id, name, redirect_uris, post_logout_redirect_uris, token_endpoint_auth_method, id_token_signed_response_alg, trust_level, created_at, updated_at]
      properties:
        client_id: { type: string }
        name: { type: string }
        trust_level: { type: string, enum: [first_party] }
        redirect_uris:
          type: array
          items: { type: string }
        post_logout_redirect_uris:
          type: array
          items: { type: string }
        token_endpoint_auth_method: { type: string }
        jwks:
          type: object
          additionalProperties: true
        id_token_signed_response_alg: { type: string }
        backchannel_logout_uri: { type: string }
        client_secret: { type: string, description: 作成と、認証方式を client_secret に変えたときだけ（1度だけ返す） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Clients:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items: { $ref: "#/components/schemas/Client" }
