      summary: ユーザーのカスタム属性の値を書く
      description: |
        権限 `attributes:write`。`attributes` の key の値を置き換え、`null` なら消す（ほかの key はそのまま）。知らない key は
        `400 unknown_attribute`、型・制約に合わない値は `400 invalid_attribute_value`（どれかが誤りなら何も書かない）。
        `user.attributes_updated`（key だけ。値は残さない）を監査ログに残す。
      parameters:
