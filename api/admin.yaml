  /v1/admin/authz:check:
    post:
      operationId: checkAuthz
      summary: 主体が操作をできるかを判定する（4.5、check）
      description: |
        権限 `authz:check`（連携先・サービスアカウント向け）。`check(principal, action, resource, context)` の API。
        連携先の権限（`docs.doc:read`）の判定には、その接頭辞の権限のカタログの `authz:check`（`resource_type: permission_catalog`、
        `resource_id` が接頭辞の付与）か realm 全体の `authz:check` が要り、IAM 自身の権限の判定には realm 全体の `authz:check` が要る
        （無ければ `403`。ADR 0121）。
        主体はユーザーかサービスアカウント（`principal_type`）の公開 ID。削除・停止中・有効期間の外の主体と、所属の Org が
        使えないサービスアカウントは `allowed: false`（`reasons` に理由のコード。削除は `inactive`）。
        Group の所属・Org の範囲・リソースの範囲の扱いはユーザーとサービスアカウントで同じ。
        サービスアカウントの認証の文脈は、そのアクセストークン（管理 API 向けか自前の API 向け）を `access_token` に渡せば
        その認証から組み立てる（`attested`。API キーは受けない）。`sid` と `context` はユーザーのときだけ使う。
        `org_id` を渡せば、その Org の範囲で判定する（Org の範囲の付与と org_role は、その Org の使える所属がある間だけ効く）。
        Org がオフの構成では `org_id` を無視して realm の範囲で判定する。`resource_type`・`resource_id` を渡せば、そのリソースを限った付与も効く。
        判定の材料は `session.validity_max_delay` の間キャッシュする（ロール・所属の変更の反映の遅れの上限）。
        主体か Org が無ければ `404`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckRequest" }
      responses:
        "200":
          description: 判定の結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/authz:batch-check:
    post:
      operationId: batchCheckAuthz
      summary: 同じ主体の判定をまとめて行う（4.5、batch check）
      description: |
        権限 `authz:check`。`/v1/admin/authz:check` と同じ判定を、主体・`org_id`・認証の文脈（`sid`・`access_token`・`context`）を
        共通にして `checks` の件数だけ行い、`results` を `checks` と同じ順に返す。判定の材料（付与・所属）は 1 回だけ読む。
        呼び出し元は、すべての項目について `/v1/admin/authz:check` と同じ権限が要る（1 つでも無ければ `403`）。
        `checks` の件数の上限は設定の `authz.batch_check_max`（既定 100。超えれば `400`）。`checks` の `resource_type` に `org` は
        使えない（判定の Org は `org_id` で決める。`400`）。主体が使えなければ、すべての結果が `allowed: false` で同じ `reasons`。
        主体か Org が無ければ `404`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchCheckRequest" }
      responses:
        "200":
          description: 判定の結果（`checks` と同じ順）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchCheckResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/clients:
    get:
      operationId: listClients
      summary: 連携先（OIDC のクライアント）の一覧（5.5）
      description: 権限 `clients:manage`。作成の順。秘密は返さない。
      responses:
        "200":
          description: 連携先
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clients" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

    post:
      operationId: createClient
      summary: 連携先を登録する（5.5、ADR 0026）
      description: |
        権限 `clients:manage`。ファーストパーティだけ（同意画面を出さない）。`redirect_uris` は https か loopback の http（フラグメントなし）。
        `token_endpoint_auth_method` が `client_secret` なら、応答の `client_secret` を1度だけ返す（保存するのはハッシュだけ）。
        `private_key_jwt` なら公開鍵だけの `jwks` が要る。`id_token_signed_response_alg` は `ES256`（既定）か `ML-DSA-65`（フィーチャー `rs256` なら `RS256` も）。
        内容が正しくなければ `400 invalid_client_metadata`。`client.created` を監査ログに残す。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/clients/{id}:
    get:
      operationId: getClient
      summary: 連携先を返す
      description: 権限 `clients:manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
