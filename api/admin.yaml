openapi: 3.0.3
info:
  title: IAM admin API
  version: v1
  description: |
    管理 API。公開 API とはポートを分ける（design.md 2.5）。

    認証：`Authorization: Bearer <トークン>`。サービスアカウントの API キーかアクセストークン（`POST /v1/admin/token`。ADR 0074）、
    運営者のセッションのトークン（design.md 4.11）。
    運営者のセッションでは、直近の認証（`security.session.max_auth_age` 以内）を求める。過ぎていれば
    `401 reauthentication_required`。権限は組み込みのロール（`realm:owner` など）で判定する。
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: ヘルスチェック
      security: []
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: 依存先（Storage など）に問題がある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/admin/notifications/{id}:claim:
    post:
      operationId: claimNotification
      summary: 通知の秘密と宛先を1回だけ取り出す
      description: |
        配信用のサービスアカウント（`notifications:claim`）だけが呼べる（design.md 2.4）。
        無い・期限切れ・取り出し済みは区別せず 404。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 取り出した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimedNotification" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users:
    get:
      operationId: listUsers
      summary: ユーザーの一覧・検索（ADR 0097）
      description: |
        権限 `users:read`。公開 ID の順に、`limit` 件ずつ返す。続きは `next_cursor` を `after` に渡す。絞り込みはすべて AND。
        `email` はブラインドインデックスで引く完全一致（正規化は小文字化だけ。部分一致はしない。9.5、ADR 0014）。
        `connection`（slug）と `subject` は外部 ID の完全一致で、両方を渡す（片方だけは `400 invalid_request`）。
        `status` の `active` は停止中でないもの、`suspended` は今停止中のもの（どちらも削除・統合されていない）。
        `org_id` は active な Membership のある Org。一覧にメールアドレスは含めない。無い Org・connection・アドレスを
        指したときは空の一覧。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: after, in: query, schema: { type: string } }
        - { name: email, in: query, schema: { type: string, maxLength: 254 } }
        - { name: connection, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, deleted, merged] } }
        - { name: org_id, in: query, schema: { type: string } }
        - { name: created_from, in: query, description: この時刻以後に作成, schema: { type: string, format: date-time } }
        - { name: created_before, in: query, description: この時刻より前に作成, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: 公開 ID の順
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUserSummary" }
                  next_cursor: { type: string, description: 続きがあるときだけ }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      summary: ユーザーを登録する（確認の経路 `admin`。4.1）
      description: |
        運営者が所有を確かめたメールアドレスで登録する。権限 `users:create`。
        アドレスが使われていれば `409 email_exists`（自動リンクしない。4.2）。
        realm の `verified_via` に `admin` が無ければ `400 verification_method_disabled`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id: { type: string, description: 公開のユーザー ID }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:login_link:
    post:
      operationId: issueLoginLink
      summary: 1回限りのログイン用リンクのトークンを発行する
      description: |
        権限 `users:login_link`。トークンは `POST /v1/login/link:redeem` に渡す（ホスト型ログイン画面ではリンクにする）。
        `id` は公開のユーザー ID。有効期間は既定 15 分、上限 24 時間。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: { type: integer, minimum: 1, maximum: 86400 }
      responses:
        "200":
          description: 発行した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginLink" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:recovery_link:
    post:
      operationId: issueRecoveryLink
      summary: 1回限りの復旧用リンクのトークンを発行する（4.12）
      description: |
        権限 `users:recover`。IAM の外で本人確認した後に使う（他の経路で戻れない人のため）。トークンは
        `POST /v1/recovery/link:redeem` に渡す。使うと復旧専用のセッションになる。`reason` は必須で、監査ログに出す。
        有効期間は既定 15 分、上限 24 時間。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
                ttl_seconds: { type: integer, minimum: 1, maximum: 86400 }
      responses:
        "200":
          description: 発行した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginLink" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/lockout:
    get:
      operationId: getUserLockout
      summary: ユーザーのアカウント単位のロックアウトの状態（フィーチャー account_lockout。ADR 0105）
      description: |
        権限 `credentials:revoke`。フィーチャーが動いていなければ 404。`login_id`（パスワードなどログイン ID で本人を決める
        1要素目）はユーザーのすべてのメールアドレスのうちいちばん厳しい状態を返す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 今の状態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserLockout" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:unlock:
    post:
      operationId: unlockUser
      summary: ユーザーのロック・待ち時間・失敗の回数を消す（フィーチャー account_lockout。ADR 0105）
      description: |
        権限 `credentials:revoke`。ユーザーのすべてのメールアドレスのパスワードと、2 要素目のコードの状態を消す。
        監査ログ `account.unlocked`。消す前の状態を返す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 消す前の状態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserLockout" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/credentials:
    get:
      operationId: listUserCredentials
      summary: ユーザーの有効な認証情報の一覧（無効化の対象を選ぶため）
      description: 権限 `credentials:revoke`。メールアドレスなどの個人情報は含めない。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 作成時刻の順
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCredentials" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/credentials/{credential_id}:revoke:
    post:
      operationId: revokeUserCredential
      summary: ユーザーの passkey・外部 ID の紐付け・TOTP を無効化する（4.6）
      description: |
        権限 `credentials:revoke`。`credential_id` は公開 ID（`idn_…`、`crd_…`）。本人と違い、最後の1つも
        無効化できる（以後は復旧の手順で戻る）。取り消せない。その認証情報で作ったセッションは、遅くとも
        `validity_max_delay` の後に使えなくなる。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: credential_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 無効化した }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/password:revoke:
    post:
      operationId: revokeUserPassword
      summary: ユーザーのパスワードを無効化する（フィーチャー password）
      description: |
        権限 `credentials:revoke`。再設定は復旧の手順で行う。ユーザーの全セッションを失効させる。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 無効化した }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/credentials:revoke-all:
    post:
      operationId: revokeAllUserCredentials
      summary: 侵害時の初動として、ユーザーの全認証情報と全セッションを無効化する（4.6）
      description: |
        権限 `credentials:revoke`。passkey・外部 ID の紐付け・TOTP・パスワード・リカバリーコードを無効化し、全セッションを失効させる。
        メールは残す（復旧の経路。4.12）。取り消せない。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 無効化した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokedCredentials" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:
    get:
      operationId: getUser
      summary: ユーザーの詳細（ADR 0097）
      description: |
        権限 `users:read`。状態・停止・有効期間・legal hold・削除の予定・メール・認証手段の概要・Membership を返す。
        メールアドレスは `include_pii=true` のときだけ復号して返し、権限 `pii:read` も要る（無ければ `403 permission_denied`）。
        復号したときは `user.pii_read` を監査ログに残す。最小化モード（`index_only`）ではアドレスを持たないので返さない。
        Membership はフィーチャー org が動いているときだけ返す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: include_pii, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: ユーザー
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateUser
      summary: ユーザーの有効期間を変更する（4.8）
      description: |
        権限 `users:update`。`valid_from`・`valid_until` の両方を置き換える（省略か null は制限なし）。期間の外では
        ログインできず、既存のセッションも境界の時刻ちょうどに使えなくなる。境界の時刻に `user.validity_started`・
        `user.validity_ended` を監査ログに出す（判定はこの処理の遅れに左右されない）。最後の使える `realm:owner` に
        終わりか未来の始まりを付けるのは `409 last_owner`（先に別のユーザーに付与する）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200":
          description: 変更した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:delete:
    post:
      operationId: deleteUser
      summary: ユーザーを削除する（4.10）
      description: |
        権限 `users:delete`。既定は realm の `user_deletion_grace` の後に消す（その間は取り消せる）。`immediate` なら今消す
        （`legal_hold` が立っていれば予約にする）。共有 Org の最後のオーナーと、realm の最後の `realm:owner` の間は `409 last_owner`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                immediate: { type: boolean, default: false }
      responses:
        "200":
          description: 削除を予約した（か、削除した）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:cancel-deletion:
    post:
      operationId: cancelUserDeletion
      summary: ユーザーの削除の予定を取り消す
      description: 権限 `users:delete`。予定が無ければ `409 deletion_not_scheduled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 取り消した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:legal-hold:
    post:
      operationId: setUserLegalHold
      summary: ユーザーの消去を保留する・保留を解く（4.10）
      description: |
        権限 `users:legal_hold`。保留の間は猶予期間が終わっても消さない（`user.deletion_held` を残す）。保留を解いたときに
        猶予が終わっていれば、次の回に消す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold]
              properties:
                hold: { type: boolean }
      responses:
        "200":
          description: 変更した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/suspensions:
    post:
      operationId: suspendUser
      summary: ユーザーを停止する（4.7）
      description: |
        権限は種別ごと（`suspensions:<category>`。realm で足した種別は `realm:owner` だけ）。`starts_at` を省略か過去なら
        今から、未来なら予約。`ends_at` を省略で無期限。重ねられ、1つでも有効なら停止中。停止中はログインできず、
        既存のセッションも使えない（遅くとも `validity_max_delay` の後。予約は開始の時刻ちょうど）。本人には
        `suspended.<category>` だけを返し、`reason` は見せない。`external_ref` が同じ停止（対象と種別も同じ）が
        あれば、新しく作らず 200 でそれを返す。最後の使える `realm:owner` は止められない（予約も。`409 last_owner`）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuspendRequest" }
      responses:
        "200":
          description: 同じ external_ref の停止が既にある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "201":
          description: 停止した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listUserSuspensions
      summary: ユーザーの停止の一覧（解除・終了したものも含む）
      description: 権限 `suspensions:read`。開始の時刻の順。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspensions" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/suspensions/{id}:lift:
    post:
      operationId: liftSuspension
      summary: 停止を解除する
      description: |
        権限は停止と同じ種別ごと。本人は自分の停止を解除できない。既に解除・終了していれば何もせず 200。
        停止をまたいだセッション（停止の前に認証したもの）は戻らない（再ログインが要る）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiftRequest" }
      responses:
        "200":
          description: 解除した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/sessions/{id}:revoke:
    post:
      operationId: revokeSession
      summary: セッションを失効させる
      description: 権限 `sessions:revoke`。既に失効していても 204。反映は `validity_max_delay` 以内（5.3）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 失効した }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/sessions/{id}:risk:
    post:
      operationId: setSessionRisk
      summary: セッションのリスクの点数を更新する（ADR 0084）
      description: |
        評価器の認証情報（権限 `risk:write` を持つサービスアカウント）だけが呼べる。人のセッションやアクセストークンは
        `risk:write` を持っても `403 forbidden`。自分のセッションは更新できない（`403 forbidden`）。セッションのログインの系列
        （入れ替えの後の新しいセッションを含む）の、終わっていないセッションを更新する。`risk` の値が null の種類は
        「評価していない」に戻す。一覧に無い・止めた種類や 0〜100 の外の点数は `400 invalid_risk`。反映は
        `validity_max_delay` 以内。更新したセッションごとに `session.risk_updated` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskUpdate" }
      responses:
        "200":
          description: 更新した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskUpdated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:risk:
    post:
      operationId: setUserRisk
      summary: ユーザーのすべてのセッションのリスクの点数を更新する（ADR 0084）
      description: |
        `setSessionRisk` と同じ規則で、ユーザーの終わっていないすべてのセッションを更新する。セッションが無くても 200
        （`sessions` は 0）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskUpdate" }
      responses:
        "200":
          description: 更新した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskUpdated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/risk-types:
    get:
      operationId: listRiskTypes
      summary: realm のリスクの種類の一覧（ADR 0084）
      description: |
        権限 `risk_types:manage`。名前の順。組み込みの種類（`ip`・`device`・`account`）は変えていなくても載る（有効、既定の境界）。
      responses:
        "200":
          description: 名前の順
          content:
            application/json:
              schema:
                type: object
                required: [risk_types]
                properties:
                  risk_types:
                    type: array
                    items: { $ref: "#/components/schemas/RiskType" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/risk-types/{name}:
    put:
      operationId: putRiskType
      summary: リスクの種類を一覧に載せる・変える（ADR 0084）
      description: |
        権限 `risk_types:manage`。`name` は組み込みの種類か `<名前空間>.<名前>`（各部が `[a-z0-9_]{1,32}`）。外れれば
        `400 invalid_risk_type`。`band` は段階の境界（1 ≦ `medium` < `high` ≦ 100。省けば今の値、新しい種類なら既定の 30・70）。
        外れれば `400 invalid_band`。止めた種類の点数はセッションから捨てる（判定に使わない）。種類の数には上限を置かない。
        変わったときだけ `realm.risk_types_changed` を監査ログに残す。
        止める（`enabled: false`）のは、その種類を見る条件（付与の条件・名前空間の設定・Org の要件）が無いときだけ。残っていれば
        `409 risk_type_in_use`（`message` に見ている付与の数・名前空間・Org の数）。先に条件を外してから止める。
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskTypeInput" }
      responses:
        "200":
          description: 載せた・変えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskType" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/action-namespaces/{name}:
    get:
      operationId: getActionNamespace
      summary: 操作の名前空間の設定（要件と段階の境界。ADR 0084）
      description: |
        権限 `requirements:manage`（realm 全体か、`resource_type = action_namespace`・`resource_id = <name>` の付与）。
        設定していない名前空間は空の設定を返す（`updated_at` が無い）。
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 名前空間の設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionNamespace" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: putActionNamespace
      summary: 操作の名前空間の設定を置き換える（ADR 0084）
      description: |
        権限は GET と同じ。`name` は `[a-z][a-z0-9_.-]{0,63}`（外れれば `400 invalid_namespace`）。全体の置き換え。
        `requirements` は操作（この名前空間のもの。ワイルドカード `shop.payment:*` 可）→ 条件（RoleBindingInput の `condition` と
        同じ言語）。最大 64 件。操作が外れれば `400 invalid_requirement`、条件が外れれば `400 invalid_condition`。
        要件は、どの付与で許されたかに関係なくその操作に求め、`attested` を暗黙に AND する。同じ操作に当たる要件はすべて AND する。
        `bands` はリスクの種類 → 段階の境界で、この名前空間の判定（付与の条件と要件の `risk_at_most`）に使う。realm の境界より
        緩められない（`medium`・`high` とも realm 以下）。一覧で有効な種類だけ。外れれば `400 invalid_band`。
        変えた後の設定で、呼び出し側がこの操作（`requirements:manage`）を続けられなくなるなら `409 requirement_lockout`。
        変わったときだけ `authz.requirement_updated` を監査ログに残す。
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionNamespaceInput" }
      responses:
        "200":
          description: 置き換えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionNamespace" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/connections:
    get:
      operationId: listConnections
      summary: IdP 接続の一覧（ADR 0097）
      description: |
        権限 `connections:read`。slug の順。Org 専用 SSO の connection（`owner_org_id` がある）も含む。
        クライアントシークレットは返さない。`active_identities` はその connection の有効な外部 ID の数。
      responses:
        "200":
          description: slug の順
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/AdminConnection" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createConnection
      summary: IdP 接続（OAuth / OIDC）を登録する
      description: |
        権限 `connections:manage`。プリセット（`google`）にクライアント ID・シークレット・戻り先の許可リストを足す。
        シークレットは封をして保存し、応答にも監査ログにも出さない。`slug` は公開 API のパスに使う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, preset, client_id, client_secret, redirect_uris]
              properties:
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
                preset: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
                redirect_uris:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema:
                type: object
                required: [id, slug]
                properties:
                  id: { type: string }
                  slug: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/connections:ldap:
    post:
      operationId: createLDAPConnection
      summary: IdP 接続（LDAP / Active Directory）を登録する（ADR 0102）
      description: |
        権限 `connections:manage`。フィーチャー `ldap` が動いていなければ `404 ldap_disabled`。`url` は `ldaps://` か `ldap://`
        （StartTLS を必ず掛ける。平文では話さない）。サーバーの証明書はホスト名と `ca_pem`（無ければ OS の既定）で確かめ、`pins` があれば
        連なりの中に一致を求める。サービスアカウントのパスワードは封をして保存し、応答にも監査ログにも出さない。
        `trust_email` ならディレクトリのメールを確認済みとみなし、未登録の人を登録する（無ければ連携だけに使える）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLDAPConnectionInput" }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/connections/{id}:update-ldap:
    post:
      operationId: updateLDAPConnection
      summary: LDAP の connection のサービスアカウントのパスワード・証明書の確かめ方・同期の設定を変える（ADR 0102）
      description: |
        権限 `connections:manage`。省いた項目は今の値のまま。Org 専用 SSO の connection は `409 connection_owned`。
        監査ログには変えた項目の名前だけを残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bind_password: { type: string, maxLength: 1024, format: password }
                ca_pem: { type: string, maxLength: 65536 }
                pins:
                  type: array
                  maxItems: 10
                  items: { type: string }
                sync: { $ref: "#/components/schemas/LDAPSync" }
      responses:
        "200":
          description: 変えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/connections/{id}:sync:
    post:
      operationId: syncLDAPConnection
      summary: LDAP の connection の同期をすぐに 1 回行う（ADR 0102）
      description: |
        権限 `connections:manage`。定期的な同期と同じ処理（ユーザーの停止・解除、事前の登録、Group の所属）を、要求の中で行って件数を返す。
        同じ connection の同期が動いていれば `409 sync_running`、ディレクトリにつながらなければ `503 directory_unavailable`。
        Org 専用 SSO の connection にも使える。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 同期した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPSyncResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/admin/connections:saml:
    post:
      operationId: createSAMLConnection
      summary: IdP 接続（SAML 2.0）を登録する（ADR 0098）
      description: |
        権限 `connections:manage`。フィーチャー `saml` が動いていなければ `404 saml_disabled`。IdP のメタデータを XML か URL で渡す
        （URL は https に限り、公開のアドレスに限って登録のときに一度だけ取得する。内部の IdP は XML で渡す）。
        IdP には応答の `sp_entity_id`・`acs_url` か、SP のメタデータ（`sp_entity_id` の URL）を登録する。
        `trust_email` なら IdP が返すメールを確認済みとみなし、未登録の人を登録する（無ければ登録には使わず、連携だけに使える）。
        SP の署名鍵は封をして保存し、応答にも監査ログにも出さない。`server.public_url` が無ければ `400 public_url_required`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
                metadata_xml: { type: string, maxLength: 1048576 }
                metadata_url: { type: string, maxLength: 2048 }
                entity_id: { type: string, maxLength: 1024, description: メタデータに IdP が複数あるときに選ぶ }
                sign_requests: { type: boolean }
                name_id_format: { type: string, maxLength: 256 }
                email_attribute: { type: string, maxLength: 256 }
                trust_email: { type: boolean }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema:
                type: object
                required: [id, slug, idp_entity_id, sp_entity_id, acs_url]
                properties:
                  id: { type: string }
                  slug: { type: string }
                  idp_entity_id: { type: string }
                  sp_entity_id: { type: string, description: SP の Entity ID。SP のメタデータの URL でもある }
                  acs_url: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs:
    get:
      operationId: listOrgs
      summary: Org の一覧・検索（ADR 0097）
      description: |
        権限 `orgs:read`。公開 ID の順に、`limit` 件ずつ返す。続きは `next_cursor` を `after` に渡す。絞り込みはすべて AND。
        `name_prefix` は名前の前方一致（名前は平文で持つので、正規化せずにバイトで比べる。大文字と小文字は区別する）。
        `parent_id` は親の Org。`status` の `active` は削除も停止もされていないもの、`suspended` は今停止中のもの（削除済みを
        除く）、`deleted` は削除済み。無い親を指したときは空の一覧。フィーチャー org が動いていなければ `404 org_disabled`。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: after, in: query, schema: { type: string } }
        - { name: name_prefix, in: query, schema: { type: string, minLength: 1, maxLength: 400 } }
        - { name: parent_id, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [personal, shared] } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, deleted] } }
      responses:
        "200":
          description: 公開 ID の順
          content:
            application/json:
              schema:
                type: object
                required: [orgs]
                properties:
                  orgs:
                    type: array
                    items: { $ref: "#/components/schemas/Org" }
                  next_cursor: { type: string, description: 続きがあるときだけ }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createOrg
      summary: 共有 Org を作り、ユーザーを owner にする（運営者。realm の `org_creation` に関わらず作れる。4.11）
      description: 権限 `orgs:create`。フィーチャー org が動いていなければ `404 org_disabled`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner_id]
              properties:
                name: { type: string, maxLength: 400 }
                owner_id: { type: string, description: 公開のユーザー ID }
      responses:
        "201":
          description: 作った
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}:
    patch:
      operationId: updateOrg
      summary: Orgの有効期間を変更する（4.8）
      description: |
        権限 `orgs:update`。`valid_from`・`valid_until` の両方を置き換える（省略か null は制限なし）。期間の外か停止中の Org にはメンバーが入れず、その Org を active にしているセッションは Org の操作ができない（個人 Org への切り替えはできる）。
        境界の時刻に `org.validity_started`・`org.validity_ended` を監査ログに出す。個人 Org（とその Membership）は
        `409 personal_org`。フィーチャー org が動いていなければ `404 org_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Validity" }
      responses:
        "200":
          description: 変更した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: getOrg
      summary: Org を返す
      description: 権限 `orgs:read`。フィーチャー org が動いていなければ `404 org_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Org
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/settings:
    get:
      operationId: getOrgSettings
      summary: Org の段のセキュリティ設定を返す（2.8）
      description: 権限 `orgs:read`。`settings` は Org が設定した値（省いた項目は realm に従う）、`effective` は効く値。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettingsView" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putOrgSettings
      summary: Org の段のセキュリティ設定を置き換える（2.8、5.4、10章）
      description: |
        権限 `orgs:update`。省いた項目は realm に従う。寿命はホスト先が決める範囲の内で、realm より厳しくする向きにだけ変えられる
        （ホスト先が `org_may_relax` を許した項目は緩められる）。警告のアクションは realm より厳しくする向きのみ。外れれば `400 setting_invalid`。
        寿命は認証の時刻から数え、超えたセッションは使えなくなる（既存のセッションにも `validity_max_delay` の内に効く）。
        寿命を超えたセッションでこの Org に切り替えると `401 reauthentication_required`。
        deny にした警告に当たるセッションはこの Org に入れない（`warning_denied.<code>`。ログインは個人 Org などで成功する）。
        変更は `org.settings_changed` として監査ログに残す。個人 Org は `409 personal_org`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSettings" }
      responses:
        "200":
          description: 置き換えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettingsView" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/domains:
    get:
      operationId: adminListOrgDomains
      summary: Org のドメインの一覧（11.3、ADR 0075）
      description: 権限 `orgs:update`（TXT の値を含むため）。フィーチャー `org_managed_users` が動いていなければ `404 org_managed_users_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 登録の順
          content:
            application/json:
              schema:
                type: object
                required: [domains]
                properties:
                  domains:
                    type: array
                    items: { $ref: "#/components/schemas/OrgDomain" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: adminAddOrgDomain
      summary: Org にドメインを登録する（11.3、ADR 0075）
      description: |
        権限 `orgs:update`。公開 API の `addOrgDomain` と同じ。個人 Org は `409 personal_org`、登録済みは `409 domain_exists`、
        realm の別の Org が証明済みなら `409 domain_taken`、上限（20）は `409 domain_limit`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, maxLength: 254 }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDomain" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/domains/{domain_id}:verify:
    post:
      operationId: adminVerifyOrgDomain
      summary: ドメインの TXT を確かめ、証明済みにする（11.3）
      description: |
        権限 `orgs:update`。TXT が無ければ `409 domain_not_verified`（確かめた時刻は残る）。realm の別の Org が先に証明していれば
        `409 domain_taken`。証明済みなら何もしない。DNS の障害は `503 dns_unavailable`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: domain_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 証明済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDomain" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/domains/{domain_id}:delete:
    post:
      operationId: adminDeleteOrgDomain
      summary: ドメインを消す（11.3）
      description: 権限 `orgs:update`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: domain_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 消した }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/quota:
    get:
      operationId: getOrgQuota
      summary: Org の Quota（今の上限と人数、付与の一覧）を返す（11.14）
      description: |
        権限 `orgs:read`。フィーチャー `quota` が必要（無ければ `404 quota_disabled`）。`limit` が無ければ無制限。
        数えるのは active な Membership と、realm の `quota_count` で選んだもの（招待中・将来有効・停止中）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Quota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgQuota" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/quota/grants:
    post:
      operationId: createOrgQuotaGrant
      summary: Quota の付与を登録する（11.14）
      description: |
        権限 `orgs:update`。上限は期間つきの付与の合算で、時刻 t の上限 = 有効な `override`（新しいもの）、無ければ有効な `base`（新しいもの）+ Σ `addon`。
        有効な付与が無ければ無制限。`external_ref` を付けると外部（課金など）の付与で、同じ `external_ref` があれば上書きする（`200`）。
        手動の付与で既存の人数（予約を含む）が上限を超える時点ができれば `409 quota_exceeded`（`quota` に不足する期間と人数）。
        外部の付与は拒否せず、超えれば `org.quota.exceeded` を監査ログに残す（既存のメンバーは外さず、新規を止める）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaGrantInput" }
      responses:
        "200":
          description: 外部の付与を上書きした
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaGrant" }
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaGrant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/quota/grants/{grant_id}:
    put:
      operationId: updateOrgQuotaGrant
      summary: 手動の Quota の付与を変える（11.14）
      description: |
        権限 `orgs:update`。外部の付与は `409 quota_grant_external`（`external_ref` で上書きする）。`external_ref` は無視する。
        既存の人数が上限を超える時点ができれば `409 quota_exceeded`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaGrantInput" }
      responses:
        "200":
          description: 変えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaGrant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrgQuotaGrant
      summary: Quota の付与を消す（11.14）
      description: 権限 `orgs:update`。手動の付与で既存の人数が上限を超える時点ができれば `409 quota_exceeded`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 消した }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}:delete:
    post:
      operationId: deleteOrg
      summary: 共有 Org を削除する（4.10）
      description: |
        権限 `orgs:delete`。既定は realm の `org_deletion_grace` の後に削除する（その間は取り消せる）。`immediate` なら今削除する。
        個人 Org はユーザーと一緒に消すので `409 personal_org`。フィーチャー org が動いていなければ `404 org_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                immediate: { type: boolean, default: false }
      responses:
        "200":
          description: 削除を予約した（か、削除した）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}:set-parent:
    post:
      operationId: setOrgParent
      summary: Org の親を設定する・外す（Org 階層。11.4、ADR 0078）
      description: |
        権限 `orgs:update`。`parent_id` を省略か null にすると親を外す。親の Org の付与と org_role が、子孫の Org の範囲の
        判定に効く（親の使える所属を持つ間、子の Org が使えるとき）。個人 Org は `409 personal_org`、削除した Org は
        `409 org_deleted`、循環は `409 hierarchy_cycle`、段数（根を含めて 5）を超えるなら `409 hierarchy_too_deep`。
        `parent_id` の Org が無ければ `400 parent_not_found`。
        フィーチャー org_hierarchy が動いていなければ `404 hierarchy_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id: { type: string, nullable: true, description: 親の公開の Org ID }
      responses:
        "200":
          description: 設定した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/children:
    get:
      operationId: listOrgChildren
      summary: 子の Org の一覧（Org 階層）
      description: 権限 `orgs:read`。フィーチャー org_hierarchy が動いていなければ `404 hierarchy_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: ID の順
          content:
            application/json:
              schema:
                type: object
                required: [orgs]
                properties:
                  orgs:
                    type: array
                    items: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}:cancel-deletion:
    post:
      operationId: cancelOrgDeletion
      summary: Org の削除の予定を取り消す
      description: 権限 `orgs:delete`。予定が無ければ `409 deletion_not_scheduled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 取り消した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/memberships:
    get:
      operationId: listOrgMemberships
      summary: Org の Membership の一覧（終了したものも含む）
      description: 権限 `orgs:read`。Membership の公開 ID の順に、`limit` 件ずつ返す。続きは `next_cursor` を `after` に渡す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: after, in: query, schema: { type: string } }
      responses:
        "200":
          description: Membership の公開 ID の順
          content:
            application/json:
              schema:
                type: object
                required: [memberships]
                properties:
                  memberships:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
                  next_cursor: { type: string, description: 続きがあるときだけ }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/suspensions:
    post:
      operationId: suspendOrg
      summary: Orgを停止する（4.7）
      description: |
        権限と `external_ref` の扱いはユーザーの停止と同じ。期間の外か停止中の Org にはメンバーが入れず、その Org を active にしているセッションは Org の操作ができない（個人 Org への切り替えはできる）。停止を解除すれば戻る（ユーザーの停止と違い、
        セッションは失効させない）。個人 Org（とその Membership）は止められない（`409 personal_org`）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuspendRequest" }
      responses:
        "200":
          description: 同じ external_ref の停止が既にある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "201":
          description: 停止した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listOrgSuspensions
      summary: Orgの停止の一覧（解除・終了したものも含む）
      description: 権限 `suspensions:read`。開始の時刻の順。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspensions" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/memberships/{id}:
    patch:
      operationId: updateMembership
      summary: Membershipの有効期間を変更する（4.8）
      description: |
        権限 `orgs:update`。`valid_from`・`valid_until` の両方を置き換える（省略か null は制限なし）。期間の外か停止中の Membership の本人は、その Org にだけ入れない。
        境界の時刻に `membership.validity_started`・`membership.validity_ended` を監査ログに出す。個人 Org（とその Membership）は
        `409 personal_org`。フィーチャー org が動いていなければ `404 org_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Validity" }
      responses:
        "200":
          description: 変更した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/memberships/{id}/suspensions:
    post:
      operationId: suspendMembership
      summary: Membershipを停止する（4.7）
      description: |
        権限と `external_ref` の扱いはユーザーの停止と同じ。期間の外か停止中の Membership の本人は、その Org にだけ入れない。停止を解除すれば戻る（ユーザーの停止と違い、
        セッションは失効させない）。個人 Org（とその Membership）は止められない（`409 personal_org`）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuspendRequest" }
      responses:
        "200":
          description: 同じ external_ref の停止が既にある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "201":
          description: 停止した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listMembershipSuspensions
      summary: Membershipの停止の一覧（解除・終了したものも含む）
      description: 権限 `suspensions:read`。開始の時刻の順。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspensions" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/roles:
    get:
      operationId: listRoles
      summary: realm の範囲で使えるロールの一覧（4.11）
      description: |
        権限 `roles:manage`。付与できる組み込みのロール（運営者ロール）と、独自のロールを返す。
        システムのロールは含めない。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roles" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createRole
      summary: 独自のロールを作る（4.11）
      description: |
        権限 `roles:manage`。渡す IAM 自身の権限（`users:`・`orgs:` など）はすべて自分が realm の範囲で持っていなければならない（`403 permission_denied`）。連携先の権限（`docs.doc:read` など）は、権限のカタログにあるもの（とカタログにあるリソースの `*`）だけを入れられ（`400 unknown_permission`）、持っていなくても渡せる。形がどちらの空間でもなければ `400 invalid_permission`（ADR 0121）。
        名前に組み込みの名前空間（`realm:`・`org:`・`system:`）は使えない（`400 invalid_name`）。権限の形は `<リソース>:<操作>`（`400 invalid_permission`）。
        名前の重複は `409 role_exists`。`role.created` を監査ログに残す。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/roles/{role_id}:
    put:
      operationId: updateRole
      summary: 独自のロールの名前と権限を置き換える
      description: |
        権限 `roles:manage`。今と新しい IAM 自身の権限をすべて自分が持っていなければならない。`role.updated` を監査ログに残す。
      parameters:
        - { name: role_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/roles/{role_id}:delete:
    post:
      operationId: deleteRole
      summary: 独自のロールと、その付与を消す
      description: |
        権限 `roles:manage`。ロールの IAM 自身の権限をすべて自分が持っていなければならない。`role.deleted` を監査ログに残す。
      parameters:
        - { name: role_id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 成功
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/role-bindings:
    get:
      operationId: listRoleBindings
      summary: realm の範囲のロールの付与の一覧
      description: |
        権限 `roles:manage`。作成の順。
      responses:
        "200":
          description: 成功
          content:
            application/json:
