    post:
      operationId: revokeServiceAccountCredential
      summary: 認証情報を無効化する
      description: |
        権限 `service_accounts:manage`。その認証情報で発行したアクセストークンも使えなくなる。`service_account.credential_revoked` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: credential_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 無効化した（無効化済みならそのまま）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccountCredential" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/service-accounts/{id}/suspensions:
    post:
      operationId: suspendServiceAccount
      summary: サービスアカウントを停止する（4.7）
      description: |
        権限と `external_ref` の扱いはユーザーの停止と同じ。停止中は認証できない（発行済みのアクセストークンも）。解除すれば戻る。
      parameters:
