      description: |
        権限 `clients:manage`。認証方式を `client_secret` に変えたときだけ、新しい `client_secret` を返す。`client.updated` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
