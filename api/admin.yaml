  /v1/admin/event-subscriptions/{id}:test:
    post:
      operationId: testEventSubscription
      summary: 購読の宛先にテストのイベントを1件送る
      description: |
        権限 `event_subscriptions:manage`。種類 `event_subscription.test` のイベント（監査ログには載らない）を、本番と同じ署名で送り、
        結果を返す（`delivered`、`status`、送れなければ `error`：`address_not_allowed`・`timeout`・`connection_failed`）。
        購読ごとに 1 分に 5 回まで（`429 rate_limited`）。`event_subscription.tested` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 送った結果
          content:
            application/json:
              schema:
                type: object
                required: [delivered]
                properties:
                  delivered: { type: boolean }
