  /v1/admin/workload-identity/providers:
    get:
      operationId: listWorkloadIdentityProviders
      summary: Workload Identity Federation の発行者の一覧（ADR 0116）
      description: |
        権限 `service_accounts:manage`。作成の順。フィーチャー `workload_identity` が動いていなければ `404 workload_identity_disabled`。
      responses:
        "200":
          description: 作成の順
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadIdentityProviders" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkloadIdentityProvider
      summary: 外部の JWT の発行者を登録する
      description: |
        権限 `service_accounts:manage`。`issuer` は https の絶対 URL（クエリ・フラグメント・利用者情報なし。JWT の `iss` と完全一致で比べる。
        realm の中で一意。重複は `409 issuer_exists`）。`audiences` は 1〜10 個（JWT の `aud` がどれかを含むこと）。
        鍵は `jwks`（固定の JWKS。公開鍵だけ）か `jwks_uri`（https）のどちらか。どちらも無ければ `issuer` の
        `/.well-known/openid-configuration` の `jwks_uri` を、公開のアドレスに限って取得する（1 時間キャッシュする）。
        `algorithms` は RS256・RS384・RS512・PS256・PS384・PS512・ES256・ES384・ES512・EdDSA から（既定は RS256 と ES256）。
        `max_token_lifetime` は 60〜86400 秒（既定 3600）。入力の誤りは `400 invalid_provider`。
        `workload_identity.provider.created` を監査ログに残す。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadIdentityProviderInput" }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadIdentityProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/workload-identity/providers/{id}:
    get:
      operationId: getWorkloadIdentityProvider
      summary: 発行者を返す
      description: 権限 `service_accounts:manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 発行者
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadIdentityProvider" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateWorkloadIdentityProvider
      summary: 発行者を置き換える
      description: |
        権限 `service_accounts:manage` と、結び付け先のサービスアカウントすべてのロールの権限を持つこと（足りなければ 403）。
        省いた項目は既定に戻る。`disabled` にすると交換を受けず、この発行者で発行したトークンも
        次の検証から使えない。`workload_identity.provider.updated` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadIdentityProviderInput" }
      responses:
        "200":
          description: 置き換えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadIdentityProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/workload-identity/providers/{id}:delete:
    post:
      operationId: deleteWorkloadIdentityProvider
      summary: 発行者を消す
      description: |
        権限 `service_accounts:manage` と、結び付け先のサービスアカウントすべてのロールの権限を持つこと（足りなければ 403）。
        結び付けも消え、発行済みのトークンは次の検証から使えない。
        `workload_identity.provider.deleted` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 消した
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/workload-identity/providers/{id}/bindings:
    get:
      operationId: listWorkloadIdentityBindings
      summary: 発行者の結び付けの一覧
      description: 権限 `service_accounts:manage`。作成の順。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 作成の順
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadIdentityBindings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkloadIdentityBinding
      summary: 条件を満たす外部の主体をサービスアカウントに結び付ける
      description: |
        権限 `service_accounts:manage` と、サービスアカウントのロールの権限をすべて持つこと（認証情報の追加と同じ。足りなければ 403）。
        `conditions` は 1〜20 個の AND。1 つの条件は `claim`（JSON Pointer。`/repository`、`/kubernetes.io/namespace`）と、
        `equals`（文字列）・`in`（文字列の一覧。1〜50 個）・`prefix`（空でない文字列）のちょうど 1 つ。クレームの値が文字列のときだけ比べる
        （大文字・小文字を区別する完全一致）。誤りは `400 invalid_conditions`。発行者ごとに 100 個まで（`409 too_many_bindings`）。
        削除したサービスアカウントは `409 service_account_deleted`。`workload_identity.binding.created` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadIdentityBindingInput" }
      responses:
        "201":
          description: 結び付けた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadIdentityBinding" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/workload-identity/providers/{id}/bindings/{binding_id}:delete:
    post:
      operationId: deleteWorkloadIdentityBinding
      summary: 結び付けを消す
      description: |
        権限 `service_accounts:manage` と、結び付け先のサービスアカウントのロールの権限をすべて持つこと（足りなければ 403）。
        この結び付けで発行したトークンは次の検証から使えない。
        `workload_identity.binding.deleted` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: binding_id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 消した
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/vci/credential-configurations:
    get:
      operationId: listVCICredentialConfigurations
      summary: OpenID4VCI の資格情報の定義の一覧（iam が発行者。ADR 0119）
      description: 権限 `clients:manage`。作成の順。フィーチャー `openid4vci` が動いていなければ `404 openid4vci_disabled`。
      responses:
        "200":
          description: 定義
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VCICredentialConfigurations" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createVCICredentialConfiguration
      summary: OpenID4VCI の資格情報の定義を登録する（ADR 0119）
      description: |
        権限 `clients:manage`。`configuration_id` は発行者のメタデータの `credential_configurations_supported` のキー（realm の中で一意。
        英数字と `._:-`、128 文字まで）。`format` は `dc+sd-jwt` だけ（ほかは `400 unsupported_format`）。`scope` は Authorization Code Flow
        で要求するスコープ（任意。realm の中で一意。OIDC のスコープの名前は使えない）。`claims` は本人のデータからクレーム（最上位）への対応で、
        `source` は `user_id`・`email`・`email_verified`・`attribute:<key>`・`const`（`value` に JSON の値）。`selectively_disclosable` の既定は真。
        `mandatory` の値が無い本人には発行しない。`validity` は秒（既定 90 日、1 時間〜5 年）。内容が正しくなければ
        `400 invalid_credential_configuration`、`configuration_id` が重複すれば `409 configuration_exists`、`scope` が重複すれば `409 scope_exists`。
        `vci.configuration_created` を監査ログに残す。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VCICredentialConfigurationInput" }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VCICredentialConfiguration" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/vci/credential-configurations/{id}:
    get:
      operationId: getVCICredentialConfiguration
      summary: OpenID4VCI の資格情報の定義を返す
      description: 権限 `clients:manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 定義
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VCICredentialConfiguration" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateVCICredentialConfiguration
      summary: OpenID4VCI の資格情報の定義を置き換える
      description: |
        権限 `clients:manage`。省いた項目は既定に戻る。発行済みの資格情報は変わらない（次の発行から効く）。
        `vci.configuration_updated` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VCICredentialConfigurationInput" }
      responses:
        "200":
          description: 置き換えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VCICredentialConfiguration" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/vci/credential-configurations/{id}:delete:
    post:
      operationId: deleteVCICredentialConfiguration
      summary: OpenID4VCI の資格情報の定義を消す
      description: |
        権限 `clients:manage`。発行済みの資格情報は失効させない（失効は `POST /v1/admin/vci/credentials/{id}:revoke`）。
        `vci.configuration_deleted` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 消した
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/vci/credentials:
    get:
      operationId: listVCICredentials
      summary: ユーザーに発行した Verifiable Credential の記録の一覧（ADR 0119）
      description: |
        権限 `credentials:revoke`。`user_id` は公開のユーザー ID。発行の新しい順。期限の過ぎた記録は消えていることがある。
        クレームの値は持たない。フィーチャー `openid4vci` が動いていなければ `404 openid4vci_disabled`。
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: 記録
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VCIIssuedCredentials" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/vci/credentials/{id}:revoke:
    post:
      operationId: revokeVCICredential
      summary: 発行した Verifiable Credential を失効させる（Token Status List）
      description: |
        権限 `credentials:revoke`。status list の値を 1（INVALID）にする。元には戻せない。失効済みなら何もしない。
        `vci.credential_revoked` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 失効させた
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/ssf/transmitters:
    get:
      operationId: listSSFTransmitters
      summary: SSF の受信側が信頼する送信側の一覧（ADR 0118）
      description: 権限 `ssf:manage`。作成の順。フィーチャー `ssf_receiver` が動いていなければ `404 ssf_receiver_disabled`。
      responses:
        "200":
          description: 送信側
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSFTransmitters" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSSFTransmitter
      summary: SSF の送信側を登録する（ADR 0118）
      description: |
        権限 `ssf:manage`。送信側は SET（RFC 8417）を `push_endpoint`（RFC 8935）に POST する。署名は `jwks_uri`（https。公開のアドレスに限る）か
        `jwks`（公開鍵だけ）で確かめ、`iss` は `issuer` と完全一致、`aud` は `audience` のどれかと一致、`jti` は1度だけ動かす。
        送信側は `Authorization: Bearer <push_token>` を付ける（`push_token` はこの応答と作り直しの応答で1度だけ返す）。
        `allowed_actions` に無い動作は行わない（受けて記録するだけ）。内容が正しくなければ `400 invalid_transmitter`、
        `issuer` が重複すれば `409 transmitter_exists`。`ssf.transmitter_created` を監査ログに残す。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSFTransmitterInput" }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSFTransmitter" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/ssf/transmitters/{id}:
    get:
      operationId: getSSFTransmitter
      summary: SSF の送信側を返す
      description: 権限 `ssf:manage`。`push_token` は返さない。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 送信側
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSFTransmitter" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateSSFTransmitter
      summary: SSF の送信側の登録を置き換える
      description: |
        権限 `ssf:manage`。`rotate_push_token` が真なら `push_token` を作り直して返す（古い値はすぐに使えない）。
        `ssf.transmitter_updated` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSFTransmitterInput" }
      responses:
        "200":
          description: 置き換えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSFTransmitter" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/ssf/transmitters/{id}:delete:
    post:
      operationId: deleteSSFTransmitter
      summary: SSF の送信側の登録を消す
      description: 権限 `ssf:manage`。その送信側が知らせた端末の準拠状態も消す。`ssf.transmitter_deleted` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 消した
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/ssf/streams:
    get:
      operationId: listSSFStreams
      summary: SSF の送信側のストリームの一覧（ADR 0118）
      description: |
        権限 `ssf:manage`。受信側（サービスアカウント）が SSF のストリーム管理の API で作ったもの。作成の順。push の送り先はホスト名だけ返す。
        フィーチャー `ssf_transmitter` が動いていなければ `404 ssf_transmitter_disabled`。
      responses:
        "200":
          description: ストリーム
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSFStreams" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/ssf/streams/{id}:delete:
    post:
      operationId: deleteSSFStream
      summary: SSF の送信側のストリームを消す
      description: 権限 `ssf:manage`。対象と poll の待ちの SET も消す。`ssf.stream_deleted` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: 消した
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: サービスアカウントの API キーか、運営者のセッションのトークン。
  responses:
    Error:
      description: エラー
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    RiskBand:
      type: object
      required: [medium, high]
      properties:
        medium: { type: integer, description: この点数以上が medium }
        high: { type: integer, description: この点数以上が high }
    RiskType:
      type: object
      required: [name, enabled, builtin, band]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        builtin: { type: boolean, description: 組み込みの種類か }
        band: { $ref: "#/components/schemas/RiskBand" }
        updated_at: { type: string, format: date-time, description: 一覧で変えた時刻（組み込みの種類を変えていなければ無い） }
    RiskTypeInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        band: { $ref: "#/components/schemas/RiskBand" }
    ActionNamespace:
      type: object
      required: [name, requirements, bands]
      properties:
        name: { type: string }
        requirements:
          type: object
          description: 操作 → 条件
          additionalProperties:
            type: object
            additionalProperties: true
        bands:
          type: object
          description: リスクの種類 → 段階の境界
          additionalProperties: { $ref: "#/components/schemas/RiskBand" }
        updated_at: { type: string, format: date-time, description: 設定を変えた時刻（設定していなければ無い） }
    ActionNamespaceInput:
      type: object
      properties:
        requirements:
          type: object
          description: 操作 → 条件。省けば要件なし
          additionalProperties:
            type: object
            additionalProperties: true
        bands:
          type: object
          description: リスクの種類 → 段階の境界。省けば realm の境界
          additionalProperties: { $ref: "#/components/schemas/RiskBand" }
    RiskUpdate:
      type: object
      required: [risk]
      properties:
        risk:
          type: object
          description: 種類 → 点数（0〜100、高いほど危うい）。null はその種類を「評価していない」に戻す
          additionalProperties: { type: integer, nullable: true }
    RiskUpdated:
      type: object
      required: [sessions]
      properties:
        sessions: { type: integer, description: 更新したセッションの数 }
    AttributeDef:
      type: object
      required: [key, type, values, user_editable, in_token, encrypted, created_at, updated_at]
      properties:
        key: { type: string }
        type: { type: string, enum: [string, integer, boolean, enum] }
        values: { type: array, items: { type: string }, description: enum の選択肢 }
        max_length: { type: integer, description: string の最大の文字数 }
        user_editable: { type: boolean }
        in_token: { type: boolean }
        encrypted: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AttributeDefInput:
      type: object
      required: [key, type]
      properties:
        key: { type: string, maxLength: 40 }
        type: { type: string, enum: [string, integer, boolean, enum] }
        values: { type: array, maxItems: 50, items: { type: string } }
        max_length: { type: integer, minimum: 1, maximum: 1024 }
        user_editable: { type: boolean, default: false }
        in_token: { type: boolean, default: false }
        encrypted: { type: boolean, default: false }
    AttributeDefUpdate:
      type: object
      properties:
        values: { type: array, maxItems: 50, items: { type: string } }
        max_length: { type: integer, minimum: 1, maximum: 1024 }
        user_editable: { type: boolean, default: false }
        in_token: { type: boolean, default: false }
    UserAttributes:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: object
          additionalProperties: {}
          description: key ごとの値（書くときの null は消す）
    ServiceAccount:
      type: object
      required: [id, name, created_at, deleted]
      properties:
        id: { type: string, description: client credentials の client_id にもなる }
        name: { type: string }
        org_id: { type: string, description: 所属する Org の公開 ID }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        deleted: { type: boolean }
        deleted_at: { type: string, format: date-time }
    ServiceAccountInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 400 }
        org_id: { type: string, description: 共有 Org の公開 ID }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
    ServiceAccountCredential:
      type: object
      required: [id, type, created_at, active]
      properties:
        id: { type: string }
        type: { type: string, enum: [api_key, client_secret, private_key_jwt] }
        alg: { type: string }
        public_key: { type: object, additionalProperties: true, description: private_key_jwt の公開鍵（JWK） }
        secret: { type: string, description: api_key と client_secret を作ったときだけ、1度だけ返す }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        active: { type: boolean, description: 今使えるか }
    ServiceAccountCredentialInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [api_key, client_secret, private_key_jwt] }
        public_key: { type: object, additionalProperties: true, description: private_key_jwt の公開鍵（JWK） }
        alg: { type: string, enum: [ES256, EdDSA, ML-DSA-65] }
        expires_at: { type: string, format: date-time }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    OrgSettings:
      type: object
      description: Org の段の設定。省いた項目は realm に従う
      properties:
        absolute_lifetime_seconds: { type: integer, format: int64, minimum: 1, description: 認証の時刻からのセッションの寿命 }
        idle_timeout_seconds: { type: integer, format: int64, minimum: 1 }
        max_auth_age_seconds: { type: integer, format: int64, minimum: 1, description: 重要な操作に求める直近の認証の期限 }
        warnings:
          type: object
          description: 警告のコードごとのアクション
          additionalProperties: { type: string, enum: [ignore, warn, deny] }
        login_policy: { $ref: "#/components/schemas/OrgLoginPolicy" }
        requirements:
          type: object
          description: >-
            Org の要件（ADR 0084）。操作（ワイルドカード `shop.payment:*` 可）→ 条件（付与の条件と同じ言語）。最大 64 件。
            この Org を文脈にした判定で、どの付与で許されたかに関係なく求め、`attested` を暗黙に AND する（厳しくする方向だけ）。
            Org 階層がオンなら祖先の Org の要件も AND する。操作が外れれば invalid_requirement、条件が外れれば invalid_condition
          additionalProperties:
            type: object
            additionalProperties: true
    StepUp:
      type: object
      description: >-
        認証をやり直せば満たせる条件（フィーチャー acr。ADR 0093）。`unmet` を返すときだけ。リソースサーバーは RFC 9470 の
        `WWW-Authenticate: Bearer error="insufficient_user_authentication"` に、`acr_values` と `max_age` として載せられる
      properties:
        acr_values: { type: string, description: 求める acr の値（`urn:iam:aal<n>`）。AAL を求めないときは無い }
        max_age: { type: integer, description: 求める認証からの経過の上限（秒）。求めないときは無い }
    OrgLoginPolicy:
      type: object
      description: >-
        Org のログインポリシー（フィーチャー org_login_policy）。ログインと Org の切り替えで判定し、満たさなければその Org に入れない
        （理由は policy.<種類>）。空の項目は判定しない
      properties:
        require_passkey: { type: boolean, description: passkey で本人確認したセッションだけを入れる }
        membership_email_domains:
          type: array
          maxItems: 50
          description: Membership に結び付けたメール（無ければ primary、確認済み）のドメインがこのどれかであること
          items: { type: string }
        ip_allowlist:
          type: array
          maxItems: 100
          description: 要求の IP がこのどれか（CIDR）に入ること
          items: { type: string }
        require_sso:
          type: boolean
          description: この Org の connection（Org 専用 SSO。ADR 0077）で認証したセッションだけを入れる。フィーチャー org_managed_users も要る
        passkey:
          allOf: [{ $ref: "#/components/schemas/PasskeyPolicy" }]
          description: >-
            Org の段の認証器のポリシー（ADR 0096）。認証に使った passkey が realm の段に加えてこれも満たすこと（理由は
            policy.passkey_authenticator）。passkey を使わない認証には効かない。フィーチャー passkey_attestation も要る
        min_aal:
          type: integer
          minimum: 1
          maximum: 3
          description: >-
            amr から求めた AAL（SP 800-63B）がこの値以上のセッションだけを入れる（理由は policy.min_aal）。フィーチャー acr も要る（ADR 0093）
        deny_restricted_authenticators:
          type: boolean
          description: >-
            amr に SP 800-63B の制限付きの認証器（SMS・音声の OTP。sms・tel）があるセッションを入れない（理由は
            policy.restricted_authenticator。ADR 0104）
    PasskeyPolicy:
      type: object
      description: >-
        認証器のポリシー（フィーチャー passkey_attestation。ADR 0096）。登録とログインのたびに判定し、外れれば
        passkey_not_allowed（どの条件に外れたかは監査ログにだけ残す）。空の項目は判定しない。require_attestation が無ければ
        AAGUID は認証器の自己申告
      properties:
        allowed_aaguids:
          type: array
          maxItems: 200
          description: 許可する認証器の AAGUID。空でなければ、このどれかであること
          items: { type: string, format: uuid }
        denied_aaguids:
          type: array
          maxItems: 200
          description: 拒否する認証器の AAGUID
          items: { type: string, format: uuid }
        min_certification_level:
          type: string
          enum: [L1, L1plus, L2, L2plus, L3, L3plus]
          description: 求める FIDO の認定レベル（FIDO Metadata Service の status report）
        require_attestation:
          type: boolean
          description: 登録のときに信頼の起点（MDS か設定）に連なる attestation を確かめた passkey だけを通す。既存の passkey は確かめていない
    OrgDomain:
      type: object
      required: [id, domain, status, txt_name, txt_value, created_at]
      properties:
        id: { type: string, description: 公開のドメイン ID（dom_…） }
        domain: { type: string }
        status: { type: string, enum: [pending, verified] }
        txt_name: { type: string, description: TXT を置く名前（`_iam-challenge.<domain>`） }
        txt_value: { type: string, description: TXT の値（`iam-domain-verification=<token>`） }
        verified_at: { type: string, format: date-time }
        checked_at: { type: string, format: date-time, description: 最後に TXT を確かめた時刻 }
        created_at: { type: string, format: date-time }
    OrgSettingsView:
      type: object
      required: [settings, effective]
      properties:
        settings: { $ref: "#/components/schemas/OrgSettings" }
        effective:
          type: object
          required: [absolute_lifetime_seconds, idle_timeout_seconds, max_auth_age_seconds, warnings]
          properties:
            absolute_lifetime_seconds: { type: integer, format: int64 }
            idle_timeout_seconds: { type: integer, format: int64 }
            max_auth_age_seconds: { type: integer, format: int64 }
            warnings:
              type: object
              description: すべての警告のコードのアクション（フィーチャー warnings が動いていなければ空）
              additionalProperties: { type: string, enum: [ignore, warn, deny] }
    Org:
      type: object
      required: [id, kind, created_at]
      properties:
        id: { type: string, description: 公開の Org ID }
        kind: { type: string, enum: [personal, shared] }
        name: { type: string }
        personal_owner_id: { type: string, description: 個人 Org の持ち主（公開のユーザー ID） }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        deletion_scheduled_at: { type: string, format: date-time, description: 削除の予定（猶予期間の終わり） }
        deleted_at: { type: string, format: date-time, description: 削除した時刻 }
        parent_id: { type: string, description: 親の Org（公開の Org ID。Org 階層、ADR 0078） }
        created_at: { type: string, format: date-time }
    Membership:
      type: object
      required: [id, user_id, org_id, status, role, created_at]
      properties:
        id: { type: string }
        user_id: { type: string, description: 公開のユーザー ID }
        org_id: { type: string }
        status: { type: string, enum: [invited, active, ended] }
        role: { type: string, enum: [owner, admin, member] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        ended_reason: { type: string }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string, description: 運営者向けの説明（秘密や個人情報は含めない） }
        quota: { $ref: "#/components/schemas/QuotaShortage" }
    QuotaShortage:
      type: object
      description: Quota の不足（`quota_exceeded`）。`from` から `until`（無ければ無期限）の間、上限 `limit` に `count` 人がいる
      required: [from, limit, count, shortage]
      properties:
        from: { type: string, format: date-time }
        until: { type: string, format: date-time }
        limit: { type: integer, format: int64 }
        count: { type: integer, format: int64 }
        shortage: { type: integer, format: int64, description: 足りない人数 }
    OrgQuota:
      type: object
      required: [quota_key, count, grants]
      properties:
        quota_key: { type: string, enum: [members] }
        limit: { type: integer, format: int64, description: 今の上限（無ければ無制限） }
        count: { type: integer, format: int64, description: 今数えている人数 }
        grants:
          type: array
          items: { $ref: "#/components/schemas/QuotaGrant" }
    QuotaGrantInput:
      type: object
      required: [kind, quantity]
      properties:
        kind: { type: string, enum: [base, addon, override] }
        quantity: { type: integer, format: int64, minimum: 0 }
        starts_at: { type: string, format: date-time, description: 省けば今（変更では今の値） }
        ends_at: { type: string, format: date-time, description: 省けば無期限 }
        external_ref: { type: string, maxLength: 200, description: 外部（課金など）の付与の参照。同じものがあれば上書きする }
    QuotaGrant:
      type: object
      required: [id, quota_key, kind, quantity, starts_at, source, created_at, updated_at]
      properties:
        id: { type: string }
        quota_key: { type: string, enum: [members] }
        kind: { type: string, enum: [base, addon, override] }
        quantity: { type: integer, format: int64 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        source: { type: string, enum: [manual, external] }
        external_ref: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClaimedNotification:
      type: object
      required: [to, expires_at]
      properties:
        to: { type: string, description: 宛先のメールアドレス }
        code: { type: string, description: 確認コード }
        token: { type: string, description: マジックリンクのトークン（リンク先のアプリが verify に渡す） }
        expires_at: { type: string, format: date-time }
    LoginLink:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string, description: 1回限り。本人以外に渡さない }
        expires_at: { type: string, format: date-time }
    UserLockout:
      type: object
      required: [locked, login_id, second_factor]
      properties:
        locked: { type: boolean, description: どちらかがロックか待ち時間の間か }
        login_id: { $ref: "#/components/schemas/LockoutState" }
        second_factor: { $ref: "#/components/schemas/LockoutState" }
    LockoutState:
      type: object
      required: [failures, level]
      properties:
        failures: { type: integer, description: 今の窓の失敗の回数 }
        level: { type: integer, description: 続けてロックされた回数（ロックの長さを倍にする） }
        locked_until: { type: string, format: date-time }
        wait_until: { type: string, format: date-time, description: 次に試せるまでの待ち時間の終わり }
    UserCredentials:
      type: object
      required: [passkeys, identities, totp, credentials]
      properties:
        passkeys:
          type: array
          items: { $ref: "#/components/schemas/UserPasskey" }
        identities:
          type: array
          items: { $ref: "#/components/schemas/UserIdentity" }
        totp:
          type: array
          items: { $ref: "#/components/schemas/UserTOTP" }
        credentials:
          type: array
          description: 認証方式のプラグインの、無効化していない認証情報（ADR 0092）
          items: { $ref: "#/components/schemas/UserCredential" }
        password: { $ref: "#/components/schemas/UserPassword" }
    UserCredential:
      type: object
      required: [id, method, created_at]
      properties:
        id: { type: string, description: 公開の認証情報の ID（crd_…） }
        method: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    UserPasskey:
      type: object
      required: [id, name, created_at, attested]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        aaguid: { type: string, format: uuid, description: 認証器のモデルの ID（attested でなければ認証器の自己申告） }
        authenticator_name:
          type: string
          description: 認証器の名前（設定した信頼の起点か FIDO Metadata Service。フィーチャー passkey_attestation が動いていて分かるときだけ）
        attestation_format: { type: string, description: 登録のときの attestation の形式（none、packed など。ADR 0096 の前に登録したものは無い） }
        attested: { type: boolean, description: 登録のときに attestation を信頼の起点まで確かめたか }
    UserIdentity:
      type: object
      required: [id, connection, created_at]
      properties:
        id: { type: string }
        connection: { type: string, description: connection の slug }
        created_at: { type: string, format: date-time }
    UserTOTP:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
    UserPassword:
      type: object
      description: 設定したパスワード（無ければ省略）
      required: [created_at]
      properties:
        created_at: { type: string, format: date-time }
    RevokedCredentials:
      type: object
      required: [passkeys, identities, totp, credentials, password, recovery_codes, sessions]
      properties:
        passkeys: { type: integer }
        identities: { type: integer }
        totp: { type: integer }
        credentials: { type: integer, description: 認証方式のプラグインの認証情報の数（ADR 0092） }
        password: { type: boolean }
        recovery_codes: { type: integer, description: 消した未使用のリカバリーコードの数 }
        sessions: { type: integer, description: 失効させたセッションの数 }
        personal_access_tokens: { type: integer, description: 取り消した Personal Access Token の数（ADR 0109） }
    Validity:
      type: object
      properties:
        valid_from: { type: string, format: date-time, nullable: true }
        valid_until: { type: string, format: date-time, nullable: true }
    UpdateUser:
      type: object
      properties:
        valid_from: { type: string, format: date-time, nullable: true }
        valid_until: { type: string, format: date-time, nullable: true }
    AdminUser:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [active, deleted, merged] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        deletion_scheduled_at: { type: string, format: date-time, description: 削除の予定（猶予期間の終わり） }
        legal_hold: { type: boolean }
    AdminUserSummary:
      type: object
      required: [id, status, suspended, created_at]
      properties:
        id: { type: string, description: 公開のユーザー ID }
        status: { type: string, enum: [active, deleted, merged] }
        suspended: { type: boolean, description: 今停止中か }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        deletion_scheduled_at: { type: string, format: date-time, description: 削除の予定（猶予期間の終わり） }
        legal_hold: { type: boolean }
        managed_by_org_id: { type: string, description: 管理する Org の公開 ID（Org 管理ユーザーのときだけ） }
        created_at: { type: string, format: date-time }
    AdminUserDetail:
      type: object
      required: [id, status, suspended, created_at, emails, credentials, suspensions]
      properties:
        id: { type: string, description: 公開のユーザー ID }
        status: { type: string, enum: [active, deleted, merged] }
        suspended: { type: boolean, description: 今停止中か }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        deletion_scheduled_at: { type: string, format: date-time, description: 削除の予定（猶予期間の終わり） }
        legal_hold: { type: boolean }
        managed_by_org_id: { type: string, description: 管理する Org の公開 ID（Org 管理ユーザーのときだけ） }
        merged_into: { type: string, description: 統合先のユーザーの公開 ID（merged のときだけ） }
        created_at: { type: string, format: date-time }
        emails:
          type: array
          items: { $ref: "#/components/schemas/AdminUserEmail" }
        credentials: { $ref: "#/components/schemas/UserCredentials" }
        recovery_codes_remaining: { type: integer, description: 未使用のリカバリーコードの数 }
        suspensions:
          type: array
          description: 停止の一覧（解除・終了したものも含む。開始の時刻の順）
          items: { $ref: "#/components/schemas/Suspension" }
        memberships:
          type: array
          description: Membership（終了したものも含む。フィーチャー org が動いているときだけ）
          items: { $ref: "#/components/schemas/Membership" }
    AdminUserEmail:
      type: object
      required: [id, primary, verified, created_at]
      properties:
        id: { type: string, description: メールの公開 ID }
        email: { type: string, description: アドレス（`include_pii=true` と `pii:read` のときだけ） }
        primary: { type: boolean }
        verified: { type: boolean }
        verified_via: { type: string, enum: [code, oauth_provider, sso, invitation, admin] }
        created_at: { type: string, format: date-time }
    AdminSession:
      type: object
      required: [id, authenticated_at, created_at, last_seen_at, expires_at, auth_methods]
      properties:
        id: { type: string, description: 公開のセッション ID（ses_…） }
        authenticated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        auth_methods:
          type: array
          items: { type: string }
        restriction: { type: string, description: 使える操作の制限（second_factor / enroll / recovery / deletion_pending）。無ければ制限なし }
        active_org_id: { type: string, description: active な Org の公開 ID（フィーチャー org が動いているときだけ） }
    EffectiveRoleBinding:
      type: object
      required: [id, role, principal_type, principal_id, created_at]
      properties:
        id: { type: string }
        role: { type: string, description: 組み込みのロールの名前か、独自のロールの ID }
        principal_type: { type: string, description: user / group / service_account }
        principal_id: { type: string, description: 付与の主体の公開 ID（Group の付与では Group） }
        org_id: { type: string, description: Org の範囲の付与の Org（公開 ID）。無ければ realm の範囲 }
        via_group_id: { type: string, description: この Group の所属を通して効く（Group の付与のときだけ） }
        resource_type: { type: string }
        resource_id: { type: string }
        condition:
          type: object
          additionalProperties: true
          description: 付与の条件（ADR 0084）。無ければ条件なし
        created_at: { type: string, format: date-time }
    PrincipalGroup:
      type: object
      required: [id, name, direct, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        org_id: { type: string, description: Org の範囲の Group の Org（公開 ID）。無ければ realm の範囲 }
        direct: { type: boolean, description: 直接の所属か（false はネストで含む Group） }
        created_at: { type: string, format: date-time }
    AdminConnection:
      type: object
      required: [id, slug, type, client_id, scopes, redirect_uris, active_identities, created_at]
      properties:
        id: { type: string }
        slug: { type: string }
        type: { type: string }
        owner_org_id: { type: string, description: Org 専用 SSO の connection の Org（公開 ID） }
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        client_id: { type: string }
        scopes:
          type: array
          items: { type: string }
        redirect_uris:
          type: array
          items: { type: string }
        active_identities: { type: integer, description: 有効な外部 ID の紐付けの数 }
        ldap: { $ref: "#/components/schemas/LDAPConnectionInfo" }
        created_at: { type: string, format: date-time }
    LDAPSync:
      type: object
      properties:
        enabled: { type: boolean, description: 定期的な同期を行う }
        interval_seconds: { type: integer, format: int64, description: 同期の間隔（900〜604800 秒。0 なら 3600） }
        provision: { type: boolean, description: まだ紐付いていない本人を、ログインと同じ規則で事前に登録する }
        on_missing: { type: string, enum: [suspend, none], description: ディレクトリから消えた・無効にされた本人の扱い（既定 suspend） }
    LDAPConnectionInput:
      type: object
      required: [url, bind_dn, bind_password, user_base_dn]
      properties:
        url: { type: string, maxLength: 2048, description: "ldaps://host[:port] か ldap://host[:port]（StartTLS を必ず掛ける）" }
        ca_pem: { type: string, maxLength: 65536, description: サーバーの証明書の信頼の起点（PEM）。無ければ OS の既定 }
        pins:
          type: array
          maxItems: 10
          items: { type: string, description: 証明書の SubjectPublicKeyInfo の SHA-256（base64） }
        bind_dn: { type: string, maxLength: 1024 }
        bind_password: { type: string, maxLength: 1024, format: password }
        user_base_dn: { type: string, maxLength: 1024 }
        user_filter: { type: string, maxLength: 1024, description: "既定は (objectClass=inetOrgPerson)。AD は (&(objectCategory=person)(objectClass=user))" }
        login_attribute: { type: string, maxLength: 64, description: 既定は uid（AD は sAMAccountName） }
        id_attribute: { type: string, maxLength: 64, description: 変わらない識別子。既定は entryUUID（AD は objectGUID） }
        email_attribute: { type: string, maxLength: 64, description: 既定は mail }
        group_base_dn: { type: string, maxLength: 1024, description: この下の Group の所属を同期する（無ければ所属を同期しない） }
        group_attribute: { type: string, maxLength: 64, description: 本人の項目の所属の属性。既定は memberOf }
        active_directory: { type: boolean, description: Active Directory の既定を使い、userAccountControl の無効を見る }
        sync: { $ref: "#/components/schemas/LDAPSync" }
    LDAPConnectionInfo:
      type: object
      required: [url, bind_dn, user_base_dn, user_filter, login_attribute, id_attribute, email_attribute, active_directory, trust_email, ca_configured, pins, sync]
      properties:
        url: { type: string }
        bind_dn: { type: string }
        user_base_dn: { type: string }
        user_filter: { type: string }
        login_attribute: { type: string }
        id_attribute: { type: string }
        email_attribute: { type: string }
        group_base_dn: { type: string }
        group_attribute: { type: string }
        active_directory: { type: boolean }
        trust_email: { type: boolean }
        ca_configured: { type: boolean }
        pins:
          type: array
          items: { type: string }
        sync: { $ref: "#/components/schemas/LDAPSync" }
    CreateLDAPConnectionInput:
      allOf:
        - { $ref: "#/components/schemas/LDAPConnectionInput" }
        - type: object
          required: [slug]
          properties:
            slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
            trust_email: { type: boolean }
    LDAPSyncResult:
      type: object
      required: [entries, skipped, linked, provisioned, provision_skipped, missing, suspended, reactivated, groups_created, group_conflicts, members_added, members_removed, complete, deprovision_aborted]
      properties:
        entries: { type: integer, description: ディレクトリから読んだ本人の数 }
        skipped: { type: integer, description: 読めなかった・識別子の重なる項目 }
        linked: { type: integer, description: 有効な外部 ID の紐付けの数 }
        provisioned: { type: integer }
        provision_skipped: { type: integer }
        missing: { type: integer, description: ディレクトリから消えた・無効にされた本人 }
        suspended: { type: integer }
        reactivated: { type: integer }
        groups_created: { type: integer }
        group_conflicts: { type: integer, description: 手で作った Group と名前が重なり、同期しなかった Group }
        members_added: { type: integer }
        members_removed: { type: integer }
        complete: { type: boolean, description: 全件を読み切ったか（読み切れなければ停止と所属の削除をしない） }
        deprovision_aborted: { type: boolean, description: 消えた本人が多すぎ、安全のため停止を見送った }
    AdminSigningKey:
      type: object
      required: [kid, alg, state, created_at]
      properties:
        kid: { type: string }
        alg: { type: string }
        state: { type: string, enum: [active, retired, expired] }
        created_at: { type: string, format: date-time }
        retired_at: { type: string, format: date-time }
        published_until: { type: string, format: date-time, description: JWKS に残す期限（退役した鍵だけ） }
    SuspendRequest:
      type: object
      required: [category, reason]
      properties:
        category: { type: string, description: "tos_violation / customer_request / security_risk / billing / realm で足したもの" }
        reason: { type: string, minLength: 1, maxLength: 1000, description: 内部向けの理由（監査ログに出し、本人には見せない） }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        external_ref: { type: string, maxLength: 200, description: 外部のシステム（課金など）の参照。冪等にする }
    LiftRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    Suspension:
      type: object
      required: [id, target_type, target_id, category, reason, starts_at, active, created_at]
      properties:
        id: { type: string }
        target_type: { type: string, enum: [user, org, membership, service_account] }
        target_id: { type: string, description: 対象の公開 ID }
        user_id: { type: string, description: ユーザーと Membership の停止で、本人の公開 ID }
        category: { type: string }
        reason: { type: string }
        external_ref: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        active: { type: boolean, description: 今停止中か }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        lifted_at: { type: string, format: date-time }
        lifted_by: { type: string }
    Suspensions:
      type: object
      required: [suspensions]
      properties:
        suspensions:
          type: array
          items: { $ref: "#/components/schemas/Suspension" }
    Role:
      type: object
      required: [id, name, permissions, builtin, assignable]
      properties:
        id: { type: string, description: 組み込みのロールは名前、独自のロールは公開 ID }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
        builtin: { type: boolean }
        assignable: { type: boolean, description: 付与の API で付与できるか（組み込みの Org のロールは org_role から効くので false） }
    Roles:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions:
          type: array
          maxItems: 100
          items: { type: string }
    RoleBinding:
      type: object
      required: [id, role, principal_type, principal_id, created_at]
      properties:
        id: { type: string }
        role: { type: string, description: 組み込みのロールの名前か、独自のロールの ID }
        principal_type: { type: string, description: user / group / service_account }
        principal_id: { type: string, description: 主体の公開 ID }
        resource_type: { type: string }
        resource_id: { type: string }
        condition:
          type: object
          additionalProperties: true
          description: 付与の条件（ADR 0084）。無ければ条件なし
        created_at: { type: string, format: date-time }
    RoleBindings:
      type: object
      required: [bindings]
      properties:
        bindings:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }
    RoleBindingInput:
      type: object
      required: [role, principal_type, principal_id]
      properties:
        role: { type: string }
        principal_type: { type: string, description: user / group / service_account }
        principal_id: { type: string }
        resource_type: { type: string, maxLength: 64 }
        resource_id: { type: string, maxLength: 256 }
        condition:
          type: object
          additionalProperties: true
          description: |
            付与の条件（ADR 0084）。条件を満たすときだけ付与が効く。型付きの木で、各節はちょうど1つの項目を持つ：
            `all`・`any`（子の配列）、`amr_has`（手段の配列。いずれかを使った）、`factors_at_least`（1〜3）、
            `auth_within`（認証からの秒。1〜86400）、`risk_below`（`{type, score}`。点数が未満。score は 1〜100）、
            `risk_at_most`（`{type, level}`。level は low / medium / high）、`attested`（true。文脈を IAM が確かめた）、
            `aal_at_least`（1〜3。amr から求めた AAL。フィーチャー acr が要る。ADR 0093）。
            深さ 4・葉 16 まで。リスクの種類は realm の一覧で有効なものだけ。外れれば `400 invalid_condition`。
    Group:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Groups:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/Group" }
    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    GroupMember:
      type: object
      required: [principal_type, principal_id, created_at]
      properties:
        principal_type: { type: string, description: "user・service_account・group（nested_groups が有効なとき）" }
        principal_id: { type: string, description: 主体の公開 ID }
        created_at: { type: string, format: date-time }
    GroupMembers:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
    GroupMemberInput:
      type: object
      required: [principal_type, principal_id]
      properties:
        principal_type: { type: string, description: "user・service_account・group（nested_groups が有効なとき）" }
        principal_id: { type: string }
    CheckRequest:
      type: object
      required: [principal_id, action]
      properties:
        principal_type:
          type: string
          enum: [user, service_account]
          default: user
          description: "`service_account` はフィーチャー `service_accounts` が動いているときだけ（止まっていれば `400`）"
        principal_id: { type: string, description: 主体の公開 ID（サービスアカウントは `sva_…`） }
        action: { type: string, minLength: 1, maxLength: 162, description: "`<リソース>:<操作>`" }
        org_id: { type: string, description: 判定の文脈の Org の公開 ID }
        resource_type: { type: string, maxLength: 64, description: "`org` なら `resource_id`（Org の公開 ID）が判定の文脈の Org になる。`org_id` と食い違えば `400`" }
        resource_id: { type: string, maxLength: 256 }
        sid:
          type: string
          maxLength: 256
          description: |
            主体のログインの系列（ID トークンの `sid`）。渡せば IAM がその今のセッションから認証の文脈を組み立てる（ADR 0084。
            `attested`）。系列が使えないか主体のものでなければ文脈なし（条件は満たさない）
        access_token:
          type: string
          maxLength: 4096
          description: 主体のアクセストークン。`sid` と同じく IAM が文脈を組み立てる（`sid` より優先）。使えないか主体のものでなければ文脈なし
        context: { $ref: "#/components/schemas/DeclaredContext" }
    BatchCheckRequest:
      type: object
      required: [principal_id, checks]
      properties:
        principal_type:
          type: string
          enum: [user, service_account]
          default: user
          description: "`/v1/admin/authz:check` と同じ"
        principal_id: { type: string, description: 主体の公開 ID }
        org_id: { type: string, description: 判定の文脈の Org の公開 ID（すべての判定で共通） }
        sid: { type: string, maxLength: 256, description: "`/v1/admin/authz:check` と同じ" }
        access_token: { type: string, maxLength: 4096, description: "`/v1/admin/authz:check` と同じ" }
        context: { $ref: "#/components/schemas/DeclaredContext" }
        checks:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/BatchCheckItem" }
    BatchCheckItem:
      type: object
      required: [action]
      properties:
        action: { type: string, minLength: 1, maxLength: 162, description: "`<リソース>:<操作>`" }
        resource_type: { type: string, maxLength: 64, description: "`org` は使えない" }
        resource_id: { type: string, maxLength: 256 }
    BatchCheckResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/CheckResult" }
    DeclaredContext:
      type: object
      description: |
        連携先が申告する認証の文脈（ADR 0084）。realm の設定 `declared_context_clients` に載せた呼び出し元のときだけ使い、
        それ以外は捨てる。`sid` か `access_token` があれば捨てる。申告の文脈は `attested` でなく、付与の条件の `attested` と、
        名前空間・Org の要件を満たさない。リスクは一覧で有効な種類・範囲内の値だけを使う
      properties:
        amr:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 32 }
        auth_time: { type: string, format: date-time }
        risk:
          type: object
          additionalProperties: { type: integer }
    CheckResult:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reasons:
          type: array
          items: { type: string }
          description: 主体が使えないときの理由のコード（4.9）
        unmet:
          type: array
          items: { type: string }
          description: |
            条件で拒んだときの、満たさなかった条件の理由のコード（`condition.amr`・`condition.factors`・`condition.auth_age`・
            `condition.risk.<種類>`・`condition.attested`・`condition.aal`。ADR 0084、0093）。付与の条件だけで拒み、その付与が
            条件を満たせば許されたときに限って返す。連携先はこれを見て step-up を促せる
        step_up: { $ref: "#/components/schemas/StepUp" }
    ClientInput:
      type: object
      required: [name, redirect_uris, token_endpoint_auth_method]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        redirect_uris:
          type: array
          maxItems: 20
          description: 1 つ以上。`device_authorization_grant` を許すか `backchannel_token_delivery_mode` を登録した連携先だけは空でよい
          items: { type: string }
        post_logout_redirect_uris:
          type: array
          maxItems: 20
          items: { type: string }
        token_endpoint_auth_method:
          type: string
          enum: [client_secret, private_key_jwt, none, tls_client_auth, self_signed_tls_client_auth]
          description: |
            `tls_client_auth`・`self_signed_tls_client_auth` は OAuth の mTLS（RFC 8705。フィーチャー `mtls_client_auth`。ADR 0113）。
            `tls_client_auth` は `tls_client_auth_*` のどれか1つで証明書を照合し、`self_signed_tls_client_auth` は `jwks` の鍵と証明書の鍵を照合する
        tls_client_auth_subject_dn: { type: string, description: 証明書の主体の DN（RFC 4514 の文字列。完全一致） }
        tls_client_auth_san_dns: { type: string }
        tls_client_auth_san_uri: { type: string }
        tls_client_auth_san_ip: { type: string }
        tls_client_auth_san_email: { type: string }
        tls_client_certificate_bound_access_tokens:
          type: boolean
          description: トークンをクライアント証明書に結び付ける（RFC 8705 3。フィーチャー `mtls_client_auth` が動いているときだけ true にできる）
        dpop_bound_access_tokens:
          type: boolean
          description: token エンドポイントで常に DPoP の証明を求める（RFC 9449 5.2。フィーチャー `dpop` が動いているときだけ true にできる）
        device_authorization_grant:
          type: boolean
          description: Device Authorization Grant（RFC 8628）を許す。フィーチャー `device_flow` が動いているときだけ true にできる（ADR 0095）
        jwks:
          type: object
          additionalProperties: true
          description: "`private_key_jwt` の公開鍵（JWKS）"
        id_token_signed_response_alg:
          type: string
          enum: [ES256, ML-DSA-65, RS256]
          description: ID トークンと Logout Token の署名。`RS256` はフィーチャー `rs256` が動いているときだけ選べる（ADR 0122）
        backchannel_logout_uri: { type: string }
        frontchannel_logout_uri:
          type: string
          description: |
            Front-Channel Logout の送り先（OIDC Front-Channel Logout 1.0。フィーチャー `oidc_logout`。ADR 0094）。ログアウトの
            完了画面で iframe で開く。scheme・ホスト・ポートは `redirect_uris` のどれかと同じであること。フィーチャーが
            動いていなければ、今の値から変えられない（`invalid_client_metadata`）
        frontchannel_logout_session_required:
          type: boolean
          description: "`frontchannel_logout_uri` に `iss` と `sid` を付けるか（既定 false）"
        backchannel_token_delivery_mode:
          type: string
          enum: [poll, ping]
          description: |
            CIBA のトークンの受け取り方（OpenID CIBA Core 4。フィーチャー `ciba`。ADR 0114）。機密の連携先だけ。無ければ CIBA を
            使えない。フィーチャーが動いていなければ付けられない（`invalid_client_metadata`）。CIBA だけの連携先は `redirect_uris` が空でよい
        backchannel_client_notification_endpoint:
          type: string
          description: ping の通知先（https。`backchannel_token_delivery_mode` が ping のときだけ、必須）
        require_pushed_authorization_requests:
          type: boolean
          description: |
            認可要求を PAR（RFC 9126）で送らせる。フィーチャー `par` が動いているときだけ true にできる（ADR 0112）。省けば false
        fapi2_security_profile:
          type: boolean
          description: |
            FAPI 2.0 Security Profile を強いる（ADR 0117）。フィーチャー `fapi2`・`par` と、`dpop` か `mtls_client_auth` が動いているときだけ
            true にできる。true なら private_key_jwt か mTLS の認証、`dpop_bound_access_tokens` か `tls_client_certificate_bound_access_tokens`、
            ES256 の ID トークン、https の戻り先が要り、Device Authorization Grant は使えない。PAR を求め、リフレッシュトークンは
            ローテーションしない。省けば false
        jwt_access_tokens:
          type: boolean
          description: |
            アクセストークンを JWT（RFC 9068。`typ: at+jwt`、`id_token_signed_response_alg` と同じアルゴリズム）で出す。フィーチャー
            `jwt_access_tokens` が動いているときだけ true にできる（ADR 0123）。リソースサーバーは JWKS で署名を確かめられるが、失効・停止は
            期限まで届かない（イントロスペクションは今までどおり即時）。省けば false（不透明なトークン）
        offline_access:
          type: boolean
          description: |
            `offline_access` のスコープを受け、ログインの系列から切り離した認可（リフレッシュトークン）を出す（OIDC Core 11。ADR 0126）。
            フィーチャー `offline_access` が動いているときだけ true にできる。ログアウト・セッションの期限では失効せず、本人は
            `/v1/me/offline-access` で取り消せる。省けば false（`offline_access` を求めても、普通の認可にする）
    Client:
      type: object
      required: [client_id, name, redirect_uris, post_logout_redirect_uris, token_endpoint_auth_method, id_token_signed_response_alg, trust_level, created_at, updated_at]
      properties:
        client_id: { type: string }
        name: { type: string }
        trust_level: { type: string, enum: [first_party] }
        redirect_uris:
          type: array
          items: { type: string }
        post_logout_redirect_uris:
          type: array
          items: { type: string }
        token_endpoint_auth_method: { type: string }
        jwks:
          type: object
          additionalProperties: true
        id_token_signed_response_alg: { type: string }
        backchannel_logout_uri: { type: string }
        device_authorization_grant: { type: boolean, description: フィーチャー `device_flow` が動いているときだけ返す }
        tls_client_auth_subject_dn: { type: string }
        tls_client_auth_san_dns: { type: string }
        tls_client_auth_san_uri: { type: string }
        tls_client_auth_san_ip: { type: string }
        tls_client_auth_san_email: { type: string }
        tls_client_certificate_bound_access_tokens: { type: boolean, description: フィーチャー `mtls_client_auth` が動いているときだけ返す }
        dpop_bound_access_tokens: { type: boolean, description: フィーチャー `dpop` が動いているときだけ返す }
        frontchannel_logout_uri: { type: string }
        frontchannel_logout_session_required: { type: boolean, description: "`frontchannel_logout_uri` があるときだけ" }
        backchannel_token_delivery_mode: { type: string, description: CIBA のトークンの受け取り方（フィーチャー `ciba` が動いていて、登録したときだけ返す） }
        backchannel_client_notification_endpoint: { type: string, description: ping の通知先（ping のときだけ） }
        require_pushed_authorization_requests: { type: boolean, description: PAR を求める連携先だけ true を返す（求めないなら省く） }
        fapi2_security_profile: { type: boolean, description: FAPI 2.0 Security Profile を強いる連携先だけ true を返す（強いないなら省く） }
        jwt_access_tokens: { type: boolean, description: JWT のアクセストークン（RFC 9068）を出す連携先だけ true を返す（出さないなら省く） }
        offline_access: { type: boolean, description: offline_access を受ける連携先だけ true を返す（受けないなら省く） }
        client_secret: { type: string, description: 作成と、認証方式を client_secret に変えたときだけ（1度だけ返す） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TokenExchangePolicy:
      type: object
      required: [audiences]
      properties:
        audiences:
          type: array
          maxItems: 20
          items: { type: string }
          description: 交換で発行するトークンの aud に選べるもの（連携先の client_id か資源の URI）
        subject_clients:
          type: array
          maxItems: 20
          items: { type: string }
          description: この連携先自身のほかに、subject_token の aud として受け付ける連携先の client_id
        impersonation:
          type: boolean
          description: 運営者のなりすまし（`requested_subject`）を許す（フィーチャー `impersonation`）
    Clients:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items: { $ref: "#/components/schemas/Client" }
    RealmSettings:
      type: object
      description: realm ごとの設定（ADR 0083）。省いた項目は設定ファイルの `realm` の値
      properties:
        timezone: { type: string }
        verified_via:
          type: array
          items: { type: string, enum: [code, oauth_provider, sso, invitation, admin] }
        org_creation: { type: string, enum: [anyone, operators_only, invite_only] }
        org_deletion_grace_seconds: { type: integer, format: int64, minimum: 0 }
        user_deletion_grace_seconds: { type: integer, format: int64, minimum: 0 }
        email_storage: { type: string, enum: [encrypted, index_only] }
        quota_count:
          type: object
          properties:
            invited: { type: boolean }
            future: { type: boolean }
            suspended: { type: boolean }
        declared_context_clients:
          type: array
          maxItems: 100
          description: 判定（authz:check）で認証の文脈を申告できるサービスアカウントの ID（ADR 0084）。申告は attested でない
          items: { type: string }
        passkey_policy:
          allOf: [{ $ref: "#/components/schemas/PasskeyPolicy" }]
          description: realm の段の認証器のポリシー（フィーチャー passkey_attestation。ADR 0096）。空のオブジェクトで外す
        disabled_methods:
          type: array
          maxItems: 32
          description: >-
            この realm で止める認証方式のプラグインの名前（`sms` など。ADR 0104）。止めた方式はこの realm で 404 になる。
            登録済みの認証情報は残る
          items: { type: string }
        require_pushed_authorization_requests:
          type: boolean
          description: この realm のすべての連携先に PAR（RFC 9126）を求める（フィーチャー `par`。ADR 0112）
        fapi2_security_profile:
          type: boolean
          description: |
            この realm のすべての連携先に FAPI 2.0 Security Profile を強いる（フィーチャー `fapi2`。ADR 0117）。条件を満たさない連携先は
            登録できず、既にあるものは認証できなくなる。Discovery は強いるものだけを出す
    Realm:
      type: object
      required: [id, slug, hosts, default, settings, created_at, updated_at]
      properties:
        id: { type: string }
        slug: { type: string }
        hosts:
          type: array
          items: { type: string }
        default: { type: boolean, description: 既定の realm（設定ファイルの realm。root で動く） }
        issuer: { type: string, description: OIDC の iss（server.public_url が無ければ無い） }
        settings:
          type: object
          required: [timezone, verified_via, org_creation, org_deletion_grace_seconds, user_deletion_grace_seconds, email_storage, quota_count, declared_context_clients]
          properties:
            timezone: { type: string }
            verified_via:
              type: array
              items: { type: string }
            org_creation: { type: string }
            org_deletion_grace_seconds: { type: integer, format: int64 }
            user_deletion_grace_seconds: { type: integer, format: int64 }
            email_storage: { type: string }
            quota_count:
              type: object
              required: [invited, future, suspended]
              properties:
                invited: { type: boolean }
                future: { type: boolean }
                suspended: { type: boolean }
            declared_context_clients:
              type: array
              items: { type: string }
            passkey_policy: { $ref: "#/components/schemas/PasskeyPolicy" }
            disabled_methods:
              type: array
              items: { type: string }
            require_pushed_authorization_requests: { type: boolean }
            fapi2_security_profile: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RealmInput:
      type: object
      required: [slug]
      properties:
        slug: { type: string, description: "英小文字・数字・ハイフン（63 文字まで）" }
        hosts:
          type: array
          maxItems: 10
          items: { type: string }
          description: この realm を指すホスト名（ポートなし）。最初のものが issuer と passkey の RP になる
        settings: { $ref: "#/components/schemas/RealmSettings" }
    RealmUpdate:
      type: object
      properties:
        hosts:
          type: array
          maxItems: 10
          items: { type: string }
        settings: { $ref: "#/components/schemas/RealmSettings" }
    AuditActor:
      type: object
      required: [type]
      properties:
        type: { type: string, description: "user / service_account / system / operator_cli / anonymous など" }
        id: { type: string }
    AuditEvent:
      type: object
      required: [id, seq, hash, time, type, result, actor]
      description: 監査ログの1件（design.md 6.2）。`ip`・`user_agent` は切り詰めた値（ADR 0063）
      properties:
        id: { type: string }
        seq: { type: integer, format: int64, description: チェーン上の位置（全 realm で1本） }
        hash: { type: string, description: チェーンのハッシュ（16進） }
        time: { type: string, format: date-time }
        type: { type: string }
        result: { type: string }
        actor: { $ref: "#/components/schemas/AuditActor" }
        org_id: { type: string }
        session_id: { type: string }
        ip: { type: string, description: IPv4 /24・IPv6 /48 に切り詰めた値 }
        user_agent: { type: string, description: ブラウザと OS の大分類 }
        request_id: { type: string }
        details:
          type: object
          additionalProperties: {}
        client:
          type: object
          description: "`include_client_data=true` で読めたときの全文"
          properties:
            ip: { type: string }
            user_agent: { type: string }
        client_unreadable: { type: boolean, description: "`include_client_data=true` で、全文が無いか読めない" }
    AuditChainVerification:
      type: object
      required: [valid, from_seq, to_seq, head_seq, anchored, prev_hash]
      properties:
        valid: { type: boolean }
        from_seq: { type: integer, format: int64 }
        to_seq: { type: integer, format: int64, description: 確かめた最後の seq（範囲が空なら from_seq より小さい） }
        head_seq: { type: integer, format: int64, description: チェーンの最新の seq }
        anchored: { type: boolean, description: 先頭（Genesis かチェックポイント）から確かめたか }
        prev_hash: { type: string, description: from_seq の前のハッシュ（16進） }
        last_hash: { type: string, description: to_seq のハッシュ（16進。壊れていれば無い） }
        checkpoint:
          type: object
          required: [seq, hash, at]
          properties:
            seq: { type: integer, format: int64 }
            hash: { type: string }
            at: { type: string, format: date-time }
        broken:
          type: object
          required: [seq, reason]
          properties:
            seq: { type: integer, format: int64 }
            reason:
              type: string
              enum: [seq_gap, prev_hash_mismatch, hash_mismatch, payload_invalid, realm_mismatch, unkeyed_record, key_unavailable]
    EventSubscription:
      type: object
      required: [id, url, event_types, pii, enabled, created_at, updated_at, delivery]
      properties:
        id: { type: string }
        url: { type: string }
        event_types:
          type: array
          items: { type: string }
        pii: { type: string, enum: [omit, pseudonymize] }
        enabled: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        delivery:
          type: object
          required: [cursor_seq, failures]
          properties:
            cursor_seq: { type: integer, format: int64, description: 送り終えた監査ログの seq }
            failures: { type: integer, description: 続けて失敗した回数 }
            next_attempt_at: { type: string, format: date-time }
            last_error: { type: string }
            last_delivered_at: { type: string, format: date-time }
    EventSubscriptionWithSecret:
      allOf:
        - { $ref: "#/components/schemas/EventSubscription" }
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: 署名の鍵（この応答でだけ返す） }
    EventSubscriptionInput:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2048 }
        event_types:
          type: array
          maxItems: 20
          items: { type: string }
        pii: { type: string, enum: [omit, pseudonymize] }
        enabled: { type: boolean, default: true }
    EventSubscriptionUpdate:
      type: object
      properties:
        url: { type: string, maxLength: 2048 }
        event_types:
          type: array
          maxItems: 20
          items: { type: string }
        pii: { type: string, enum: [omit, pseudonymize] }
        enabled: { type: boolean }
    WSFedClaim:
      type: object
      required: [source, type]
      properties:
        source:
          type: string
          description: "`user_id`・`email`（確認済みのものだけ出す）・`org_id`・`amr`・`attribute:<キー>`（フィーチャー `custom_attributes`）"
        type:
          type: string
          maxLength: 512
          description: クレームの種類（絶対 URI）。SAML 1.1 では最後の `/` の後ろが AttributeName になる
    WSFedRelyingPartyInput:
      type: object
      required: [realm, name, reply_urls]
      properties:
        realm: { type: string, maxLength: 1024, description: "`wtrealm`（絶対 URI）" }
        name: { type: string, minLength: 1, maxLength: 100 }
        reply_urls:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, maxLength: 2048 }
        token_type: { type: string, enum: [saml11, saml20], description: 既定は saml11 }
        claims:
          type: array
          maxItems: 32
          description: 省けば `email` を `http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress` に出す。空の配列ならクレームを出さない
          items: { $ref: "#/components/schemas/WSFedClaim" }
        token_lifetime: { type: integer, minimum: 300, maximum: 86400, description: Assertion の有効期間（秒。既定 3600） }
        signing_alg: { type: string, enum: [ES256, RS256], description: "署名のアルゴリズム。`ES256`（ECDSA-SHA256。既定）か `RS256`（RSA-SHA256。フィーチャー `rs256` が動いているときだけ。ADR 0125）" }
    WSFedRelyingParty:
      type: object
      required: [id, realm, name, reply_urls, token_type, claims, token_lifetime, signing_alg, created_at, updated_at]
      properties:
        id: { type: string }
        realm: { type: string }
        name: { type: string }
        reply_urls:
          type: array
          items: { type: string }
        token_type: { type: string }
        claims:
          type: array
          items: { $ref: "#/components/schemas/WSFedClaim" }
        token_lifetime: { type: integer }
        signing_alg: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WSFedRelyingParties:
      type: object
      required: [relying_parties]
      properties:
        relying_parties:
          type: array
          items: { $ref: "#/components/schemas/WSFedRelyingParty" }
    PersonalAccessToken:
      type: object
      required: [id, name, scopes, created_at]
      description: Personal Access Token（秘密は含めない。ADR 0109）
      properties:
        id: { type: string, description: "トークン ID（`pat_…`）" }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        revoke_reason: { type: string, enum: [user, operator, revoke_all, merged] }
    PersonalAccessTokenPolicyInput:
      type: object
      required: [max_lifetime_seconds, allowed_scopes, require_expiry]
      properties:
        max_lifetime_seconds: { type: integer, format: int64, minimum: 0, description: realm の寿命の上限（0 なら realm では決めない） }
        allowed_scopes:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 162 }
          description: 作れるスコープ（権限の名前。`x:*` も可）。空なら形だけを確かめる
        require_expiry: { type: boolean, description: 期限の無いトークンを作れない・使えない }
    PersonalAccessTokenPolicy:
      type: object
      required: [max_lifetime_seconds, allowed_scopes, require_expiry, host_max_lifetime_seconds, effective_max_lifetime_seconds]
      properties:
        max_lifetime_seconds: { type: integer, format: int64 }
        allowed_scopes: { type: array, items: { type: string } }
        require_expiry: { type: boolean }
        host_max_lifetime_seconds: { type: integer, format: int64, description: ホスト先の上限（0 なら上限なし） }
        effective_max_lifetime_seconds: { type: integer, format: int64, description: 今効く上限（0 なら上限なし） }
        updated_at: { type: string, format: date-time, description: 最後に変えた時刻（置いていなければ無い） }
    SAMLEndpoint:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: https の絶対 URL（フラグメント・利用者情報なし） }
        binding:
          type: string
          description: |
            バインディングの URN。ACS は `urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST` だけ（省略時も同じ）。
            SLO は HTTP-Redirect か HTTP-POST（必須）
        index: { type: integer, minimum: 0, maximum: 65535, description: ACS の番号（AssertionConsumerServiceIndex。SLO では使わない） }
        default: { type: boolean, description: 既定の ACS（AuthnRequest が ACS を指さないときと IdP-initiated）。無ければ最初のもの }
    SAMLAttribute:
      type: object
      required: [source, name]
      properties:
        source:
          type: string
          description: "`user_id`・`email`（確認済みのものだけ出す）・`org_id`・`amr`・`attribute:<キー>`（フィーチャー `custom_attributes`）"
        name: { type: string, maxLength: 256, description: 属性の名前（`name_format` が uri なら絶対 URI） }
        name_format:
          type: string
          description: "`urn:oasis:names:tc:SAML:2.0:attrname-format:uri`（既定）・`basic`・`unspecified` の URN"
        friendly_name: { type: string, maxLength: 100 }
    SAMLServiceProviderInput:
      type: object
      required: [entity_id, name, acs]
      properties:
        entity_id: { type: string, maxLength: 1024, description: SP の Entity ID（絶対 URI） }
        name: { type: string, minLength: 1, maxLength: 100 }
        acs:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/SAMLEndpoint" }
        slo:
          type: array
          maxItems: 2
          description: SingleLogoutService（LogoutResponse を返す先）。登録するには `signing_certificates` が要る（LogoutRequest はいつも署名を求める）
          items: { $ref: "#/components/schemas/SAMLEndpoint" }
        signing_certificates:
          type: array
          maxItems: 3
          description: AuthnRequest・LogoutRequest の署名を確かめる SP の証明書（PEM か base64 の DER。RSA 2048 bit 以上か ECDSA。期限切れは受けない）
          items: { type: string, maxLength: 16384 }
        require_signed_requests: { type: boolean, description: 署名の無い AuthnRequest を受けない（既定 false。署名があればいつも確かめる） }
        encryption_certificate:
          type: string
          maxLength: 16384
          description: Assertion を暗号化する SP の証明書（PEM か base64 の DER。RSA 2048 bit 以上）。あれば必ず暗号化する（AES-128-GCM と RSA-OAEP）
        name_id_format:
          type: string
          description: NameID の形式の URN（persistent（既定）・emailAddress・unspecified・transient）
        name_id_source:
          type: string
          description: NameID の値の出どころ（`user_id`・`email`・`attribute:<キー>`）。既定は emailAddress なら `email`、ほかは `user_id`。transient では使わない。本人が書ける属性（`user_editable`）は使えない（`400`。後で書けるようにしたら、その SP には `InvalidNameIDPolicy` を返す）。書けないように戻した属性の既存の値は保証されないので、使う前に運営者が書き直す
        attributes:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/SAMLAttribute" }
        sign_assertion: { type: boolean, description: Assertion に署名する（既定 true） }
        sign_response: { type: boolean, description: Response に署名する（既定 false。どちらかは true） }
        allow_idp_initiated: { type: boolean, description: IdP-initiated の SSO を許す（既定 false） }
        assertion_lifetime: { type: integer, minimum: 60, maximum: 3600, description: Assertion の有効期間（秒。既定 300） }
        signing_alg: { type: string, enum: [ES256, RS256], description: "署名のアルゴリズム。`ES256`（ECDSA-SHA256。既定）か `RS256`（RSA-SHA256。フィーチャー `rs256` が動いているときだけ。ADR 0125）" }
    SAMLServiceProvider:
      type: object
      required: [id, entity_id, name, acs, slo, signing_certificates, require_signed_requests, name_id_format, attributes, sign_assertion, sign_response, allow_idp_initiated, assertion_lifetime, signing_alg, created_at, updated_at]
      properties:
        id: { type: string }
        entity_id: { type: string }
        name: { type: string }
        acs:
          type: array
          items: { $ref: "#/components/schemas/SAMLEndpoint" }
        slo:
          type: array
          items: { $ref: "#/components/schemas/SAMLEndpoint" }
        signing_certificates:
          type: array
          description: base64 の DER
          items: { type: string }
        require_signed_requests: { type: boolean }
        encryption_certificate: { type: string, description: base64 の DER（無ければ無い） }
        name_id_format: { type: string }
        name_id_source: { type: string }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/SAMLAttribute" }
        sign_assertion: { type: boolean }
        sign_response: { type: boolean }
        allow_idp_initiated: { type: boolean }
        assertion_lifetime: { type: integer }
        signing_alg: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SAMLServiceProviders:
      type: object
      required: [service_providers]
      properties:
        service_providers:
          type: array
          items: { $ref: "#/components/schemas/SAMLServiceProvider" }
    PermissionDef:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 162, description: "`<接頭辞>.<リソース>:<操作>`" }
        description: { type: string, maxLength: 256 }
    PermissionCatalogInput:
      type: object
      required: [display_name, permissions]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 64 }
        permissions:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PermissionDef" }
    PermissionCatalogCreate:
      allOf:
        - { $ref: "#/components/schemas/PermissionCatalogInput" }
        - type: object
          required: [prefix]
          properties:
            prefix: { type: string, minLength: 1, maxLength: 32 }
    PermissionCatalog:
      type: object
      required: [prefix, display_name, permissions, created_at, updated_at]
      properties:
        prefix: { type: string }
        display_name: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/PermissionDef" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PermissionCatalogs:
      type: object
      required: [catalogs]
      properties:
        catalogs:
          type: array
          items: { $ref: "#/components/schemas/PermissionCatalog" }
    OAuthResourceInput:
      type: object
      required: [uri, name, scopes]
      properties:
        uri: { type: string, maxLength: 2000, description: "`resource` の値（aud になる）" }
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 128 }
        clients:
          type: array
          maxItems: 100
          items: { type: string }
          description: 認可コードフローで `resource` に指定してよい連携先の client_id
        service_accounts:
          type: array
          maxItems: 100
          items: { type: string }
          description: client credentials で `resource` に指定してよいサービスアカウントの ID
        introspection_clients:
          type: array
          maxItems: 100
          items: { type: string }
          description: このリソースに向けたトークンをイントロスペクションしてよい連携先の client_id。空か省けばどの連携先でもよい（ADR 0120）
    OAuthResource:
      type: object
      required: [id, uri, name, scopes, clients, service_accounts, introspection_clients, created_at, updated_at]
      properties:
        id: { type: string }
        uri: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        clients: { type: array, items: { type: string } }
        service_accounts: { type: array, items: { type: string } }
        introspection_clients: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OAuthResources:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/OAuthResource" }
    WorkloadIdentityProviderInput:
      type: object
      required: [name, issuer, audiences]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        issuer: { type: string, maxLength: 2048, description: JWT の `iss`（https。完全一致） }
        audiences:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, maxLength: 1024 }
        jwks_uri: { type: string, maxLength: 2048, description: 鍵の URL（https。Discovery を飛ばす。`jwks` とは併せない） }
        jwks:
          type: object
          additionalProperties: true
          description: 固定の JWKS（公開鍵だけ。ネットワークに出ない。`jwks_uri` とは併せない）
        algorithms:
          type: array
          items: { type: string, enum: [RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384, ES512, EdDSA] }
        max_token_lifetime: { type: integer, minimum: 60, maximum: 86400, description: 秒。既定 3600 }
        disabled: { type: boolean }
    WorkloadIdentityProvider:
      type: object
      required: [id, name, issuer, audiences, algorithms, max_token_lifetime, disabled, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        issuer: { type: string }
        audiences: { type: array, items: { type: string } }
        jwks_uri: { type: string }
        jwks: { type: object, additionalProperties: true }
        algorithms: { type: array, items: { type: string } }
        max_token_lifetime: { type: integer }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkloadIdentityProviders:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/WorkloadIdentityProvider" }
    WorkloadIdentityCondition:
      type: object
      required: [claim]
      properties:
        claim: { type: string, maxLength: 256, description: JSON Pointer（RFC 6901） }
        equals: { type: string, maxLength: 1024 }
        in:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 1024 }
        prefix: { type: string, maxLength: 1024 }
    WorkloadIdentityBindingInput:
      type: object
      required: [service_account_id, conditions]
      properties:
        service_account_id: { type: string }
        conditions:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/WorkloadIdentityCondition" }
    WorkloadIdentityBinding:
      type: object
      required: [id, provider_id, service_account_id, conditions, created_at]
      properties:
        id: { type: string }
        provider_id: { type: string }
        service_account_id: { type: string }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/WorkloadIdentityCondition" }
        created_at: { type: string, format: date-time }
    WorkloadIdentityBindings:
      type: object
      required: [bindings]
      properties:
        bindings:
          type: array
          items: { $ref: "#/components/schemas/WorkloadIdentityBinding" }
    VCIDisplay:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        locale: { type: string, maxLength: 35, description: BCP 47 の言語タグ }
    VCIClaimInput:
      type: object
      required: [name, source]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: クレームの名前（最上位） }
        source: { type: string, description: "`user_id`・`email`・`email_verified`・`attribute:<key>`・`const`" }
        value: { description: "`const` の値（JSON の値）" }
        selectively_disclosable: { type: boolean, description: 選択的に開示できるクレームにするか（既定は真） }
        mandatory: { type: boolean }
        display:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/VCIDisplay" }
    VCIClaim:
      type: object
      required: [name, source, selectively_disclosable, mandatory]
      properties:
        name: { type: string }
        source: { type: string }
        value: {}
        selectively_disclosable: { type: boolean }
        mandatory: { type: boolean }
        display:
          type: array
          items: { $ref: "#/components/schemas/VCIDisplay" }
    VCICredentialConfigurationInput:
      type: object
      required: [configuration_id, format, vct, claims]
      properties:
        configuration_id: { type: string, maxLength: 128 }
        scope: { type: string, maxLength: 128 }
        format: { type: string, description: "`dc+sd-jwt`" }
        vct: { type: string, maxLength: 256 }
        display:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/VCIDisplay" }
        claims:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/VCIClaimInput" }
        validity: { type: integer, format: int64, description: 有効期間（秒。既定 90 日） }
        require_tx_code: { type: boolean }
    VCICredentialConfiguration:
      type: object
      required: [id, configuration_id, format, vct, display, claims, validity, require_tx_code, created_at, updated_at]
      properties:
        id: { type: string }
        configuration_id: { type: string }
        scope: { type: string, description: 無ければ省く }
        format: { type: string }
        vct: { type: string }
        display:
          type: array
          items: { $ref: "#/components/schemas/VCIDisplay" }
        claims:
          type: array
          items: { $ref: "#/components/schemas/VCIClaim" }
        validity: { type: integer, format: int64 }
        require_tx_code: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VCICredentialConfigurations:
      type: object
      required: [configurations]
      properties:
        configurations:
          type: array
          items: { $ref: "#/components/schemas/VCICredentialConfiguration" }
    VCIIssuedCredential:
      type: object
      required: [id, configuration_id, status_index, issued_at, expires_at]
      description: 発行した Verifiable Credential の記録（クレームの値は含めない。ADR 0119）
      properties:
        id: { type: string }
        configuration_id: { type: string }
        status_index: { type: integer, description: status list の番号 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    VCIIssuedCredentials:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items: { $ref: "#/components/schemas/VCIIssuedCredential" }
    SSFTransmitterInput:
      type: object
      required: [name, issuer, audience]
      properties:
        name: { type: string, maxLength: 200 }
        issuer: { type: string, maxLength: 512, description: SET の iss（完全一致） }
        enabled: { type: boolean, default: true }
        jwks_uri: { type: string, maxLength: 2048, description: 送信側の JWKS の URL（jwks とどちらか1つ） }
        jwks:
          type: object
          additionalProperties: true
          description: 送信側の公開鍵の JWK Set（jwks_uri とどちらか1つ）
        audience:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, maxLength: 512 }
          description: 受ける aud
        allowed_actions:
          type: array
          items:
            type: string
            enum: [revoke_sessions, revoke_password, suspend_user, record_device_posture]
          description: 許す動作。無ければ何もしない
        subject_connection: { type: string, description: iss_sub の対象を外部 ID で引く connection の slug }
        rotate_push_token: { type: boolean, description: 置き換えのとき、push_token を作り直す }
    SSFTransmitter:
      type: object
      required: [id, name, issuer, enabled, audience, allowed_actions, push_endpoint, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        issuer: { type: string }
        enabled: { type: boolean }
        jwks_uri: { type: string }
        jwks: { type: object, additionalProperties: true }
        audience: { type: array, items: { type: string } }
        allowed_actions: { type: array, items: { type: string } }
        subject_connection: { type: string }
        push_endpoint: { type: string, description: 送信側が SET を POST する URL }
        push_token: { type: string, description: 送信側が付ける Bearer の値（作成と作り直しの応答だけ） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SSFTransmitters:
      type: object
      required: [transmitters]
      properties:
        transmitters:
          type: array
          items: { $ref: "#/components/schemas/SSFTransmitter" }
    SSFStream:
      type: object
      required: [id, service_account_id, delivery_method, events_delivered, status, created_at, updated_at, delivery]
      properties:
        id: { type: string }
        service_account_id: { type: string }
        delivery_method: { type: string, enum: [push, poll] }
        endpoint_host: { type: string }
        events_delivered: { type: array, items: { type: string } }
        description: { type: string }
        status: { type: string, enum: [enabled, paused, disabled] }
        status_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        delivery:
          type: object
          required: [cursor_seq, failures]
          properties:
            cursor_seq: { type: integer, format: int64 }
            failures: { type: integer }
            last_error: { type: string }
            last_delivered_at: { type: string, format: date-time }
            next_attempt_at: { type: string, format: date-time }
    SSFStreams:
      type: object
      required: [streams]
      properties:
        streams:
          type: array
          items: { $ref: "#/components/schemas/SSFStream" }
