  /v1/admin/service-accounts/{id}/credentials:
    get:
      operationId: listServiceAccountCredentials
      summary: サービスアカウントの認証情報の一覧（無効化したものも含む）
      description: 権限 `service_accounts:manage`。作成の順。秘密は返さない。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceAccountCredential" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createServiceAccountCredential
      summary: 認証情報を足す（ADR 0074）
      description: |
        権限 `service_accounts:manage`。`api_key` は `Authorization: Bearer` でそのまま使う。`client_secret` と `private_key_jwt` は
        `POST /v1/admin/token` でアクセストークンに替える（`client_id` はサービスアカウントの ID）。
        `api_key` と `client_secret` は応答の `secret` を1度だけ返す（保存するのはハッシュだけ）。`private_key_jwt` は公開鍵の JWK
        （`public_key`）と `alg`（`ES256`・`EdDSA`・`ML-DSA-65`）が要る。使える認証情報は 10 個まで（`409 too_many_credentials`）。
        削除したサービスアカウントは `409 service_account_deleted`。`service_account.credential_created` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceAccountCredentialInput" }
      responses:
        "201":
          description: 足した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccountCredential" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

