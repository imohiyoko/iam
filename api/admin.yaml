        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspensions" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/token:
    post:
      operationId: issueServiceAccountToken
      summary: client credentials でアクセストークンを発行する（RFC 6749 4.4、ADR 0074）
      description: |
        認証はこの要求の中で行う（Bearer は要らない）。`client_secret` は `Authorization: Basic`（client_id と client_secret）か form の
        `client_id`・`client_secret` で、`private_key_jwt` は `client_assertion_type`（`urn:ietf:params:oauth:client-assertion-type:jwt-bearer`）と
        `client_assertion`（RFC 7523。`iss`・`sub` は client_id、`aud` は issuer、`exp` は 5 分以内、`jti` は1回だけ）で渡す。
        発行するのは不透明なトークンで、`Authorization: Bearer` で管理 API に使う。寿命は `service_accounts.token_ttl`。
        認証の失敗は理由を区別せず `401 invalid_client`。`service_account.token_issued` を監査ログに残す。
        フィーチャー service_accounts が動いていなければ `404 service_accounts_disabled`。

        フィーチャー `dpop` が動いていて `oidc.dpop.admin_url` があれば、`DPoP` ヘッダーの証明（RFC 9449。`htu` は
        `admin_url` + このパス）でトークンを鍵に結び付け、`token_type` を `DPoP` にする（ADR 0113）。結び付けたトークンは
        `Authorization: DPoP` と同じ鍵・`ath` の証明でだけ使え、`Bearer` では通らない。証明の誤りは `400 invalid_dpop_proof`、
        nonce が要るときは `400 use_dpop_nonce`（応答の `DPoP-Nonce` の値を使う）。

        `resource`（RFC 8707。フィーチャー `resource_indicators`。ADR 0112）を付けると、自前の API に向けたトークンを発行する。
        `resource` は登録したリソースの URI（1 つだけ）で、そのリソースがこのサービスアカウントを許していること。aud はその URI、
        スコープは `scope`（リソースのスコープの中から。省けばリソースのスコープのすべて）。このトークンは管理 API では使えず、
        リソースサーバーが `/oauth2/introspect` で確かめる。リソースが使えなければ `400 invalid_target`、スコープが許されて
        いなければ `400 invalid_scope`。フィーチャーが動いていないときに `resource` を付ければ `400 invalid_target`。

        フィーチャー `workload_identity`（ADR 0116）では、`grant_type=urn:ietf:params:oauth:grant-type:token-exchange`（RFC 8693）で
        外部の発行者の JWT（`subject_token`、`subject_token_type` は `urn:ietf:params:oauth:token-type:jwt` か `…:id_token`）を、
        登録した発行者と結び付けの条件で確かめてサービスアカウントのトークンに替える。クライアントの認証（`client_secret`・
        `client_assertion`・`Authorization`）・`actor_token` は付けない（`400 invalid_request`）。`client_id` はサービスアカウントの ID で、
        条件を満たす結び付けのサービスアカウントが 2 つ以上あるときに選ぶ。`audience` は受けない（`400 invalid_target`。`resource` を使う）。
        `requested_token_type` は省くか `urn:ietf:params:oauth:token-type:access_token`。確かめられなければ理由を区別せず
        `400 invalid_grant`。`resource`・`scope`・DPoP は client credentials と同じ。応答に `issued_token_type` を付ける。
        フィーチャーが動いていなければ `400 unsupported_grant_type`。
      security: []
      parameters:
        - { name: Authorization, in: header, schema: { type: string } }
        - { name: DPoP, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
                client_assertion_type: { type: string }
                client_assertion: { type: string }
                scope:
                  type: string
                  description: "`resource` を付けたときだけ使う（空白区切り）。管理 API 向けのトークンでは使わない（権限はロールの付与で決まる）"
                resource:
                  type: array
                  items: { type: string }
                  description: 自前の API の URI（RFC 8707。1 つだけ。フィーチャー `resource_indicators`）
                subject_token: { type: string, description: "交換する外部の JWT（RFC 8693。フィーチャー `workload_identity`）" }
                subject_token_type: { type: string }
                requested_token_type: { type: string }
                audience: { type: array, items: { type: string } }
                actor_token: { type: string }
                actor_token_type: { type: string }
      responses:
        "200":
          description: 発行した
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer, DPoP] }
                  expires_in: { type: integer }
                  scope: { type: string, description: "`resource` を付けたときの、許したスコープ（空白区切り）" }
                  issued_token_type: { type: string, description: "交換（RFC 8693）のとき `urn:ietf:params:oauth:token-type:access_token`" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/memberships:
    get:
      operationId: listUserMemberships
      summary: ユーザーの Membership の一覧（終了したものも含む。ADR 0097）
      description: 権限 `users:read`。作成時刻の順。フィーチャー org が動いていなければ `404 org_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 作成時刻の順
          content:
            application/json:
              schema:
                type: object
                required: [memberships]
                properties:
                  memberships:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/sessions:
    get:
      operationId: listUserSessions
      summary: ユーザーの有効なセッションの一覧（ADR 0097）
      description: |
        権限 `sessions:read`。失効・期限切れ・無操作の期限を過ぎたものは含めない（本人の一覧と同じ）。新しい順。
        IP と User-Agent は含めない（個人情報。監査ログで調べる）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 新しい順
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/sessions:revoke-all:
    post:
      operationId: revokeAllUserSessions
      summary: ユーザーの全セッションを失効させる（ADR 0097）
      description: |
        権限 `sessions:revoke`。全セッションを失効させ、連携先にも Back-Channel Logout で伝える。認証情報（passkey・外部 ID・
        TOTP・パスワード・リカバリーコード）は残す。認証情報も無効化するなら `credentials:revoke-all`（侵害時の初動）を使う。
        端末の紛失や、停止・権限の変更をすぐに効かせたいときに使う。失効は取り消せない。セッションが無くても 200
        （`sessions` は 0）。`session.revoked` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 失効させた
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: integer, description: 失効させたセッションの数 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/role-bindings:
    get:
      operationId: listUserRoleBindings
      summary: ユーザーに効くロールの付与の逆引き（ADR 0097）
      description: |
        権限 `roles:read`。ユーザーへの直接の付与と、所属する Group（`nested_groups` が有効なら含む Group も）への付与を、
        realm と Org の範囲をまとめて返す（作成時刻の順）。Group の付与は `via_group_id` にその Group を入れる。
        Org の範囲の付与は `org_id` に Org を入れる。Membership の `role`（org_role）から効く Org のロールは含めない。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: 公開のユーザー ID } }
      responses:
        "200":
          description: 作成時刻の順
          content:
            application/json:
              schema:
                type: object
                required: [bindings]
                properties:
                  bindings:
                    type: array
                    items: { $ref: "#/components/schemas/EffectiveRoleBinding" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/groups:
    get:
      operationId: listUserGroups
      summary: ユーザーが所属する Group の逆引き（ADR 0097）
      description: |
        権限 `groups:read`。realm と Org の範囲の Group を名前の順に返す。`nested_groups` が有効なら、所属する Group を含む
        Group も返す（`direct` が false）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: 公開のユーザー ID } }
      responses:
        "200":
          description: 名前の順
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/PrincipalGroup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/service-accounts/{id}/role-bindings:
    get:
      operationId: listServiceAccountRoleBindings
      summary: サービスアカウントに効くロールの付与の逆引き（ADR 0097）
      description: |
        権限 `roles:read`。サービスアカウントへの直接の付与と、所属する Group（`nested_groups` が有効なら含む Group も）への付与を、
        realm と Org の範囲をまとめて返す（作成時刻の順）。Group の付与は `via_group_id` にその Group を入れる。
        Org の範囲の付与は `org_id` に Org を入れる。Membership の `role`（org_role）から効く Org のロールは含めない。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: サービスアカウントの ID } }
      responses:
        "200":
          description: 作成時刻の順
          content:
            application/json:
              schema:
                type: object
                required: [bindings]
                properties:
                  bindings:
                    type: array
                    items: { $ref: "#/components/schemas/EffectiveRoleBinding" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/service-accounts/{id}/groups:
    get:
      operationId: listServiceAccountGroups
      summary: サービスアカウントが所属する Group の逆引き（ADR 0097）
      description: |
        権限 `groups:read`。realm と Org の範囲の Group を名前の順に返す。`nested_groups` が有効なら、所属する Group を含む
        Group も返す（`direct` が false）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: サービスアカウントの ID } }
      responses:
        "200":
          description: 名前の順
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/PrincipalGroup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/emails:
    post:
      operationId: addUserEmail
      summary: 運営者がユーザーにメールを足す（確認の経路 `admin`。ADR 0097）
      description: |
        権限 `users:emails`。運営者が所有を確かめたアドレスを、確認済み（`admin`）として足す。primary にはしない。
        呼び出し側が対象のロールの権限をすべて持っていなければ `403 permission_denied`（なりすましと同じ判定。ADR 0052）。
        realm の `verified_via` に `admin` が無ければ `400 verification_method_disabled`。アドレスが使われていれば
        `409 email_exists`（同じユーザーでも。自動リンクしない）。active でないユーザーは `409 user_not_active`。
        応答にアドレスは含めない。`email.added` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "201":
          description: 足した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserEmail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/emails/{email_id}:remove:
    post:
      operationId: removeUserEmail
      summary: 運営者がユーザーのメールを消す（ADR 0097）
      description: |
        権限 `users:emails` と、対象を上回ること（`addUserEmail` と同じ）。本人と同じ不変条件を守る：primary は
        `409 primary_email`（先に別のメールを primary にする）、最後の確認済みメールは `409 last_email`、消すとログインの
        手段が無くなるなら `409 last_method`、Membership に結び付けたメールは `409 email_bound_to_membership`。
        `email.removed` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: email_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 消した }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/emails/{email_id}:make-primary:
    post:
      operationId: makeUserEmailPrimary
      summary: 運営者がユーザーの primary のメールを変える（ADR 0097）
      description: |
        権限 `users:emails` と、対象を上回ること。確認済みのメールだけ（未確認は `409 email_unverified`）。既に primary なら
        何もせず 204。`email.primary_changed` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: email_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 変えた }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/connections/{id}:
    get:
      operationId: getConnection
      summary: IdP 接続を返す（ADR 0097）
      description: 権限 `connections:read`。クライアントシークレットは返さない。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConnection" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateConnection
      summary: IdP 接続のクライアント ID・シークレット・戻り先を置き換える（ADR 0097）
      description: |
        権限 `connections:manage`。slug・種類・プロバイダのエンドポイントは変えない。`client_secret` を省けば今の値のまま
        （新しい値は封をして保存し、応答にも監査ログにも出さない）。値の誤りは `400 invalid_connection`。Org 専用 SSO の
        connection は Org の owner が扱うので `409 org_connection`。変えても既存の外部 ID の紐付けとセッションはそのまま。
        `connection.updated` を監査ログに残す（変えた項目の名前だけ）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uris]
              properties:
                client_id: { type: string, minLength: 1, maxLength: 2048 }
                client_secret: { type: string, minLength: 1, maxLength: 2048 }
                redirect_uris:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: 置き換えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/connections/{id}:delete:
    post:
      operationId: deleteConnection
      summary: IdP 接続を消す（ADR 0097）
      description: |
        権限 `connections:manage`。有効な外部 ID の紐付けが残っていれば、既定では消さずに `409 connection_in_use`
        （`message` にその数）。`revoke_identities: true` なら紐付けを無効化（理由 `connection_deleted`）してから消す。その外部 ID で
        作ったセッションは、遅くとも `validity_max_delay` の後に使えなくなる。その外部 ID しかログインの手段が無いユーザーは
        復旧の手順で戻る。Org 専用 SSO の connection は `409 org_connection`。`connection.deleted` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revoke_identities: { type: boolean, default: false }
      responses:
        "200":
          description: 消した
          content:
            application/json:
              schema:
                type: object
                required: [identities_revoked]
                properties:
                  identities_revoked: { type: integer, description: 無効化した外部 ID の紐付けの数 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/signing-keys:
    get:
      operationId: listSigningKeys
      summary: ID トークンの署名鍵の一覧（ADR 0097）
      description: |
        権限 `signing_keys:read`。作成時刻の順。秘密鍵も公開鍵も返さない（公開鍵は JWKS で配る）。`state` は `active`（署名に
        使っている）、`retired`（署名をやめ、`published_until` まで JWKS に残す）、`expired`（JWKS から外れ、次の参照で消える）。
      responses:
        "200":
          description: 作成時刻の順
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/AdminSigningKey" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/realms:
    get:
      operationId: listRealms
      summary: realm の一覧（複数 realm。design.md 11.1、ADR 0083）
      description: |
        権限 `realms:manage`。既定の realm の管理 API だけが受け付ける（他の realm では `404 realm_management_unavailable`）。
        フィーチャー multi_realm が動いていなければ `404 multi_realm_disabled`。
      responses:
        "200":
          description: ID の順（既定の realm も含む）
          content:
            application/json:
              schema:
                type: object
                required: [realms]
                properties:
                  realms:
                    type: array
                    items: { $ref: "#/components/schemas/Realm" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createRealm
      summary: realm を作る（ADR 0083）
      description: |
        権限 `realms:manage`（既定の realm の管理 API だけ）。`hosts` を渡せばそのホスト名で、渡さなければ `/realms/{slug}` で指す。
        `settings` で省いた項目は設定ファイルの `realm` の値になる。作った realm の運営者は `…/operators` で作る。
        `realm.created` を監査ログに残す。slug かホスト名が使われていれば `409 realm_taken`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealmInput" }
      responses:
        "201":
          description: 作った
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Realm" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/realms/{realm_id}:
    get:
      operationId: getRealm
      summary: realm を返す
      description: 権限 `realms:manage`（既定の realm の管理 API だけ）。
      parameters:
        - { name: realm_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: realm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Realm" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateRealm
      summary: realm のホスト名と設定を変える
      description: |
        権限 `realms:manage`（既定の realm の管理 API だけ）。渡した項目だけを変える（`hosts` は置き換え、`settings` は項目ごと）。
        既定の realm は設定ファイルで変える（`409 default_realm`）。他のインスタンスには `validity_max_delay` の内に反映する。
        `realm.updated` を監査ログに残す。
      parameters:
        - { name: realm_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealmUpdate" }
      responses:
        "200":
          description: 変えた後
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Realm" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/realms/{realm_id}/operators:
    post:
      operationId: createRealmOperator
      summary: realm の運営者を作る（最初の運営者を置く）
      description: |
        権限 `realms:manage`（既定の realm の管理 API だけ）。`iam operator create` と同じく、メールで realm のユーザーを作り（あれば
        そのユーザー）、運営者のロールを付けて、1回限りのログイン用リンクのトークンを返す。トークンは本人にだけ渡す。
      parameters:
        - { name: realm_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { type: string, default: "realm:owner" }
                ttl_seconds: { type: integer, format: int64, minimum: 60, maximum: 86400, description: トークンの寿命。既定は 15 分 }
      responses:
        "201":
          description: 作った
          content:
            application/json:
              schema:
                type: object
                required: [user_id, created, login_token, login_url]
                properties:
                  user_id: { type: string }
                  created: { type: boolean, description: ユーザーを作ったか }
                  login_token: { type: string }
                  login_url: { type: string, description: ログイン画面のリンク（server.public_url が無ければ空） }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: 監査ログの照会（ADR 0100）
      description: |
        権限 `audit:read`。この realm のイベントを新しい順（seq の降順）に、`limit` 件ずつ返す。続きは `next_cursor` を `after` に渡す。
        条件はすべて AND。時刻は `since` 以上 `until` 未満。`type_prefix` は前方一致（`login.` など）。`target_id` は details の
        `*_id` のどれかに一致する ID（対象のユーザー・Membership など）。保持期間で切り詰めたイベントは返らない（ADR 0072）。
        `include_client_data=true` なら、暗号化した IP と User-Agent の全文を復号して `client` に入れる。権限 `audit:read_client_data` が要り、
        読めないもの（保持期間・アカウントの削除の後）は `client_unreadable: true`。
        照会そのものを `audit.read` として監査ログに残す（条件・件数・全文を読んだか）。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: after, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: type, in: query, schema: { type: string, maxLength: 100 } }
        - { name: type_prefix, in: query, schema: { type: string, maxLength: 100 } }
        - { name: result, in: query, schema: { type: string, enum: [success, failure] } }
        - { name: actor_type, in: query, schema: { type: string, maxLength: 50 } }
        - { name: actor_id, in: query, schema: { type: string, maxLength: 200 } }
        - { name: org_id, in: query, schema: { type: string, maxLength: 200 } }
        - { name: target_id, in: query, schema: { type: string, maxLength: 200 } }
        - { name: include_client_data, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: 新しい順
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  next_cursor: { type: string, description: 続きがあるときだけ }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/audit-events/{id}:
    get:
      operationId: getAuditEvent
      summary: 監査ログのイベントを1件返す（ADR 0100）
      description: |
        権限 `audit:read`。この realm のイベントだけ。保持期間で切り詰めたものは 404。`include_client_data` は一覧と同じ。
        `audit.read` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: include_client_data, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: イベント
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/audit-events:verify:
    post:
      operationId: verifyAuditChain
      summary: 監査ログのハッシュチェーンを、seq の範囲を指定して検証する（ADR 0100）
      description: |
        権限 `audit:read`。チェーンは全 realm で1本なので、既定の realm だけで使える（ほかの realm では 404）。
        `from_seq` を省くか切り詰めた位置以前なら残っている先頭（チェックポイントの次）から、`to_seq` を省くか最新より後なら最新まで。
        1回に 100000 件まで（超えれば `400 range_too_large`。範囲を分けて呼び、前の `last_hash` と次の `prev_hash` を突き合わせる）。
        先頭から検証したとき（`anchored: true`）は、`prev_hash` が Genesis かチェックポイントのハッシュになる。
        検証の途中で保持期間の掃除が範囲の先頭を消したら `409 truncated_during_verification`（やり直す）。
        結果を `audit.verified`（失敗なら result が failure）として監査ログに残す。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from_seq: { type: integer, format: int64, minimum: 1 }
                to_seq: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: "検証の結果（壊れていれば `valid: false` と `broken`）"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditChainVerification" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/event-subscriptions:
    get:
      operationId: listEventSubscriptions
      summary: イベントの Webhook の購読の一覧（ADR 0100）
      description: |
        権限 `event_subscriptions:manage`。作成の順。署名の鍵は返さない。
        フィーチャー event_subscriptions が動いていなければ `404 event_subscriptions_disabled`。
      responses:
        "200":
          description: 作成の順
          content:
            application/json:
              schema:
                type: object
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: "#/components/schemas/EventSubscription" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createEventSubscription
      summary: イベントの Webhook の購読を作る（ADR 0100）
      description: |
        権限 `event_subscriptions:manage`。この realm の監査ログのイベントを、作った時点の後から `url` に POST する（`{"events": [...]}`）。
        `url` は https（開発ビルドだけ http）で、公開のアドレスに限る（`400 invalid_url`。送るときにも、つなぐ先のアドレスで確かめる）。
        `event_types` は種類（`login.succeeded`）か、`.` で終わる前方一致（`login.`）を 20 個まで。省けばすべて（`400 invalid_event_types`）。
        `pii` は切り詰めた IP と User-Agent の大分類の出し方で、`omit`（既定）か `pseudonymize`（`400 invalid_pii`）。全文は出さない。
        署名の鍵 `secret` はこの応答でだけ返す（`X-IAM-Signature: t=<UNIX 秒>,v1=<hex(HMAC-SHA-256(secret, "<t>." + 本文))>`）。
        realm に 20 まで（`409 subscription_limit`）。`event_subscription.created` を監査ログに残す（URL はホスト名だけ）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventSubscriptionInput" }
      responses:
        "201":
          description: 作った
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSubscriptionWithSecret" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/event-subscriptions/{id}:
