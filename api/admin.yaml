                  service_accounts:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceAccount" }
                  next_cursor: { type: string, description: 続きがあるときだけ }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createServiceAccount
      summary: サービスアカウントを作る（design.md 11.2、ADR 0074）
      description: |
        権限 `service_accounts:manage`。`org_id`（共有 Org の公開 ID）を渡せば、その Org に属する（Org が削除・停止・有効期間の外なら使えない。
        フィーチャー org が要る）。認証情報は `…/credentials` で足し、権限は `/v1/admin/role-bindings`（`principal_type: service_account`）で付ける。
        `service_account.created` を監査ログに残す。フィーチャー service_accounts が動いていなければ `404 service_accounts_disabled`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceAccountInput" }
      responses:
        "201":
          description: 作った
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccount" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/service-accounts/{id}:
    get:
