openapi: 3.0.3
info:
  title: IAM admin API
  version: v1
  description: |
    管理 API。公開 API とはポートを分ける（design.md 2.5）。

    認証：`Authorization: Bearer <トークン>`。サービスアカウントの API キーか、運営者のセッションのトークン（design.md 4.11）。
    運営者のセッションでは、直近の認証（`security.session.max_auth_age` 以内）を求める。過ぎていれば
    `401 reauthentication_required`。権限は組み込みのロール（`realm:owner` など）で判定する。
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: ヘルスチェック
      security: []
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: 依存先（Storage など）に問題がある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/admin/notifications/{id}:claim:
    post:
      operationId: claimNotification
      summary: 通知の秘密と宛先を1回だけ取り出す
      description: |
        配信用のサービスアカウント（`notifications:claim`）だけが呼べる（design.md 2.4）。
        無い・期限切れ・取り出し済みは区別せず 404。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 取り出した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimedNotification" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users:
    post:
      operationId: createUser
      summary: ユーザーを登録する（確認の経路 `admin`。4.1）
      description: |
        運営者が所有を確かめたメールアドレスで登録する。権限 `users:create`。
        アドレスが使われていれば `409 email_exists`（自動リンクしない。4.2）。
        realm の `verified_via` に `admin` が無ければ `400 verification_method_disabled`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id: { type: string, description: 公開のユーザー ID }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:login_link:
    post:
      operationId: issueLoginLink
      summary: 1回限りのログイン用リンクのトークンを発行する
      description: |
        権限 `users:login_link`。トークンは `POST /v1/login/link:redeem` に渡す（ホスト型ログイン画面ではリンクにする）。
        `id` は公開のユーザー ID。有効期間は既定 15 分、上限 24 時間。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: { type: integer, minimum: 1, maximum: 86400 }
      responses:
        "200":
          description: 発行した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginLink" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:recovery_link:
    post:
      operationId: issueRecoveryLink
      summary: 1回限りの復旧用リンクのトークンを発行する（4.12）
      description: |
        権限 `users:recover`。IAM の外で本人確認した後に使う（他の経路で戻れない人のため）。トークンは
        `POST /v1/recovery/link:redeem` に渡す。使うと復旧専用のセッションになる。`reason` は必須で、監査ログに出す。
        有効期間は既定 15 分、上限 24 時間。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
                ttl_seconds: { type: integer, minimum: 1, maximum: 86400 }
      responses:
        "200":
          description: 発行した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginLink" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/credentials:
    get:
      operationId: listUserCredentials
      summary: ユーザーの有効な認証情報の一覧（無効化の対象を選ぶため）
      description: 権限 `credentials:revoke`。メールアドレスなどの個人情報は含めない。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 作成時刻の順
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCredentials" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/credentials/{credential_id}:revoke:
    post:
      operationId: revokeUserCredential
      summary: ユーザーの passkey・外部 ID の紐付け・TOTP を無効化する（4.6）
      description: |
        権限 `credentials:revoke`。`credential_id` は公開 ID（`psk_…`、`idn_…`、`otp_…`）。本人と違い、最後の1つも
        無効化できる（以後は復旧の手順で戻る）。取り消せない。その認証情報で作ったセッションは、遅くとも
        `validity_max_delay` の後に使えなくなる。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: credential_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 無効化した }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/password:revoke:
    post:
      operationId: revokeUserPassword
      summary: ユーザーのパスワードを無効化する（フィーチャー password）
      description: |
        権限 `credentials:revoke`。再設定は復旧の手順で行う。ユーザーの全セッションを失効させる。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 無効化した }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/credentials:revoke-all:
    post:
      operationId: revokeAllUserCredentials
      summary: 侵害時の初動として、ユーザーの全認証情報と全セッションを無効化する（4.6）
      description: |
        権限 `credentials:revoke`。passkey・外部 ID の紐付け・TOTP・パスワード・リカバリーコードを無効化し、全セッションを失効させる。
        メールは残す（復旧の経路。4.12）。取り消せない。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 無効化した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokedCredentials" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:
    patch:
      operationId: updateUser
      summary: ユーザーの有効期間を変更する（4.8）
      description: |
        権限 `users:update`。`valid_from`・`valid_until` の両方を置き換える（省略か null は制限なし）。期間の外では
        ログインできず、既存のセッションも境界の時刻ちょうどに使えなくなる。境界の時刻に `user.validity_started`・
        `user.validity_ended` を監査ログに出す（判定はこの処理の遅れに左右されない）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200":
          description: 変更した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:delete:
    post:
      operationId: deleteUser
      summary: ユーザーを削除する（4.10）
      description: |
        権限 `users:delete`。既定は realm の `user_deletion_grace` の後に消す（その間は取り消せる）。`immediate` なら今消す
        （`legal_hold` が立っていれば予約にする）。共有 Org の最後のオーナーの間は `409 last_owner`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                immediate: { type: boolean, default: false }
      responses:
        "200":
          description: 削除を予約した（か、削除した）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:cancel-deletion:
    post:
      operationId: cancelUserDeletion
      summary: ユーザーの削除の予定を取り消す
      description: 権限 `users:delete`。予定が無ければ `409 deletion_not_scheduled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 取り消した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:legal-hold:
    post:
      operationId: setUserLegalHold
      summary: ユーザーの消去を保留する・保留を解く（4.10）
      description: |
        権限 `users:legal_hold`。保留の間は猶予期間が終わっても消さない（`user.deletion_held` を残す）。保留を解いたときに
        猶予が終わっていれば、次の回に消す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold]
              properties:
                hold: { type: boolean }
      responses:
        "200":
          description: 変更した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/suspensions:
    post:
      operationId: suspendUser
      summary: ユーザーを停止する（4.7）
      description: |
        権限は種別ごと（`suspensions:<category>`。realm で足した種別は `realm:owner` だけ）。`starts_at` を省略か過去なら
        今から、未来なら予約。`ends_at` を省略で無期限。重ねられ、1つでも有効なら停止中。停止中はログインできず、
        既存のセッションも使えない（遅くとも `validity_max_delay` の後。予約は開始の時刻ちょうど）。本人には
        `suspended.<category>` だけを返し、`reason` は見せない。`external_ref` が同じ停止（対象と種別も同じ）が
        あれば、新しく作らず 200 でそれを返す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuspendRequest" }
      responses:
        "200":
          description: 同じ external_ref の停止が既にある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "201":
          description: 停止した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      operationId: listUserSuspensions
      summary: ユーザーの停止の一覧（解除・終了したものも含む）
      description: 権限 `suspensions:read`。開始の時刻の順。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspensions" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/suspensions/{id}:lift:
    post:
      operationId: liftSuspension
      summary: 停止を解除する
      description: |
        権限は停止と同じ種別ごと。本人は自分の停止を解除できない。既に解除・終了していれば何もせず 200。
        停止をまたいだセッション（停止の前に認証したもの）は戻らない（再ログインが要る）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiftRequest" }
      responses:
        "200":
          description: 解除した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/sessions/{id}:revoke:
    post:
      operationId: revokeSession
      summary: セッションを失効させる
      description: 権限 `sessions:revoke`。既に失効していても 204。反映は `validity_max_delay` 以内（5.3）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 失効した }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/connections:
    post:
      operationId: createConnection
      summary: IdP 接続（OAuth / OIDC）を登録する
      description: |
        権限 `connections:manage`。プリセット（`google`）にクライアント ID・シークレット・戻り先の許可リストを足す。
        シークレットは封をして保存し、応答にも監査ログにも出さない。`slug` は公開 API のパスに使う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, preset, client_id, client_secret, redirect_uris]
              properties:
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
                preset: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
                redirect_uris:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema:
                type: object
                required: [id, slug]
                properties:
                  id: { type: string }
                  slug: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs:
    post:
      operationId: createOrg
      summary: 共有 Org を作り、ユーザーを owner にする（運営者。realm の `org_creation` に関わらず作れる。4.11）
      description: 権限 `orgs:create`。フィーチャー org が動いていなければ `404 org_disabled`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner_id]
              properties:
                name: { type: string, maxLength: 400 }
                owner_id: { type: string, description: 公開のユーザー ID }
      responses:
        "201":
          description: 作った
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}:
    patch:
      operationId: updateOrg
      summary: Orgの有効期間を変更する（4.8）
      description: |
        権限 `orgs:update`。`valid_from`・`valid_until` の両方を置き換える（省略か null は制限なし）。期間の外か停止中の Org にはメンバーが入れず、その Org を active にしているセッションは Org の操作ができない（個人 Org への切り替えはできる）。
        境界の時刻に `org.validity_started`・`org.validity_ended` を監査ログに出す。個人 Org（とその Membership）は
        `409 personal_org`。フィーチャー org が動いていなければ `404 org_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Validity" }
      responses:
        "200":
          description: 変更した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: getOrg
      summary: Org を返す
      description: 権限 `orgs:read`。フィーチャー org が動いていなければ `404 org_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Org
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}:delete:
    post:
      operationId: deleteOrg
      summary: 共有 Org を削除する（4.10）
      description: |
        権限 `orgs:delete`。既定は realm の `org_deletion_grace` の後に削除する（その間は取り消せる）。`immediate` なら今削除する。
        個人 Org はユーザーと一緒に消すので `409 personal_org`。フィーチャー org が動いていなければ `404 org_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                immediate: { type: boolean, default: false }
      responses:
        "200":
          description: 削除を予約した（か、削除した）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}:cancel-deletion:
    post:
      operationId: cancelOrgDeletion
      summary: Org の削除の予定を取り消す
      description: 権限 `orgs:delete`。予定が無ければ `409 deletion_not_scheduled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 取り消した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/memberships:
    get:
      operationId: listOrgMemberships
      summary: Org の Membership の一覧（終了したものも含む）
      description: 権限 `orgs:read`。Membership の公開 ID の順に、`limit` 件ずつ返す。続きは `next_cursor` を `after` に渡す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: after, in: query, schema: { type: string } }
      responses:
        "200":
          description: Membership の公開 ID の順
          content:
            application/json:
              schema:
                type: object
                required: [memberships]
                properties:
                  memberships:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
                  next_cursor: { type: string, description: 続きがあるときだけ }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/orgs/{id}/suspensions:
    post:
      operationId: suspendOrg
      summary: Orgを停止する（4.7）
      description: |
        権限と `external_ref` の扱いはユーザーの停止と同じ。期間の外か停止中の Org にはメンバーが入れず、その Org を active にしているセッションは Org の操作ができない（個人 Org への切り替えはできる）。停止を解除すれば戻る（ユーザーの停止と違い、
        セッションは失効させない）。個人 Org（とその Membership）は止められない（`409 personal_org`）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuspendRequest" }
      responses:
        "200":
          description: 同じ external_ref の停止が既にある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "201":
          description: 停止した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listOrgSuspensions
      summary: Orgの停止の一覧（解除・終了したものも含む）
      description: 権限 `suspensions:read`。開始の時刻の順。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspensions" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/memberships/{id}:
    patch:
      operationId: updateMembership
      summary: Membershipの有効期間を変更する（4.8）
      description: |
        権限 `orgs:update`。`valid_from`・`valid_until` の両方を置き換える（省略か null は制限なし）。期間の外か停止中の Membership の本人は、その Org にだけ入れない。
        境界の時刻に `membership.validity_started`・`membership.validity_ended` を監査ログに出す。個人 Org（とその Membership）は
        `409 personal_org`。フィーチャー org が動いていなければ `404 org_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Validity" }
      responses:
        "200":
          description: 変更した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/memberships/{id}/suspensions:
    post:
      operationId: suspendMembership
      summary: Membershipを停止する（4.7）
      description: |
        権限と `external_ref` の扱いはユーザーの停止と同じ。期間の外か停止中の Membership の本人は、その Org にだけ入れない。停止を解除すれば戻る（ユーザーの停止と違い、
        セッションは失効させない）。個人 Org（とその Membership）は止められない（`409 personal_org`）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuspendRequest" }
      responses:
        "200":
          description: 同じ external_ref の停止が既にある
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "201":
          description: 停止した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspension" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listMembershipSuspensions
      summary: Membershipの停止の一覧（解除・終了したものも含む）
      description: 権限 `suspensions:read`。開始の時刻の順。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suspensions" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: サービスアカウントの API キーか、運営者のセッションのトークン。
  responses:
    Error:
      description: エラー
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Org:
      type: object
      required: [id, kind, created_at]
      properties:
        id: { type: string, description: 公開の Org ID }
        kind: { type: string, enum: [personal, shared] }
        name: { type: string }
        personal_owner_id: { type: string, description: 個人 Org の持ち主（公開のユーザー ID） }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        deletion_scheduled_at: { type: string, format: date-time, description: 削除の予定（猶予期間の終わり） }
        deleted_at: { type: string, format: date-time, description: 削除した時刻 }
        created_at: { type: string, format: date-time }
    Membership:
      type: object
      required: [id, user_id, org_id, status, role, created_at]
      properties:
        id: { type: string }
        user_id: { type: string, description: 公開のユーザー ID }
        org_id: { type: string }
        status: { type: string, enum: [invited, active, ended] }
        role: { type: string, enum: [owner, admin, member] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        ended_reason: { type: string }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string, description: 運営者向けの説明（秘密や個人情報は含めない） }
    ClaimedNotification:
      type: object
      required: [to, expires_at]
      properties:
        to: { type: string, description: 宛先のメールアドレス }
        code: { type: string, description: 確認コード }
        token: { type: string, description: マジックリンクのトークン（リンク先のアプリが verify に渡す） }
        expires_at: { type: string, format: date-time }
    LoginLink:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string, description: 1回限り。本人以外に渡さない }
        expires_at: { type: string, format: date-time }
    UserCredentials:
      type: object
      required: [passkeys, identities, totp]
      properties:
        passkeys:
          type: array
          items: { $ref: "#/components/schemas/UserPasskey" }
        identities:
          type: array
          items: { $ref: "#/components/schemas/UserIdentity" }
        totp:
          type: array
          items: { $ref: "#/components/schemas/UserTOTP" }
        password: { $ref: "#/components/schemas/UserPassword" }
    UserPasskey:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    UserIdentity:
      type: object
      required: [id, connection, created_at]
      properties:
        id: { type: string }
        connection: { type: string, description: connection の slug }
        created_at: { type: string, format: date-time }
    UserTOTP:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
    UserPassword:
      type: object
      description: 設定したパスワード（無ければ省略）
      required: [created_at]
      properties:
        created_at: { type: string, format: date-time }
    RevokedCredentials:
      type: object
      required: [passkeys, identities, totp, password, recovery_codes, sessions]
      properties:
        passkeys: { type: integer }
        identities: { type: integer }
        totp: { type: integer }
        password: { type: boolean }
        recovery_codes: { type: integer, description: 消した未使用のリカバリーコードの数 }
        sessions: { type: integer, description: 失効させたセッションの数 }
    Validity:
      type: object
      properties:
        valid_from: { type: string, format: date-time, nullable: true }
        valid_until: { type: string, format: date-time, nullable: true }
    UpdateUser:
      type: object
      properties:
        valid_from: { type: string, format: date-time, nullable: true }
        valid_until: { type: string, format: date-time, nullable: true }
    AdminUser:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [active, deleted, merged] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        deletion_scheduled_at: { type: string, format: date-time, description: 削除の予定（猶予期間の終わり） }
        legal_hold: { type: boolean }
    SuspendRequest:
      type: object
      required: [category, reason]
      properties:
        category: { type: string, description: "tos_violation / customer_request / security_risk / billing / realm で足したもの" }
        reason: { type: string, minLength: 1, maxLength: 1000, description: 内部向けの理由（監査ログに出し、本人には見せない） }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        external_ref: { type: string, maxLength: 200, description: 外部のシステム（課金など）の参照。冪等にする }
    LiftRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    Suspension:
      type: object
      required: [id, target_type, target_id, category, reason, starts_at, active, created_at]
      properties:
        id: { type: string }
        target_type: { type: string, enum: [user, org, membership] }
        target_id: { type: string, description: 対象の公開 ID }
        user_id: { type: string, description: ユーザーと Membership の停止で、本人の公開 ID }
        category: { type: string }
        reason: { type: string }
        external_ref: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        active: { type: boolean, description: 今停止中か }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        lifted_at: { type: string, format: date-time }
        lifted_by: { type: string }
    Suspensions:
      type: object
      required: [suspensions]
      properties:
        suspensions:
          type: array
          items: { $ref: "#/components/schemas/Suspension" }
