      description: 権限 `permission_catalogs:manage`。接頭辞の順。
      responses:
        "200":
          description: カタログ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionCatalogs" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createPermissionCatalog
      summary: 連携先の権限のカタログを登録する（ADR 0121）
      description: |
        権限 `permission_catalogs:manage`。連携先の権限は `<接頭辞>.<リソース>:<操作>` の形で、カタログにある権限（と、カタログに
        あるリソースの `<接頭辞>.<リソース>:*`）だけを独自のロール・トークンのスコープ・要件に使える。`prefix` は
        `^[a-z][a-z0-9-]{0,31}$`（realm の中で一意。作成後は変えられない）。`permissions` はすべてこの接頭辞の下で、操作の `*` は
        使えない（500 個まで）。内容が正しくなければ `400 invalid_catalog`、`prefix` が重複すれば `409 catalog_exists`。
        `permission_catalog.created` を監査ログに残す。
