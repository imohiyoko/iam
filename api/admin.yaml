      responses:
        "204":
          description: 消した
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/clients/{id}/token-exchange:
    get:
      operationId: getClientTokenExchange
      summary: 連携先に許す Token Exchange（RFC 8693）を返す（ADR 0099）
      description: |
        権限 `clients:manage`。フィーチャー `token_exchange` が動いていなければ `404 token_exchange_disabled`。
        何も許していなければ、空の `audiences` を返す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 許している交換
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenExchangePolicy" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setClientTokenExchange
      summary: 連携先に許す Token Exchange を置き換える（ADR 0099）
      description: |
        権限 `clients:manage`。既定は何も許さない。`audiences` に、交換で発行するトークンの aud に選べるもの（この realm の連携先の
        client_id か、絶対 URI の資源。RFC 8707）を並べる。`audiences` が空なら何も許さない（`subject_clients` と `impersonation` も
        持てない）。`subject_clients` は、この連携先自身のほかに subject_token の aud として受け付ける連携先の client_id。
        `impersonation` はなりすましを許す（フィーチャー `impersonation` が動いていなければ `400 invalid_client_metadata`）。
        公開クライアント（`none`）には許せない。それぞれ 20 件まで。`client.token_exchange_updated` を監査ログに残す。
        フィーチャー `token_exchange` が動いていなければ `404 token_exchange_disabled`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenExchangePolicy" }
      responses:
        "200":
          description: 置き換えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenExchangePolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/signing-keys:rotate:
    post:
      operationId: rotateSigningKey
      summary: ID トークンの署名鍵を新しくする（9.3）
      description: |
        権限 `signing_keys:rotate`（realm:owner）。新しい鍵で署名を始め、古い鍵は `oidc.retired_key_ttl` の間 JWKS に残す。
        `RS256` はフィーチャー `rs256` が動いているときだけ（ADR 0122）。`signing_key.rotated` を監査ログに残す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alg]
              properties:
                alg: { type: string, enum: [ES256, ML-DSA-65, RS256] }
      responses:
        "200":
          description: 新しい鍵
          content:
            application/json:
              schema:
                type: object
                required: [kid, alg]
                properties:
                  kid: { type: string }
                  alg: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/attributes:
    get:
      operationId: listAttributeDefs
      summary: カスタム属性の定義の一覧（design.md 11.7、ADR 0080）
      description: |
        権限 `attributes:read`。key の順。フィーチャー custom_attributes が動いていなければ `404 attributes_disabled`。
      responses:
        "200":
          description: key の順
          content:
            application/json:
              schema:
                type: object
                required: [attributes]
                properties:
                  attributes:
                    type: array
                    items: { $ref: "#/components/schemas/AttributeDef" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAttributeDef
      summary: カスタム属性を定義する
      description: |
        権限 `attributes:manage`。`key` は `^[a-z][a-z0-9_]{0,39}$`。`type` は `string`（`max_length` 1〜1024、既定 256）・
        `integer`（±2^53−1）・`boolean`・`enum`（`values` に 1〜50 個）。`type` と `encrypted` は後から変えられない。
        `encrypted` なら値をユーザーのデータ鍵で暗号化する（ユーザーの削除で読めなくなる）。`in_token` ならスコープ `attributes` の
        ID トークン・UserInfo の `attributes` クレームに載せる。realm に 50 まで（`409 attribute_limit`）。同じ key は `409 attribute_exists`、
        定義の誤りは `400 invalid_attribute`。`attribute.defined` を監査ログに残す。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttributeDefInput" }
      responses:
        "201":
          description: 定義した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttributeDef" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/attributes/{key}:
    put:
      operationId: updateAttributeDef
      summary: カスタム属性の定義を変える
      description: |
        権限 `attributes:manage`。`values`・`max_length`・`user_editable`・`in_token` を置き換える（`type` と `encrypted` は変えない）。
        制約を厳しくしても、既にある値はそのまま（次に書くときに確かめる）。`attribute.updated` を監査ログに残す。
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
