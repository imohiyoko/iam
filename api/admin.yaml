    post:
      operationId: deleteServiceAccount
      summary: サービスアカウントを削除する（論理削除）
      description: |
        権限 `service_accounts:manage`。すぐに認証できなくなり、発行済みのアクセストークンも使えない。取り消せない。
        `service_account.deleted` を監査ログに残す。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 削除した（削除済みならそのまま）
          content:
            application/json:
